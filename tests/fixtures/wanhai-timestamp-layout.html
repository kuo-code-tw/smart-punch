<!doctype html>
<html lang="zh-Hant" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORT79 timestamp and card-height browser fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14263e;color:#eaf3ff;font-family:Arial,"Microsoft JhengHei",sans-serif}
#systems{padding:18px 10px}#p79Dashboard{max-width:1400px;margin:auto}
.p79d-panels{display:grid;gap:10px}.p79d-ship-panels{grid-template-columns:repeat(3,minmax(0,1fr))}
.p79d-panel{border:1px solid #37516e;border-radius:11px;padding:10px;background:#1a304d}
.p79d-panel-title{display:flex;align-items:center;justify-content:space-between;height:28px}
.p79d-panel-title b{font-size:12px}
.p79-schedule-list{display:flex;flex-direction:column;overflow-y:auto;gap:5px}
.p79-schedule-row{display:grid;width:100%;border:1px solid #526f8a;border-radius:8px;padding:8px;text-align:left}
</style>
<link rel="stylesheet" href="../../assets/port79-monthly-dashboard.css">
<link rel="stylesheet" href="../../assets/port79-reference-dashboard.css">
<style>
/* Simulate the real efficiency-week-month-pager.js styles injected AFTER CSS. */
.p79-eff-pager{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:7px 1px 9px}
.p79-eff-pager button{appearance:none;border:1px solid #dbe6f3;background:#fff;color:#356994;border-radius:9px;cursor:pointer;font-size:12px;font-weight:800;line-height:1.2;padding:7px 10px;min-height:32px}
.p79-eff-pager button[aria-pressed="true"]{background:#1687e8;border-color:#1687e8;color:white}
.p79-eff-pager .p79-eff-modes,.p79-eff-pager .p79-eff-arrows{display:flex;align-items:center;gap:5px}
.p79-eff-pager .p79-eff-arrows button{font-size:19px;padding:3px 9px;min-width:30px}
.p79-eff-pager .p79-eff-period{font-size:12px;color:#587493;font-weight:800;text-align:center;min-width:125px;font-variant-numeric:tabular-nums}
.p79-eff-summary{font-size:11px;color:#66809a;padding:4px 1px 2px;text-align:right;line-height:1.5}
html body.p79-workspace:has(#systems.show):has(#p79Dashboard) #p79Dashboard .p79d-panel.p79d-trend{height:260px!important;min-height:260px!important;max-height:260px!important;overflow:hidden!important;align-self:stretch!important}
html body.p79-workspace:has(#systems.show):has(#p79Dashboard) #p79Dashboard #p79DashShipBars.p79d-bars{height:120px!important;min-height:120px!important;max-height:120px!important;overflow:visible!important;flex:none!important}
html body.p79-workspace:has(#systems.show):has(#p79Dashboard) #p79Dashboard .p79d-trend .p79-eff-pager{padding:1px 0 3px!important;gap:3px 7px!important}
</style>
</head><body class="p79-workspace">
<div id="systems" class="show"><main id="p79Dashboard">
 <section class="p79d-panels p79d-ship-panels">
  <article id="ship-eff" class="p79d-panel p79d-trend">
   <div class="p79d-panel-title"><b>船舶效率趨勢</b></div>
   <div class="p79-eff-pager">
     <div class="p79-eff-modes"><button aria-pressed="true">每週效率</button><button aria-pressed="false">每月效率</button></div>
     <div class="p79-eff-arrows"><button>‹</button><span class="p79-eff-period">2026/10/25 (日) ~ 10/31 (六)</span><button>›</button></div>
   </div>
   <div id="p79DashShipBars" class="p79d-bars p79d-ship-bars"><svg width="100%" height="100%" viewBox="0 0 440 180"><polyline points="0,110 80,100 160,98 240,96 320,92 400,80" stroke="#1687e8" fill="none" stroke-width="2"/></svg></div>
   <div class="p79-eff-summary">期間加權效率 22.72 GPH · 有效 7 天</div>
  </article>
  <article id="ship-rank" class="p79d-panel p79d-ranking"><div class="p79d-panel-title"><b>最新匯入船舶</b></div><div class="p79d-table-scroll">排名</div></article>
  <article id="ship-schedule" class="p79d-panel p79d-warnings p79d-ship-schedule"><div class="p79d-panel-title"><b>萬海網站船期</b></div>
   <div id="p79DashVesselNotices" class="p79-schedule-board p79-schedule-remote p79-public-sailing-board">
    <div class="p79-schedule-remote-caption">萬海網站船期 · 已同步 · 共 6 艘</div>
    <div class="p79-schedule-list">
     <button type="button" class="p79-schedule-row p79-wanhai-row">
      <span class="p79-wanhai-top"><strong class="p79-wanhai-name">WAN HAI 271</strong><small class="p79-wanhai-voyage">百春 · 進港 N269 / 出港 N269</small></span>
      <span class="p79-wanhai-detail">
       <span><small>ETA 抵港</small><b><span class="p79-wanhai-date">2026/10/29</span><span class="p79-wanhai-clock">08:30</span></b></span>
       <span><small>ETB 靠泊</small><b><span class="p79-wanhai-date">2026/10/31</span><span class="p79-wanhai-clock">02:00</span></b></span>
       <span><small>ETD 離港</small><b><span class="p79-wanhai-date">2026/10/31</span><span class="p79-wanhai-clock">16:00</span></b></span>
      </span><span class="p79-wanhai-berth"><small>靠泊碼頭</small><strong>W79</strong></span>
     </button>
    </div><div class="p79-schedule-footnote">萬海官方船期</div>
   </div>
  </article>
 </section>
</main></div>
<pre id="p79-test-report"></pre>
<script>
window.addEventListener('load',()=>{
 document.documentElement.dataset.theme=new URL(location.href).searchParams.get('theme')||'dark';
 const rect=id=>document.getElementById(id).getBoundingClientRect();
 const cards=['ship-eff','ship-rank','ship-schedule'].map(rect);
 const dates=[...document.querySelectorAll('#p79DashVesselNotices .p79-wanhai-date')];
 const times=[...document.querySelectorAll('#p79DashVesselNotices .p79-wanhai-clock')];
 const fields=[...document.querySelectorAll('#p79DashVesselNotices .p79-wanhai-detail b')];
 const rows=[...document.querySelectorAll('#p79DashVesselNotices .p79-schedule-row')];
 const results={
  viewport:innerWidth,
  equalHeights:innerWidth>620?cards.every(r=>Math.abs(r.height-cards[0].height)<2):true,
  compactHeights:cards.every(r=>r.height<=(innerWidth<=620?277:262)),
  naturalTrendReference:cards[0].height<=(innerWidth<=620?277:262),
  chartBoxHeight:Math.round(rect('p79DashShipBars').height),
  chartInsideCard:rect('p79DashShipBars').bottom<=cards[0].bottom+2,
  pagerInsideCard:document.querySelector('#ship-eff .p79-eff-pager').getBoundingClientRect().bottom<=cards[0].bottom,
  summaryVisible:(()=>{const r=document.querySelector('#ship-eff .p79-eff-summary').getBoundingClientRect();return r.bottom<=cards[0].bottom+2&&r.height>0})(),
  chartLabelsPresent:document.querySelectorAll('#p79DashShipBars svg').length===1,
  equalTops:innerWidth>1050?cards.every(r=>Math.abs(r.top-cards[0].top)<2):true,
  noEllipsis:fields.every(el=>getComputedStyle(el).textOverflow!=='ellipsis'&&getComputedStyle(el).whiteSpace!=='nowrap'),
  dateAndTimeSeparate:dates.length===3&&times.length===3&&dates.every((el,i)=>times[i].getBoundingClientRect().top>el.getBoundingClientRect().top),
  visibleTime:times.every(el=>{const r=el.getBoundingClientRect();const c=el.closest('b').getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom<=c.bottom+3&&r.right<=c.right+2;}),
  scrollableSchedule:getComputedStyle(document.querySelector('#p79DashVesselNotices .p79-schedule-list')).overflowY==='auto',
  heights:cards.map(r=>Math.round(r.height)),
  times:times.map(x=>x.textContent),
  dateVisible:dates.map(x=>x.textContent)
 };
 document.getElementById('p79-test-report').textContent='SHIP_VIEWPORT_REPORT:'+JSON.stringify(results);
});
</script></body></html>
