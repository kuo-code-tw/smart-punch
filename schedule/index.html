    async function resetToDefaultData() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;

      const confirmed = confirm(
        `⚠️ 確定要重設 ${yearMonth} 的排班資料嗎？\n\n` +
        `這會依照目前畫面上的輪班規則重新產生整個月份，\n` +
        `並直接覆蓋 Google 雲端「排班資料」中 ${yearMonth} 的班表。\n\n` +
        `員工清單、考勤紀錄、請假紀錄都不會被刪除。`
      );

      if (!confirmed) return;

      try {
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        employees.forEach(emp => {
          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};

          Object.keys(monthlyScheduleData[emp.id]).forEach(dateKey => {
            if (dateKey.startsWith(yearMonth + '-')) {
              delete monthlyScheduleData[emp.id][dateKey];
            }
          });
        });

        MAIN_ROLES.forEach(roleName => {
          const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));

          roleEmps.forEach((emp, idx) => {
            if (!monthlyScheduleData[emp.id]) {
              monthlyScheduleData[emp.id] = {};
            }

            for (let d = 1; d <= totalDays; d++) {
              const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
              const dateObj = new Date(year, month - 1, d);

              monthlyScheduleData[emp.id][dayStr] =
                calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          });
        });

        const cloudOk = await saveScheduleMonthToCloud(false);

        if (!cloudOk) {
          throw new Error('Google 雲端寫入失敗');
        }

        buildRoleTabsAndRender();

        alert(
          `☁️ ${yearMonth} 排班已重設完成！\n\n` +
          `新的班表已同步到 Google 雲端。`
        );

      } catch (err) {
        console.error(err);
        alert(
          '❌ 重設雲端排班失敗：\n' +
          (err && err.message ? err.message : err)
        );
      }
    }

    function getDaysInMonth(year, month) {
      return new Date(year, month, 0).getDate();
    }

    function getRolePriority(role) {
      const idx = ALL_ROLE_ORDER.indexOf(role);
      return idx === -1 ? 999 : idx;
    }

    // Group display/order is derived from names, never from cloud insertion order.
    // Keep persisted availableGroups unchanged to avoid unnecessary GAS writes.
    function sortedScheduleGroups() {
      return [...new Set((availableGroups || []).filter(Boolean))].sort((a,b)=>{
        if(a==='不分組')return b==='不分組'?0:-1;
        if(b==='不分組')return 1;
        if(a==='不輪班')return b==='不輪班'?0:1;
        if(b==='不輪班')return -1;
        return String(a).localeCompare(String(b),'zh-Hant',{numeric:true,sensitivity:'base'});
      });
    }
    function getGroupPriority(group) {
      const index=sortedScheduleGroups().indexOf(group);
      return index<0?500:index;
    }

    // v2026.09.30.8.9：恢復「人員上下移動」。
    // 順序存進目前月份排班資料的 __personnel.order，不修改人資主檔。
    function scheduleOrderNumber(v) {
      if (v === null || v === undefined || String(v).trim() === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function compareScheduleEmployeeOrder(a, b) {
      const ao = scheduleOrderNumber(a?.order);
      const bo = scheduleOrderNumber(b?.order);
      if (ao !== null || bo !== null) {
        if (ao === null) return 1;
        if (bo === null) return -1;
        if (ao !== bo) return ao - bo;
      }
      return String(a?.id || '').localeCompare(String(b?.id || ''), 'zh-Hant', { numeric: true });
    }

    function sortScheduleEmployeesForRole(list) {
      return [...(list || [])].sort((a, b) => {
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return compareScheduleEmployeeOrder(a, b);
      });
    }

    function nextScheduleOrder(role, group, excludeId = '') {
      const nums = employees
        .filter(e => e.id !== excludeId && e.role === role && e.group === group)
        .map(e => scheduleOrderNumber(e.order))
        .filter(v => v !== null);
      return nums.length ? Math.max(...nums) + 10 : 10;
    }

    function moveScheduleEmployee(empId, direction) {
      if (!requireScheduleEditLock()) return;
      const emp = employees.find(e => e.id === empId);
      if (!emp) return;

      const peers = employees
        .filter(e => e.role === emp.role && e.group === emp.group)
        .sort(compareScheduleEmployeeOrder);

      // 舊資料沒有 order 時，先依目前穩定順序建立 10、20、30...。
      peers.forEach((p, i) => { p.order = (i + 1) * 10; });

      const idx = peers.findIndex(e => e.id === empId);
      if (idx < 0) return;
      const target = direction < 0 ? idx - 1 : idx + 1;
      if (target < 0 || target >= peers.length) return;

      const [moved] = peers.splice(idx, 1);
      peers.splice(target, 0, moved);
      peers.forEach((p, i) => {
        p.order = (i + 1) * 10;
        savePersonnelOverrideForCurrentMonth(p);
      });

      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    // v10.4：人員順序改為拖曳排序，支援滑鼠 / 觸控筆 / 手指。
    let scheduleDragState = null;

    function scheduleNormalizePeerOrders(role, group) {
      const peers=employees.filter(e=>e.role===role && e.group===group).sort(compareScheduleEmployeeOrder);
      peers.forEach((p,i)=>{p.order=(i+1)*10;});
      return peers;
    }

    function scheduleCommitDragOrder(sourceId, targetId, insertAfter=false) {
      if (!requireScheduleEditLock()) return;
      if (!sourceId || !targetId || sourceId===targetId) return;
      const source=employees.find(e=>e.id===sourceId);
      const target=employees.find(e=>e.id===targetId);
      if(!source || !target) return;
      if(source.role!==target.role || source.group!==target.group){
        if(typeof showScheduleToast==='function') showScheduleToast('拖曳排序只能在同一職務、同一組別內調整','warning');
        else alert('拖曳排序只能在同一職務、同一組別內調整');
        return;
      }
      const peers=scheduleNormalizePeerOrders(source.role,source.group);
      const from=peers.findIndex(e=>e.id===sourceId);
      let to=peers.findIndex(e=>e.id===targetId);
      if(from<0 || to<0)return;
      const [moved]=peers.splice(from,1);
      to=peers.findIndex(e=>e.id===targetId);
      if(insertAfter) to+=1;
      peers.splice(Math.max(0,Math.min(to,peers.length)),0,moved);
      peers.forEach((p,i)=>{ p.order=(i+1)*10; savePersonnelOverrideForCurrentMonth(p); });
      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    function scheduleDragHandlePointerDown(ev, empId) {
      if(!scheduleCanEditNow() || !requireScheduleEditLock()) return;
      if(ev.button!==undefined && ev.button!==0) return;
      const source=employees.find(e=>e.id===empId); if(!source)return;
      scheduleDragState={sourceId:empId,targetId:empId,insertAfter:false,pointerId:ev.pointerId};
      ev.currentTarget?.closest?.('[data-p79-drag-emp]')?.classList.add('p79-drag-source');
      try{ev.currentTarget.setPointerCapture?.(ev.pointerId)}catch(e){}
      ev.preventDefault();
    }

    function scheduleDragPointerMove(ev) {
      if(!scheduleDragState)return;
      const row=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.('[data-p79-drag-emp]');
      document.querySelectorAll('[data-p79-drag-emp].p79-drag-target-before,[data-p79-drag-emp].p79-drag-target-after').forEach(x=>x.classList.remove('p79-drag-target-before','p79-drag-target-after'));
      if(!row)return;
      const targetId=row.dataset.p79DragEmp||'';
      const source=employees.find(e=>e.id===scheduleDragState.sourceId);
      const target=employees.find(e=>e.id===targetId);
      if(!source||!target||source.role!==target.role||source.group!==target.group)return;
      const rect=row.getBoundingClientRect();
      const after=ev.clientY > rect.top + rect.height/2;
      scheduleDragState.targetId=targetId; scheduleDragState.insertAfter=after;
      row.classList.add(after?'p79-drag-target-after':'p79-drag-target-before');
      ev.preventDefault();
    }

    function scheduleDragPointerUp(ev) {
      if(!scheduleDragState)return;
      const state=scheduleDragState; scheduleDragState=null;
      document.querySelectorAll('[data-p79-drag-emp]').forEach(x=>x.classList.remove('p79-drag-source','p79-drag-target-before','p79-drag-target-after'));
      if(state.targetId && state.targetId!==state.sourceId) scheduleCommitDragOrder(state.sourceId,state.targetId,state.insertAfter);
      ev?.preventDefault?.();
    }

    document.addEventListener('pointermove',scheduleDragPointerMove,{passive:false});
    document.addEventListener('pointerup',scheduleDragPointerUp,{passive:false});
    document.addEventListener('pointercancel',scheduleDragPointerUp,{passive:false});

    function calculateShiftForDay(emp, empIndexInRole, dayNum, dayOfWeek) {
      if (emp.lockType === 'FIXED_LOCKED') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }
      if (emp.group === '不輪班') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }

      const algo = document.getElementById('schedule-algorithm').value;
      if (algo === 'WEEKEND_OFF') return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      if (algo === 'FIXED_EARLY') return '早';

      const offset = empIndexInRole * 2;

      if (algo === 'TWO_TWO') {
        const cycle = ['早', '早', '休', '休', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      if (algo === 'FOUR_TWO') {
        const cycle = ['早', '早', '早', '早', '休', '休', '中', '中', '中', '中', '休', '休', '晚', '晚', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      const ew = parseInt(document.getElementById('early-work-input').value) || 0;
      const eo = parseInt(document.getElementById('early-off-input').value) || 0;
      const mw = parseInt(document.getElementById('mid-work-input').value) || 0;
      const mo = parseInt(document.getElementById('mid-off-input').value) || 0;
      const nw = parseInt(document.getElementById('night-work-input').value) || 0;
      const no = parseInt(document.getElementById('night-off-input').value) || 0;

      const cycleLength = ew + eo + mw + mo + nw + no;
      if (cycleLength === 0) return '休';

      const pos = (dayNum - 1 + offset) % cycleLength;

      const p1 = ew;
      const p2 = p1 + eo;
      const p3 = p2 + mw;
      const p4 = p3 + mo;
      const p5 = p4 + nw;

      if (pos < p1) return '早';
      if (pos < p2) return '休';
      if (pos < p3) return '中';
      if (pos < p4) return '休';
      if (pos < p5) return '晚';
      return '休';
    }

    function initDefaultScheduleData(yearMonth, persistLocal = true) {
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));
        roleEmps.forEach((emp, idx) => {
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            if(!monthlyScheduleData[emp.id][dayStr]) {
              if (monthlyScheduleData[emp.id][dayStr] === '離') continue;
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          }
        });
      });
      if (persistLocal) saveAllDataToLocalStorage();
    }

    function scheduleEscapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    function normalizeScheduleDate(value) {
      const s = String(value || '').trim();
      const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      return m ? `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}` : '';

    function p79LeaveCoverOnDay(empId, dayStr){
      const id=String(empId||'').trim().toUpperCase();
      const list=[];
      (leaveCoverAssignments||[]).forEach(a=>{
        if(dayStr < a.startDate || dayStr > a.endDate)return;
        if(String(a.leaveEmpId||'').trim().toUpperCase()===id)list.push({kind:'leave',data:a});
        if((a.workerIds||[]).some(x=>String(x).trim().toUpperCase()===id))list.push({kind:'worker',data:a});
      });
      return list;
    }
    function p79CoverageShift(empId,dayStr){
      const entry=p79LeaveCoverOnDay(empId,dayStr).find(x=>x.kind==='worker');
      if(!entry)return '';
      const current=String(monthlyScheduleData?.[empId]?.[dayStr]||'').trim();
      // 已手動設定明確班別時，永遠以正式班表為準，不讓代班資訊覆蓋。
      if(['早','中','晚'].includes(current))return '';
      const target=String(entry.data.leaveEmpId||'').trim().toUpperCase();
      const original=String(monthlyScheduleData?.[target]?.[dayStr]||'').trim();
      // 原班別不明時不輸出「?」，改保留目前班表班別及獨立的代班標籤。
      return ['早','中','晚'].includes(original)?original:'';
    }
    function p79LeaveCoverBadge(empId,dayStr){
      const assignments=p79LeaveCoverOnDay(empId,dayStr);
      return assignments.map(({kind,data:a})=>{
        const workerNames=(a.workerIds||[]).map(id=>employees.find(e=>String(e.id||'').toUpperCase()===String(id).toUpperCase())?.name||id).join('、');
        const leaveName=employees.find(e=>String(e.id||'').toUpperCase()===String(a.leaveEmpId||'').toUpperCase())?.name||a.leaveEmpId;
        const twoWorkers=a.mode==='two';
        const hours=twoWorkers?4:8;
        const title=kind==='leave'
          ? '請假已安排：'+workerNames+'｜'+(twoWorkers?'兩位各代班4小時':'一位排休代班8小時')
          : '代班 '+leaveName+'｜'+hours+'小時';
        const label=kind==='leave'?'':('代'+hours);
        const cls=kind==='leave'?'bg-rose-50 text-rose-700':'bg-cyan-100 text-cyan-900';
        return kind==='leave' ? '' : '<span title="'+scheduleEscapeHtml(title)+'" aria-label="'+scheduleEscapeHtml(title)+'" class="inline-flex shrink-0 whitespace-nowrap items-center justify-center px-1 py-0.5 rounded '+cls+' font-black text-[9px] leading-none">'+label+'</span>';
      }).join('');
    }

    function approvedLeaveRecordsOnDate(dayStr) {
      return (leaveRecords || []).filter(item => {
        if (String(item?.status || '') !== '已核准') return false;
        const start = normalizeScheduleDate(item?.startTime || item?.startDate);
        const end = normalizeScheduleDate(item?.endTime || item?.endDate);
        return !!start && !!end && dayStr >= start && dayStr <= end;
      });
    }

    function approvedLeaveForEmployee(empId, dayStr, empName='') {
      const id = String(empId || '').trim().toUpperCase();
      const name = String(empName || '').replace(/\s+/g,'').trim();
      return approvedLeaveRecordsOnDate(dayStr).find(item => {
        const leaveId = String(item?.empId || item?.employeeId || '').trim().toUpperCase();
        const leaveName = String(item?.name || item?.employeeName || '').replace(/\s+/g,'').trim();
        return (id && leaveId === id) || (name && leaveName === name);
      }) || null;
    }

    function scheduleLeaveTypeText(leave) {
      return String(leave?.leaveType || leave?.type || leave?.category || '請假').trim() || '請假';
    }

    function scheduleLeavePillClass(leaveType) {
      const t = String(leaveType || '');
      if (/病/.test(t)) return 'sick';
      if (/年|特/.test(t)) return 'annual';
      if (/事/.test(t)) return 'personal';
      if (/公/.test(t)) return 'official';
      if (/喪/.test(t)) return 'bereavement';
      return 'other';
    }

    function scheduleLeavePillHtml(leave, includeName=false) {
      if (!leave) return '';
      const type = scheduleLeaveTypeText(leave);
      const name = String(leave?.name || leave?.employeeName || '').trim();
      const text = includeName && name ? `${name}｜${type}` : type;
      return `<span class="today-leave-pill ${scheduleLeavePillClass(type)}" title="今日已核准：${scheduleEscapeHtml(type)}"><i class="fa-solid fa-clipboard-check"></i>${scheduleEscapeHtml(text)}</span>`;
    }

    function p79IsUnavailableForSubstitute(emp, day) {
      if(!emp)return true;
      const shift=String((monthlyScheduleData[emp.id]||{})[day]||'').trim();
      // 「休」是可安排休假加班的排休，不是正式請假；年假／特休／請假／離職仍不可安排。
      if(['年','特','年假','特休','事','病','公','喪','離'].includes(shift))return true;
      return !!approvedLeaveForEmployee(emp.id,day,emp.name);
    }
    function p79UpdateSubstituteTargetOptions() {
      const id=String(document.getElementById('substitute-worker-emp').value||'');
      const e=employees.find(x=>String(x.id)===id);
      if(!e)return;
      const target=document.getElementById('substitute-for-emp'),prev=target.value;
      const stroke=new Intl.Collator('zh-TW-u-co-stroke',{numeric:true});
      const day=String(document.getElementById('substitute-date-key')?.value||'');
      const choices=employees.filter(x=>x.id!==id&&String(x.role||'').trim()===String(e.role||'').trim())
        .sort((a,b)=>stroke.compare(String(a.name||''),String(b.name||''))||String(a.id).localeCompare(String(b.id)));
      p79LoadSubstituteOvertimeFields();
      target.innerHTML='<option value="">— 請選擇第二位人員 —</option>'+choices.map(x=>'<option value="'+scheduleEscapeHtml(x.id)+'">'+scheduleEscapeHtml(x.name)+'（'+scheduleEscapeHtml(x.id)+'）</option>').join('');
      if(choices.some(x=>String(x.id)===prev))target.value=prev;
    }
    function openSubstituteAssignment(empId, dayStr, fromAnnualLeave=false) {
      p79PendingOvertimeReport=null;
      if (!requireScheduleEditLock()) return;
      if (!canManageSchedule()) { alert('此帳號只有排班查看權限。'); return; }
      ensureSubstituteModal();
      const emp = employees.find(e => e.id === empId);
      if (!emp) return;
      const modal = document.getElementById('substitute-assignment-modal');
      const existing = getScheduleDayMeta(empId, dayStr) || {};
      const stroke=new Intl.Collator('zh-TW-u-co-stroke',{numeric:true});
      const choices=employees.filter(e=>String(e.role||'').trim()===String(emp.role||'').trim())
        .sort((a,b)=>stroke.compare(String(a.name||''),String(b.name||''))||String(a.id).localeCompare(String(b.id)));
      const worker=document.getElementById('substitute-worker-emp');
      // 第一位和第二位皆列出同職務完整名單；第一位在代替請假者時僅排除被代班者本人。
      // 不因「休」或請假狀態隱藏姓名；實際不合格人選在儲存時明確阻擋。

    function p79LoadSubstituteOvertimeFields() {
      const id=String(document.getElementById('substitute-worker-emp').value||'');
      const day=String(document.getElementById('substitute-date-key').value||'');
      const meta=getScheduleDayMeta(id,day)||{};
      const shift=String((monthlyScheduleData[id]||{})[day]||'');
      document.getElementById('substitute-overtime-shift').value=['早','中','晚'].includes(shift)?shift:'';
      document.getElementById('substitute-overtime-start').value=meta.overtimeStart||'';
      document.getElementById('substitute-overtime-end').value=meta.overtimeEnd||'';
    }

    function p79BuildScheduleOvertimeMeta(old,kind,currentShift,shift,start,end,details) {
      if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end)||start===end)
        throw new Error('請填有效且不同的加班開始、結束時間');
      if(!['早','中','晚'].includes(shift))throw new Error('請選擇加班班別');
      const original=old.overtimeOriginalShift===undefined?currentShift:String(old.overtimeOriginalShift);
      const normal=['早','中','晚'].includes(original);
      if(kind==='rest'&&normal)throw new Error('當日已有正常班別，請選擇延時加班或代班加班');
      const overtimeType=kind==='substitute'?(normal?'extended':'rest'):kind;
      if(!['rest','extended'].includes(overtimeType))throw new Error('請選擇有效的加班類型');
      if(overtimeType==='extended'&&(!normal||shift!==original))throw new Error('延時加班必須保留當日正常班別');
      if(overtimeType==='rest'&&!['休',''].includes(original))throw new Error('請假當日不能安排加班');
      if(old.overtimeReport&&(old.overtimeStart!==start||old.overtimeEnd!==end||old.overtimeType!==overtimeType)&&!p79PendingOvertimeReport){old={...old};delete old.overtimeReport;}
      return {...old,...details,type:kind==='substitute'?'substitute':'overtime',overtime:true,
        overtimeType,overtimeOriginalShift:original,overtimeAssignedShift:shift,
        overtimeStart:start,overtimeEnd:end};
    }

    let p79PendingOvertimeReport=null;
    function saveSubstituteAssignment() {
      if (!requireScheduleEditLock()||!canManageSchedule())return;
      const empId=String(document.getElementById('substitute-worker-emp').value||'').trim();
      const dayStr=String(document.getElementById('substitute-date-key').value||'').trim();
      const kind=document.getElementById('substitute-overtime-kind').value;
      const forEmpId=kind==='substitute'?String(document.getElementById('substitute-for-emp').value||'').trim():'';
      const note=String(document.getElementById('substitute-note').value||'').trim();
      const worker=employees.find(e=>String(e.id)===empId);
      if(worker && p79IsUnavailableForSubstitute(worker,dayStr))return alert('此人當天有核准請假、請假班別或已離職，不能安排加班／代班；一般排「休」仍可安排休假加班');
      const target=employees.find(e=>String(e.id)===forEmpId);
      if(!worker||!dayStr)return alert('請選擇加班人員');
      if(kind==='substitute'&&(!target||forEmpId===empId))return alert('代班加班必須選擇第二位被代班人員');
      if(target&&String(target.role||'').trim()!==String(worker.role||'').trim())return alert('只能選擇相同單位（職務）的人員代班');
      let old=monthlyScheduleMeta[empId]?.[dayStr]||{};
      const reportDraft=p79PendingOvertimeReport?.empId===empId&&p79PendingOvertimeReport?.date===dayStr?p79PendingOvertimeReport:null;
      if(p79PendingOvertimeReport&&!reportDraft)return alert('申報人員或日期已改變，請取消後重新申報');
      const shift=String(document.getElementById('substitute-overtime-shift').value||'');
      let meta;
      try {
        if(reportDraft){
          const rule=reportDraft.rule;
          if(kind!==(rule.category==='延'?'extended':'rest')||document.getElementById('substitute-overtime-start').value!==P79Overtime.time(rule.overtimeStart)||document.getElementById('substitute-overtime-end').value!==P79Overtime.time(rule.overtimeEnd))throw new Error('套用的申報類型或時段已修改，請回加班管理重新選擇規則');
          if(kind==='rest'&&['早','中','晚'].includes(monthlyScheduleData[empId]?.[dayStr])){
            if(!old.restQuotaOvertime||!['休','國','例'].includes(rule.category)||old.restCategory!==rule.category)throw new Error('工作日申報未休加班前，請先自動配對例／休／國，並選擇該日相同假別');
            old={...old,reportOriginalShift:monthlyScheduleData[empId][dayStr],overtimeOriginalShift:'休'};
          }
          old={...old,overtimeReport:{...rule,id:reportDraft.id,reportedAt:new Date().toISOString()},reportOriginalShift:old.reportOriginalShift??monthlyScheduleData[empId]?.[dayStr]};
          if(kind==='rest'&&(['休','國','例'].includes(rule.category)||old.restCategory)){old.restCategory=['休','國','例'].includes(rule.category)?rule.category:old.restCategory;old.restQuotaOvertime=true;old.restAllocationSource='manual';}
        }
        meta=p79BuildScheduleOvertimeMeta(old,kind,String((monthlyScheduleData[empId]||{})[dayStr]||''),shift,
          String(document.getElementById('substitute-overtime-start').value||''),
          String(document.getElementById('substitute-overtime-end').value||''),
          {forEmpId,forName:target?.name||'',note,assignedAt:new Date().toISOString()});
      }catch(error){return alert(error.message);}
      if(!monthlyScheduleMeta[empId])monthlyScheduleMeta[empId]={};
      if(!monthlyScheduleData[empId])monthlyScheduleData[empId]={};
      monthlyScheduleMeta[empId][dayStr]=meta;
      monthlyScheduleData[empId][dayStr]=shift;
      if(reportDraft){p79PendingOvertimeReport=null;const banner=document.getElementById('p79ReportBanner');if(banner)banner.textContent='申報已加入班表，正在等待雲端儲存確認。';}
      queueScheduleCloudSave();
      closeSubstituteAssignment();
      renderRoleScheduleView();renderTodaySchedulePanel();
    }

    function clearSubstituteAssignment() {
      if (!requireScheduleEditLock()) return;
      const empId = String(document.getElementById('substitute-worker-emp')?.value || document.getElementById('substitute-cover-emp-id')?.value || '').trim().toUpperCase();
      const dayStr = String(document.getElementById('substitute-date-key')?.value || '').trim();
      const meta=monthlyScheduleMeta[empId]?.[dayStr];
      if(meta?.overtimeAssignedShift && monthlyScheduleData[empId]?.[dayStr]===meta.overtimeAssignedShift && meta.overtimeOriginalShift!==undefined)
        monthlyScheduleData[empId][dayStr]=meta.reportOriginalShift??meta.overtimeOriginalShift;
      if (monthlyScheduleMeta[empId] && monthlyScheduleMeta[empId][dayStr]) {
        const kept={};if(meta?.overtimeReport)for(const k of ['restCategory','restSourceDate','restHolidayName','restQuotaOvertime','restAllocationSource'])if(meta[k]!==undefined)kept[k]=meta[k];
        if(kept.restCategory)kept.restQuotaOvertime=['早','中','晚'].includes(monthlyScheduleData[empId]?.[dayStr]);
        if(Object.keys(kept).length)monthlyScheduleMeta[empId][dayStr]=kept;else delete monthlyScheduleMeta[empId][dayStr];
      }
      queueScheduleCloudSave();
      closeSubstituteAssignment();
      renderRoleScheduleView();
      renderTodaySchedulePanel();
    }

    function getSubstituteRecommendation(unitRole, targetEmpId, dayStr) {
      const sameRoleEmps = employees.filter(e => e.role === unitRole && e.id !== targetEmpId);
      let candidates = [];
      sameRoleEmps.forEach(cand => {
        const candShift = monthlyScheduleData[cand.id] && monthlyScheduleData[cand.id][dayStr];
        if (candShift === '休' || candShift === '特') {
          candidates.push(`${cand.name}(${cand.id}) - 當日休假`);
        }
      });
      if (candidates.length > 0) return `💡 建議代班: ${candidates.join(', ')}`;
      return '⚠️ 當日無人休假，需跨單位支援';
    }

    // Frozen people pane is a separate visual layer from the horizontal date scroller.
    // This avoids sticky table-cell behavior inside a two-axis scrolling table.
    function p79ConnectRosterScroll(){
      const main=document.getElementById('p79RosterScroll');
      const bar=document.getElementById('p79RosterBottomScroll');
      const spacer=document.getElementById('p79RosterBottomWidth');
      const header=document.getElementById('p79RosterFixedHeader');
      const fixed=document.getElementById('p79RosterPinnedPeople');
      const fixedInner=document.getElementById('p79RosterPinnedInner');
      const fixedLabel=document.getElementById('p79RosterFrozenHeaderLabel');
      const shell=document.getElementById('p79RosterBodyShell');
      const table=main?.querySelector('table');
      if(!main||!bar||!spacer||!header||!table||!fixed||!fixedInner||!shell||!fixedLabel)return;
      const originalHead=table.querySelector('thead');
      if(originalHead){
        const headTable=table.cloneNode(false);
        headTable.removeAttribute('id');
        headTable.className=table.className;
        headTable.appendChild(originalHead);
        header.replaceChildren(headTable);
      }
      const pairs=[];
      const frozenRows=main.querySelectorAll('tbody tr[data-p79-drag-emp],tfoot tr');
      const fragments=document.createDocumentFragment();
      frozenRows.forEach(row=>{
        const source=row.querySelector('td:first-child');
        if(!source)return;
        const clone=document.createElement('div');
        clone.className='p79-fixed-person-row p79-person-cell';
        if(row.dataset.p79DragEmp){
          clone.dataset.p79DragEmp=row.dataset.p79DragEmp;
          clone.classList.add('p79-draggable-employee');
        }else{
          clone.classList.add('p79-fixed-summary-row');
          const background=getComputedStyle(source).backgroundColor;
          clone.style.backgroundColor=background;
        }
        clone.innerHTML=source.innerHTML;
        fragments.appendChild(clone);
        pairs.push({row,source,clone});
      });
      fixedInner.replaceChildren(fragments);
      const updateGeometry=()=>{
        if(!main.isConnected)return;
        const origin=main.getBoundingClientRect().top + main.clientTop;
        const personWidth=Math.ceil(pairs[0]?.source.getBoundingClientRect().width || 216);
        fixed.style.width=personWidth+'px';
        fixedLabel.style.width=personWidth+'px';
        pairs.forEach(item=>{
          const rect=item.row.getBoundingClientRect();
          const y=rect.top-origin+main.scrollTop;
          item.clone.style.top=Math.round(y)+'px';
          item.clone.style.height=Math.ceil(rect.height)+'px';
        });
        fixedInner.style.height=Math.ceil(table.getBoundingClientRect().height)+'px';
        spacer.style.width=table.scrollWidth+'px';
        const headTable=header.querySelector('table');
        if(headTable)headTable.style.width=table.scrollWidth+'px';
        syncViewport();
      };
      const syncViewport=()=>{
        if(!main.isConnected)return;
        if(header.scrollLeft!==main.scrollLeft)header.scrollLeft=main.scrollLeft;
        if(Math.abs(bar.scrollLeft-main.scrollLeft)>1)bar.scrollLeft=main.scrollLeft;
        fixedInner.style.transform='translate3d(0,'+(-main.scrollTop)+'px,0)';
      };
      updateGeometry();
      shell.classList.add('p79-has-frozen-people');
      main.addEventListener('scroll',syncViewport,{passive:true});
      bar.addEventListener('scroll',()=>{
        if(Math.abs(main.scrollLeft-bar.scrollLeft)>1)main.scrollLeft=bar.scrollLeft;
      },{passive:true});
      if(typeof ResizeObserver!=='undefined'){
        const observer=new ResizeObserver(updateGeometry);
        observer.observe(main);
        observer.observe(table);
        main.p79ScrollObserver=observer;
      }
    }

    let p79ManualScheduleSaveBusy=false;
    function p79SetScheduleSaving(busy){
      document.body.classList.toggle('p79-schedule-saving',!!busy);

      if(button){button.disabled=!!busy;button.innerHTML=busy?'<i class="fa-solid fa-spinner fa-spin"></i> 儲存中…':'<i class="fa-solid fa-floppy-disk"></i> 儲存排班';}

    async function saveCurrentTabSchedule() {
      if(p79ManualScheduleSaveBusy)return;
      if (!canManageSchedule()) { requireScheduleEditLock(); return; }
      // 儲存前由 GAS 原子確認編輯權；不以可能延遲的本機狀態直接拒絕管理員。
      // 若其他帳號持鎖，必須拒絕寫入，不可強制接管。
      if (!scheduleEditLockState.mine) {
        const acquired = await manualAcquireScheduleEditLock();
        if (!acquired) {
          const owner=scheduleEditLockState.locked ? '目前由 '+scheduleLockOwnerLabel()+' 編輯' : '雲端尚未確認編輯權';
          alert('❌ 排班尚未儲存：'+owner+'。請稍候再按儲存，勿重新整理以免丟失未儲存的變更。');
          return;
        }
      }
      if (!requireScheduleEditLock(false)) return;
      p79ApplyAutomaticRestMetadata();
      p79ManualScheduleSaveBusy=true;
      p79SetScheduleSaving(true);
      try {
      // 正式 syncSchedules 會在 GAS ScriptLock 裡原子核對 gcToken 與 scheduleClientId。
      // 不再多打一筆容易被其他系統長任務擋住的 heartbeat/GET。
      // 伺服器如確認不是鎖持有人，會拒絕整月寫入，保留編輯中的畫面。
      const tabName = (activeRoleTab === 'ALL') ? '全部人員' : activeRoleTab + '單位';
      lastScheduleCloudError = '';

      // V10.15：手動按儲存時取消延遲 autosave，改由同一條序列寫入送「目前畫面最新版本」。
      if (scheduleSaveTimer) {
        clearTimeout(scheduleSaveTimer);
        scheduleSaveTimer = null;
      }
      flushScheduleLocalPersist();

      const saveVersion = p79ScheduleLocalMutationVersion;
      // If autosave is already writing this same or a newer snapshot, wait once.
      // Only skip the manual POST if cloud success and no local edits remain pending.
      if (port79ScheduleWriteInFlight) {
        const previousOk=await port79ScheduleWriteInFlight.catch(()=>false);
        if (previousOk && !port79ScheduleDirty &&
            p79ScheduleLocalMutationVersion === saveVersion &&
            !personnelSaveTimer) {
          alert('✅ 儲存完畢：背景自動儲存已完成，沒有需要重複寫入的班表修改。');
          return;
        }
      }
      const ok = await runScheduleCloudWrite(() => saveScheduleMonthToCloud(false));

      if (ok) {
        // The monthly write already confirmed its captured mutation version.

        // 儲存期間若又有新的編輯，不可誤把它標成已完成；交給下一次 autosave。
        if (p79ScheduleLocalMutationVersion !== saveVersion) {
          port79ScheduleDirty = true;
          queueScheduleCloudSave();
        }

        // Do not claim the *latest* edits have been saved if another mutation
        // was made after the payload snapshot was captured.
        try { renderTodaySchedulePanel(); } catch (e) {}
        if (port79ScheduleDirty) {
          alert('⚠️ 前一筆班表已寫入，但仍有較新的修改等待同步；請保持本頁開啟。');
        } else {
          alert(`✅ 儲存完畢\n\n【${tabName}】目前月份班表已成功儲存至 Google 雲端。`);
        }
      } else {
        port79ScheduleDirty = true;
        alert('❌ 排班雲端儲存失敗：\n' + (lastScheduleCloudError || '雲端沒有回傳詳細錯誤，請確認 Apps Script 已部署最新版。'));
      }
      } finally {
        p79ManualScheduleSaveBusy=false;
        p79SetScheduleSaving(false);
        applyScheduleAccessUi();
      }
    }

    function updateDailyShift(empId, dayStr, val) {
      if (!requireScheduleEditLock()) return;
      if(!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
      const previousShift=String(monthlyScheduleData[empId][dayStr]||'');
      if(!monthlyScheduleMeta[empId])monthlyScheduleMeta[empId]={};
      const meta={...(monthlyScheduleMeta[empId][dayStr]||{})};
      for(const key of ['restCategory','restSourceDate','restHolidayName','restQuotaOvertime','restAllocationSource'])delete meta[key];
      if(['例','國'].includes(val)) {meta.restCategory=val;meta.restAllocationSource='manual';}
      monthlyScheduleMeta[empId][dayStr]=meta;
      monthlyScheduleData[empId][dayStr] = ['例','國'].includes(val)?'休':val;
      if(['年','特','年假','特休'].includes(val) && !['年','特','年假','特休'].includes(previousShift)) {
        setTimeout(()=>openSubstituteAssignment(empId,dayStr,true),0);
      }

      // 立即保留資料，但不要每改一格就重建「所有人 × 31天」整張表。
      queueScheduleCloudSave();
      queueScheduleEditRender(320);

      // 只有真的修改今天班別時才更新今日排班；其他日期不用多做一次全員統計。
      if (dayStr === scheduleTaipeiTodayKey()) {
        try { renderTodaySchedulePanel(); } catch (e) {}
      }
    }

    function p79AutomaticRestMetadata(empId, month) {
      const existing=monthlyScheduleMeta[empId]||{};
      try {
        const quota=p79RestQuota(month);
        const excluded=Array.from({length:quota.days},(_,i)=>month+'-'+String(i+1).padStart(2,'0'))
          .filter(d=>approvedLeaveForEmployee(empId,d)||p79LeaveCoverOnDay(empId,d).length);
        return p79AllocateRestMonth(monthlyScheduleData[empId]||{},existing,month,excluded).meta;
      } catch (error) { return existing; }
    }

    function p79ApplyAutomaticRestMetadata() {
      const month=document.getElementById('month-picker').value;
      let changed=false;
      for (const emp of employees) {
        const meta=p79AutomaticRestMetadata(emp.id,month);
        if (JSON.stringify(meta)!==JSON.stringify(monthlyScheduleMeta[emp.id]||{})) {
          monthlyScheduleMeta[emp.id]=meta;changed=true;
        }
      }
      if (changed) p79MarkScheduleLocalMutation();
      return changed;
    }

    function p79AutoAllocateRest() {
      if(!requireScheduleEditLock())return;
      const month=document.getElementById('month-picker').value;
      const selected=employees.filter(e=>(activeRoleTab==='ALL'||e.role===activeRoleTab)&&(activeGroupFilter==='ALL'||e.group===activeGroupFilter));
      const results=[],errors=[];
      for(const emp of selected) {
        const schedule=monthlyScheduleData[emp.id]||{};
        if(Object.values(schedule).filter(v=>v==='離').length===Object.keys(schedule).length)continue;
        try {
          const quota=p79RestQuota(month);
          const excluded=Array.from({length:quota.days},(_,i)=>month+'-'+String(i+1).padStart(2,'0')).filter(d=>approvedLeaveForEmployee(emp.id,d)||p79LeaveCoverOnDay(emp.id,d).length);
          results.push({emp,result:p79AllocateRestMonth(schedule,monthlyScheduleMeta[emp.id]||{},month,excluded)});
        } catch(error) {errors.push(emp.name+'：'+error.message);}
      }
      if(errors.length){alert('未進行配對：\n'+errors.join('\n'));return;}
      results.forEach(({emp,result})=>monthlyScheduleMeta[emp.id]=result.meta);
      queueScheduleCloudSave();buildRoleTabsAndRender();
      const quota=p79RestQuota(month).counts;
      alert(month+' 月額度：例 '+quota['例']+'／休 '+quota['休']+'／國 '+quota['國']+'\n'+
        results.map(({emp,result})=>emp.name+'：已配休假 '+result.off+' 天、加班 '+result.overtime+' 天'+(result.unresolved.length?'、尚無可用工作日 '+result.unresolved.length+' 天':'')).join('\n')+'\n已列入待儲存；雲端結果請查看儲存狀態。');
    }

    function autoScheduleCurrentTab() {
      if (!requireScheduleEditLock()) return;
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));
        roleEmps.forEach((emp, idx) => {
          if (emp.lockType === 'FIXED_LOCKED') return;
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            if (monthlyScheduleData[emp.id][dayStr] === '離') continue;
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
          }
        });
      });

      saveAllDataToLocalStorage();
      queueScheduleCloudSave();
      renderRoleScheduleView();
      alert(`✨ 已完成智慧錯開排班，正在同步 Google 雲端！`);
    }

    function normalizeImportedScheduleShift(value) {
      const raw = String(value ?? '').replace(/\u3000/g, ' ').trim();
      if (!raw) return '';
      const compact = raw.replace(/\s+/g, '');
      const map = {
        '早':'早','早班':'早',
        '中':'中','中班':'中',
        '晚':'晚','晚班':'晚',
        '休':'休','休息':'休','休假':'休','例休':'休','例假':'休','輪休':'休','例':'休','國':'休',
        '特':'年','特休':'年','特別休假':'年','年':'年','年假':'年',
        '事':'事','事假':'事',
        '病':'病','病假':'病',
        '公':'公','公假':'公',
        '喪':'喪','喪假':'喪',
        '離':'離','離職':'離','resigned':'離','terminated':'離'
      };
      return Object.prototype.hasOwnProperty.call(map, compact) ? map[compact] : null;
    }

    function findImportColumnKey(row, candidates) {
      const keys = Object.keys(row || {});
      for (const cand of candidates) {
        const hit = keys.find(k => String(k).trim().toLowerCase() === String(cand).trim().toLowerCase());
        if (hit != null) return hit;
      }
      return '';
    }

    async function handleScheduleImportFile(event) {
      const input = event && event.target ? event.target : document.getElementById('schedule-import-file');
      const file = input && input.files && input.files[0];
      if (!file) return;

      try {
        if (!canManageSchedule()) throw new Error('此帳號沒有排班管理權限');
        if (!scheduleCanEditNow()) throw new Error('目前沒有取得排班編輯權，請重新整理後再試');
        if (typeof XLSX === 'undefined') throw new Error('Excel 元件尚未載入');

        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
        if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('Excel 內沒有可讀取的工作表');

        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
        if (!rows.length) throw new Error('第一個工作表沒有班表資料');

        const sample = rows.find(r => Object.values(r || {}).some(v => String(v ?? '').trim() !== '')) || rows[0];
        const empIdKey = findImportColumnKey(sample, ['工號','員工編號','考勤號','empId','ID']);
        const nameKey = findImportColumnKey(sample, ['姓名','員工姓名','name']);
        const groupKey = findImportColumnKey(sample, ['組別','分組','group']);
        const lockTypeKey = findImportColumnKey(sample, ['排班屬性','鎖定','lockType','排班鎖定屬性']);
        if (!empIdKey && !nameKey) {
          throw new Error('找不到「工號／員工編號／考勤號」或「姓名」欄位。請使用系統匯出的班表格式。');
        }

        const yearMonth = String(document.getElementById('month-picker')?.value || '').trim();
        if (!/^\d{4}-\d{2}$/.test(yearMonth)) throw new Error('目前排班月份格式不正確');
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        const byId = new Map((employees || []).map(e => [String(e.id || '').trim().toUpperCase(), e]));
        const byName = new Map();
        (employees || []).forEach(e => {
          const n = String(e.name || '').trim();
          if (!n) return;
          if (!byName.has(n)) byName.set(n, []);
          byName.get(n).push(e);
        });

        let matchedRows = 0;
        let updatedCells = 0;
        let updatedGroups = 0;
        let updatedLockTypes = 0;
        const notFound = [];
        const ambiguous = [];
        const invalid = [];

        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || {};
          const rawId = empIdKey ? String(row[empIdKey] ?? '').trim().toUpperCase() : '';
          const rawName = nameKey ? String(row[nameKey] ?? '').trim() : '';
          let emp = rawId ? byId.get(rawId) : null;

          if (!emp && rawName) {
            const sameName = byName.get(rawName) || [];
            if (sameName.length === 1) emp = sameName[0];
            else if (sameName.length > 1) ambiguous.push(`${rawName}（同名 ${sameName.length} 人）`);
          }

          if (!emp) {
            if (rawId || rawName) notFound.push(rawId || rawName);
            continue;
          }
          matchedRows++;

          // V10.26：組別與排班屬性是「排班月份設定」，可由系統匯出的 Excel 還原。
          // 職稱仍以人資主檔為唯一來源，不從 Excel 覆蓋。
          if (groupKey) {
            const importedGroup = String(row[groupKey] ?? '').trim();
            if (importedGroup && importedGroup !== emp.group) {
              emp.group = importedGroup;
              if (!availableGroups.includes(importedGroup) && importedGroup !== '不輪班') {
                availableGroups.push(importedGroup);
              }
              updatedGroups++;
            }
          }
          if (lockTypeKey) {
            const rawLock = String(row[lockTypeKey] ?? '').trim().replace(/\s+/g,'');
            const importedLock = /固定|鎖定|fixed/i.test(rawLock) ? 'FIXED_LOCKED' : (/自動|輪班|rotation/i.test(rawLock) ? 'ROTATION' : '');
            if (importedLock && importedLock !== emp.lockType) {
              emp.lockType = importedLock;
              updatedLockTypes++;
            }
          }
          savePersonnelOverrideForCurrentMonth(emp);

          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          if (!monthlyScheduleMeta[emp.id]) monthlyScheduleMeta[emp.id] = {};

          for (let d = 1; d <= totalDays; d++) {
            const dd = String(d).padStart(2, '0');
            const candidates = [
              `${d}日`, `${dd}日`, String(d), dd,
              `${month}/${d}`, `${month}/${dd}`,

            const normalized = normalizeImportedScheduleShift(importedRestOvertime?importedRestOvertime[1]:rawShift);

        alert(`✅ 班表匯入完成\n月份：${yearMonth}\n對到人員：${matchedRows} 列\n更新班別：${updatedCells} 格${updatedGroups ? `\n更新組別：${updatedGroups} 人` : ''}${updatedLockTypes ? `\n更新排班屬性：${updatedLockTypes} 人` : ''}\n並已同步 Google 雲端${notes.length ? '\n\n⚠️ ' + notes.join('\n⚠️ ') : ''}`);
      } catch (err) {
        console.error('班表匯入失敗：', err);
        const msg = String(err?.message || err || '未知錯誤');
        const cloudSide = /Google Apps Script|Google 雲端|雲端|GAS|已成功讀取並套用/.test(msg);
        alert((cloudSide ? '⚠️ Excel 已讀取，但雲端儲存失敗：\n' : '❌ 班表匯入失敗：\n') + msg);
      } finally {

      }
    }

    function exportScheduleToExcel() {
      const yearMonth = document.getElementById('month-picker').value;
      const [year, month] = yearMonth.split('-').map(Number);
      const totalDays = getDaysInMonth(year, month);

      const sortedEmps = [...employees].sort((a, b) => {
        const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
        if (rDiff !== 0) return rDiff;
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });

      // V10.16：固定班表匯出欄位，不再交給 SheetJS 自動推斷。
      // A~E 永遠保留：工號、姓名、職稱、組別、排班屬性；
      // F 之後固定為當月 1 日～月底。
      const exportHeaders = [
        '工號',
        '姓名',
        '職稱',
        '組別',
        '排班屬性',
        ...Array.from({ length: totalDays }, (_, index) => String(index + 1))
      ];

      const exportRows = [];
      sortedEmps.forEach(emp => {
        const row = {
          '工號': String(emp.id || ''),
          '姓名': String(emp.name || ''),
          '職稱': String(emp.role || emp.jobTitle || ''),
          '組別': String(emp.group || ''),
          '排班屬性': emp.lockType === 'FIXED_LOCKED' ? '固定鎖定' : '自動輪班'
        };

        for (let d = 1; d <= totalDays; d++) {
          const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
          const rawShift = (monthlyScheduleData[emp.id] && monthlyScheduleData[emp.id][dayStr]) || '休';
          const category=monthlyScheduleMeta[emp.id]?.[dayStr];
          row[String(d)] = category?.restQuotaOvertime ? rawShift+'（'+category.restCategory+'加）' : (rawShift==='休'&&category?.restCategory) ? category.restCategory : ['特','特休','特別休假','年假'].includes(String(rawShift).trim())
            ? '年'
            : (String(rawShift).trim() === '離' ? '離職' : rawShift);
        }

        exportRows.push(row);
      });

      const ws = XLSX.utils.json_to_sheet(exportRows, {
        header: exportHeaders,
        skipHeader: false
      });

      // 固定欄寬，避免打開 Excel 時左側資料看起來像不見。
      ws['!cols'] = [
        { wch: 16 }, // 工號
        { wch: 12 }, // 姓名
        { wch: 12 }, // 職稱
        { wch: 10 }, // 組別
        { wch: 14 }, // 排班屬性
        ...Array.from({ length: totalDays }, () => ({ wch: 6 }))
      ];

      // 凍結/顯示左側欄位由 Excel 軟體決定；至少確保資料本身完整輸出。
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${yearMonth}全廠班表`);
      XLSX.writeFile(wb, `${yearMonth}_全月排班表.xlsx`);
    }

    // 明確掛到 window，確保上方「功能 → 匯出」與頁面按鈕都呼叫同一份正式函式。
    window.exportScheduleToExcel = exportScheduleToExcel;
  </script>

<script id="port79-calendar-mode-script">
(function(){
  const KEY='port79_year_mode';
  const mode=localStorage.getItem(KEY)==='roc'?'roc':'gregorian';
  const sel=document.getElementById('port79CalendarModeSelect');
  if(sel){
    sel.value=mode;
    sel.addEventListener('change',()=>{
      localStorage.setItem(KEY,sel.value==='roc'?'roc':'gregorian');
      location.reload();
    });
  }
  if(mode!=='roc')return;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT']);
  const cv=(s)=>{
    s=String(s||'');
    s=s.replace(/民國\s*(\d{1,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g,(m,y,mo,d)=>`${Number(y)}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})(?:[\/-])(\d{1,2})(?:[\/-])(\d{1,2})\b/g,(m,y,mo,d)=>`${Number(y)}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})\s*年\s*(\d{1,2})\s*月/g,(m,y,mo)=>`${Number(y)}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})(?:[\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,mo)=>`${Number(y)}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})\s*年/g,(m,y)=>`${Number(y)}年`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g,(m,y,mo,d)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})(?:[\/-])(\d{1,2})(?:[\/-])(\d{1,2})\b/g,(m,y,mo,d)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年\s*(\d{1,2})\s*月/g,(m,y,mo)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})(?:[\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,mo)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年/g,(m,y)=>`${Number(y)-1911}年`);
    return s;
  };
  let busy=false;
  function scan(root){
    if(!root||busy)return;
    busy=true;
    try{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[]; let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        const p=node.parentElement;
        if(!p||skip.has(p.tagName)||p.closest('#port79CalendarModeBox'))return;
        const old=node.nodeValue||'';
        const next=cv(old);
        if(next!==old)node.nodeValue=next;
      });
    }finally{busy=false}
  }
  scan(document.body);
  const mo=new MutationObserver(ms=>{
    if(busy)return;
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)scan(n.nodeType===1?n:n.parentElement)}));
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>

\n<script id="schedule-v741-single-range-picker">
(function(){
  let rangeCalendarMonth='';
  let rangeDraftStart='';

  function pad2(n){return String(n).padStart(2,'0')}
  function ymShift(ym,delta){
    const m=String(ym||'').match(/^(\d{4})-(\d{2})$/);
    const d=m?new Date(Number(m[1]),Number(m[2])-1+delta,1):new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function monthBounds(ym){
    const [y,m]=String(ym).split('-').map(Number);
    const last=new Date(y,m,0).getDate();
    return [`${ym}-01`,`${ym}-${pad2(last)}`];
  }
  function prettyDate(v){return String(v||'').replace(/-/g,'/')}

  window.updateScheduleDateRangeSummary=function(){
    const a=document.getElementById('scheduleDateFrom')?.value||'';
    const b=document.getElementById('scheduleDateTo')?.value||'';
    const el=document.getElementById('scheduleDateRangeSummary');
    if(el)el.textContent=(!a&&!b)?'選擇日期範圍':(a&&b?`${prettyDate(a)} ～ ${prettyDate(b)}`:(a?`${prettyDate(a)} 起`:`至 ${prettyDate(b)}`));
  };

  function currentRangeMonth(){
    return (document.getElementById('scheduleDateFrom')?.value||document.getElementById('month-picker')?.value||scheduleTaipeiTodayKey().slice(0,7)).slice(0,7);
  }

  window.renderScheduleRangeCalendar=function(){
    if(!rangeCalendarMonth)rangeCalendarMonth=currentRangeMonth();
    const [y,m]=rangeCalendarMonth.split('-').map(Number);
    const firstDow=new Date(y,m-1,1).getDay();
    const lastDay=new Date(y,m,0).getDate();
    const from=document.getElementById('scheduleDateFrom')?.value||'';
    const to=document.getElementById('scheduleDateTo')?.value||'';
    const label=document.getElementById('scheduleRangeMonthLabel');
    const days=document.getElementById('scheduleRangeCalendarDays');
    const hint=document.getElementById('scheduleRangePickHint');
    if(label)label.textContent=`${y}年${pad2(m)}月`;
    if(hint)hint.textContent=rangeDraftStart?`開始 ${prettyDate(rangeDraftStart)}，請點結束日期`:'先點開始日期，再點結束日期';
    if(!days)return;
    const todayKey=scheduleTaipeiTodayKey();
    const html=[];
    for(let i=0;i<firstDow;i++)html.push('<span class="schedule-range-blank"></span>');
    for(let d=1;d<=lastDay;d++){
      const key=`${rangeCalendarMonth}-${pad2(d)}`;
      const dow=new Date(y,m-1,d).getDay();
      const cls=['schedule-range-day'];
      if(dow===0||dow===6)cls.push('is-weekend');
      const start=rangeDraftStart||from;
      const end=rangeDraftStart?'':to;
      if(start&&end&&key>=start&&key<=end)cls.push('is-in-range');
      if(key===start)cls.push('is-start');
      if(end&&key===end)cls.push('is-end');
      if(key===todayKey)cls.push('is-today');
      html.push(`<button type="button" class="${cls.join(' ')}" onclick="selectScheduleRangeDay('${key}')">${d}</button>`);
    }
    days.innerHTML=html.join('');
  };

  window.toggleScheduleRangePicker=function(ev){
    if(ev)ev.stopPropagation();
    const pop=document.getElementById('scheduleDateRangePopover');
    const btn=document.getElementById('scheduleDateRangeButton');
    if(!pop)return;
    const opening=pop.classList.contains('hidden');
    if(opening){
      rangeCalendarMonth=currentRangeMonth();
      rangeDraftStart='';
      window.renderScheduleRangeCalendar();
      pop.classList.remove('hidden');
      btn?.setAttribute('aria-expanded','true');
    }else window.closeScheduleRangePicker();
  };

  window.closeScheduleRangePicker=function(){
    document.getElementById('scheduleDateRangePopover')?.classList.add('hidden');
    document.getElementById('scheduleDateRangeButton')?.setAttribute('aria-expanded','false');
    rangeDraftStart='';
  };

  window.moveScheduleRangeCalendar=function(delta){
    rangeCalendarMonth=ymShift(rangeCalendarMonth||currentRangeMonth(),Number(delta)||0);
    rangeDraftStart='';
    window.renderScheduleRangeCalendar();
  };

  async function commitRange(a,b){
    const aEl=document.getElementById('scheduleDateFrom');
    const bEl=document.getElementById('scheduleDateTo');
    const monthEl=document.getElementById('month-picker');
    if(!aEl||!bEl||!monthEl)return;
    if(b<a)[a,b]=[b,a];
    // 排班表以月份為單位；跨月時先切換到結束日期的月份，再重新選擇範圍。
    if(a.slice(0,7)!==b.slice(0,7)){
      rangeCalendarMonth=b.slice(0,7);
      rangeDraftStart=b;
      window.renderScheduleRangeCalendar();
      return;
    }
    const oldMonth=monthEl.value;
    const newMonth=a.slice(0,7);
    aEl.value=a;
    bEl.value=b;
    monthEl.value=newMonth;
    if(newMonth!==oldMonth){
      try{applySchedulePersonnelOverrides(newMonth)}catch(e){}
      try{initDefaultScheduleData(newMonth)}catch(e){}
    }
    window.updateScheduleDateRangeSummary();
    try{buildRoleTabsAndRender()}catch(e){console.warn(e)}
    window.closeScheduleRangePicker();
  }

  window.selectScheduleRangeDay=function(key){
    if(!rangeDraftStart){
      rangeDraftStart=key;
      window.renderScheduleRangeCalendar();
      return;
    }
    commitRange(rangeDraftStart,key);
  };

  window.setScheduleRangeFullMonthFromPicker=function(){
    const ym=rangeCalendarMonth||currentRangeMonth();
    const [a,b]=monthBounds(ym);
    commitRange(a,b);
  };

  document.addEventListener('click',function(e){
    const c=document.getElementById('scheduleRangeControl');
    const pop=document.getElementById('scheduleDateRangePopover');
    if(c&&pop&&!pop.classList.contains('hidden')&&!c.contains(e.target))window.closeScheduleRangePicker();
  });
})();
</script>

<script id="port79-name-only-display-v20260930-88">
(function(){
  'use strict';
  const UNIT_TOKEN = '(?:AQC|ARMG|F\\s*\\/\\s*L|FL|GC|QC|RTG|RMG|領班|指揮手)';
  const NAME_UNIT_RE = new RegExp('([\\u3400-\\u9FFF]{2,5})\\s*[（(]\\s*'+UNIT_TOKEN+'\\s*[）)]','g');
  function nameOnlyText(value){
    return String(value == null ? '' : value).replace(NAME_UNIT_RE,'$1');
  }
  window.port79NameOnly = nameOnlyText;

  function cleanTextNode(node){
    if(!node || node.nodeType!==3) return;
    const old=node.nodeValue||'';
    const next=nameOnlyText(old);
    if(next!==old) node.nodeValue=next;
  }
  function cleanNode(root){
    if(!root) return;
    if(root.nodeType===3){ cleanTextNode(root); return; }
    if(root.nodeType!==1 && root.nodeType!==9 && root.nodeType!==11) return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n; while((n=walker.nextNode())) cleanTextNode(n);
    if(root.nodeType===1){
      ['title','aria-label','placeholder'].forEach(attr=>{
        if(root.hasAttribute && root.hasAttribute(attr)){
          const old=root.getAttribute(attr)||'', next=nameOnlyText(old);
          if(next!==old) root.setAttribute(attr,next);
        }
      });
    }
  }

  let queued=false, pending=[];
  function flush(){
    queued=false;
    const list=pending.splice(0);
    list.forEach(cleanNode);
  }
  function queue(node){
    if(node) pending.push(node);
    if(!queued){ queued=true; requestAnimationFrame(flush); }
  }
  function start(){
    cleanNode(document.body);
    const obs=new MutationObserver(muts=>{
      muts.forEach(m=>{
        if(m.type==='characterData') queue(m.target);
        else m.addedNodes && m.addedNodes.forEach(queue);
      });
    });
    obs.observe(document.body,{subtree:true,childList:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

<script id="p79-schedule-v20261007-compact-month-filter-script">
(function(){
  function mountMonthFilter(){
    const toolbar=document.getElementById('schedule-rule-toolbar');
    const control=document.getElementById('scheduleRangeControl');
    const picker=document.getElementById('month-picker');
    if(!toolbar||!control||!picker)return;
    if(control.parentElement!==toolbar) toolbar.insertBefore(control,toolbar.firstChild);
    control.setAttribute('data-p79-visible-month-filter','1');
    const now=new Date();
    if(!picker.value){
      picker.value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
    }
  }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',mountMonthFilter,{once:true});
  }else{
    mountMonthFilter();
  }
  window.addEventListener('load',mountMonthFilter,{once:true});
})();
</script>

<script>
window.p79OpenReportDraft=async function(){
 try{
  const raw=sessionStorage.getItem(P79Overtime.KEY);if(!raw)return;
  const draft=JSON.parse(raw);
  if(draft.gasUrl!==GAS_URL||Date.now()-draft.createdAt>86400000)throw new Error('待確認申報來源或日期已失效，請回加班管理重新申報');
  if(!canManageSchedule())throw new Error('申報帶入班表需要排班管理權限');
  if(port79ScheduleDirty||port79ScheduleWriteInFlight)throw new Error('請先完成目前班表儲存，再開啟申報');
  if(!scheduleEditLockState.mine&&!await manualAcquireScheduleEditLock())throw new Error('尚未取得排班編輯鎖，請稍後重試');
  document.getElementById('month-picker').value=draft.date.slice(0,7);
  if(!await loadCloudData(false))throw new Error('雲端班表尚未載入，未帶入申報');
  if(!monthlyScheduleData[draft.empId]?.[draft.date])throw new Error('該員工當日尚未排班，請先排班');
  const rule=draft.rule;
  P79Overtime.validate([[rule.category,rule.code,rule.declaredHours,rule.convertedHours??'',rule.normalStart,rule.normalEnd,rule.overtimeStart,rule.overtimeEnd,rule.position]]);
  const current=monthlyScheduleData[draft.empId][draft.date];
  if(rule.category==='延'){
    const normalHour=Number(rule.normalStart.slice(0,2))%24,expected=normalHour<8?'晚':normalHour<16?'早':'中';
    if(current!==expected)throw new Error('此代碼的正常班時段與當日班別不符，請重新選擇代碼');
  }
  openSubstituteAssignment(draft.empId,draft.date);
  if(!document.getElementById('substitute-assignment-modal')||document.getElementById('substitute-assignment-modal').classList.contains('hidden'))throw new Error('無法開啟代班設定，請確認人員與權限');
  p79PendingOvertimeReport=draft;
  document.getElementById('substitute-overtime-kind').value=rule.category==='延'?'extended':'rest';
  const h=Number((rule.category==='延'?rule.normalStart:rule.overtimeStart).slice(0,2))%24;
  document.getElementById('substitute-overtime-shift').value=rule.category==='延'?current:(h<8?'晚':h<16?'早':'中');
  document.getElementById('substitute-overtime-start').value=P79Overtime.time(rule.overtimeStart);
  document.getElementById('substitute-overtime-end').value=P79Overtime.time(rule.overtimeEnd);
  document.getElementById('substitute-note').value=draft.note||'';
  document.getElementById('substitute-modal-subtitle').textContent=draft.date+'｜'+rule.code+'｜加班 '+rule.overtimeStart+'-'+rule.overtimeEnd+(rule.category==='延'?'｜正常 '+rule.normalStart+'-'+rule.normalEnd:'')+'｜換算 '+(rule.convertedHours===null?'未設定':rule.convertedHours+'小時');
  p79ToggleSubstituteType();
 }catch(e){alert('尚未帶入申報：'+e.message)}
};
document.addEventListener('DOMContentLoaded',()=>{
 if(!sessionStorage.getItem(P79Overtime.KEY))return;
 const banner=document.createElement('div');banner.id='p79ReportBanner';banner.style.cssText='padding:12px;margin:8px;background:#e0f2fe;border:1px solid #7dd3fc;border-radius:10px;font-weight:700;color:#0c4a6e';
 banner.innerHTML='有一筆從加班管理帶入的待確認申報。 <button type="button" onclick="p79OpenReportDraft()" style="padding:6px 12px;background:#0369a1;color:white;border-radius:6px">開啟申報並確認</button>';
 document.body.prepend(banner);
});
</script>
