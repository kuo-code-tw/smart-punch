    async function cloudPost(payload) {
      if (!isGasUrlConfigured()) throw new Error('尚未設定 GAS_URL。');
      const action = String(payload?.action || '');
      if (['saveScheduleEmployee','upsertScheduleEmployee','syncScheduleEmployees'].includes(action)) {
        throw new Error('人員主檔已統一由「考勤系統 → 員工清單管理」維護，排班系統不再新增／修改員工基本資料。');
      }
      if (!canManageSchedule()) {
        throw new Error('此帳號只有排班查看權限，不能儲存或修改排班。');
      }
      if(!p79ScheduleHasOfficialData())throw new Error('班表尚未向雲端確認，目前只能查看；請等更新完成再儲存。');
      const scheduleWriteActions = ['syncSchedules','saveSchedules','saveScheduleMonth','saveScheduleGroups'];
      if (scheduleWriteActions.includes(action) && !requireScheduleEditLock(false)) {
        throw new Error(scheduleEditLockState.locked && !scheduleEditLockState.mine
          ? `目前由 ${scheduleLockOwnerLabel()} 正在更改班表，禁止同步修改`
          : '尚未取得排班編輯權，禁止同步修改');
      }
      if (scheduleWriteActions.includes(action)) payload.scheduleClientId = getScheduleClientId();
      const token = currentPort79SsoToken();
      if (token) { payload.gcToken = token; payload.token = token; }

      const send = async () => {
        // 寫入不是「編輯鎖心跳」：超時必須當成結果未確認，不能無條件重送完整月份。
        const isScheduleSave= ['syncSchedules','saveSchedules','saveScheduleMonth'].includes(action);
        let res;
        try {
          res = await scheduleLockFetch(
            GAS_URL,
            {
              method:'POST',
              headers:{'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'},
              body:JSON.stringify(payload),
              redirect:'follow',
              cache:'no-store'
            },
            isScheduleSave ? 35000 : action==='deleteOvertimeAssignment'?45000:20000
          );
        }catch(e){
          if(isScheduleSave && e?.code==='SCHEDULE_LOCK_TIMEOUT'){
            const unknown=new Error('排班寫入等待逾時，雲端可能仍在處理。不要重新整理或連續重複存檔，稍後再核對。');
            unknown.code='SCHEDULE_SAVE_RESULT_UNKNOWN';
            throw unknown;
          }
          throw e;
        }
        const text = await res.text();

        if (scheduleCloudLooksLikeGoogleHtml(text)) {
          const err = new Error(
            'Google Apps Script 沒有回傳系統 JSON，而是回傳 Google 網頁。' +
            '這通常代表 Web App 部署權限失效、部署網址已更換，或 Google 暫時把請求導到登入／同意頁。' +
            '請將 GAS 重新部署為「執行身分：我」＋「誰可以存取：任何人」，並確認前端 GAS_URL 是最新 /exec 網址。'
          );
          err.code = 'GAS_HTML_RESPONSE';
          err.responseSnippet = text.slice(0, 180);
          throw err;
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          const err = new Error('Google 雲端回傳不是有效 JSON，請確認 GAS 部署版本與 /exec 網址。');
          err.code = 'GAS_INVALID_JSON';
          throw err;
        }
        if (!data.ok) throw new Error(data.error || data.message || 'Google 雲端操作失敗');
        return data;
      };

      try {
        return await send();
      } catch (err) {
        // 整月寫入超時/回傳 HTML 可能已在伺服器執行，禁止不明結果盲目重送。
        // 非資料寫入操作才保留既有的一次網路重試。
        if (!scheduleWriteActions.includes(action) &&
            (err?.code === 'GAS_HTML_RESPONSE' || err?.code === 'SCHEDULE_LOCK_TIMEOUT')) {
          await new Promise(resolve => setTimeout(resolve, 900));
          try { return await send(); } catch (retryErr) { throw retryErr; }
        }
        throw err;
      }
    }

    function normalizeScheduleEmploymentStatus(v) {
      const s=String(v||'active').trim().toLowerCase();
      if(['resigned','resign','離職','已離職','離職人員','terminated','inactive'].includes(s))return 'resigned';
      if(['leave','留職停薪','留停','loa'].includes(s))return 'leave';
      return 'active';
    }

function p79EmploymentStartDate(emp) {
  const dates=[emp?.startDate,emp?.reportingDate].map(value=>{
    const m=String(value||'').trim().match(/^(\d{2,4})[\/-](\d{1,2})[\/-](\d{1,2})/);
    if(!m)return '';
    let y=Number(m[1]);if(y<1911)y+=1911;
    const month=Number(m[2]),day=Number(m[3]),check=new Date(y,month-1,day);
    if(check.getFullYear()!==y||check.getMonth()!==month-1||check.getDate()!==day)return '';
    return String(y).padStart(4,'0')+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  }).filter(Boolean).sort();
  return dates.at(-1)||'';
}
function p79EmployeeDateEligible(emp,date) {
  const start=p79EmploymentStartDate(emp);
  return !start||String(date||'').replaceAll('/','-').slice(0,10)>=start;
}

    function scheduleEmployeeEligibleForMonth(emp, yearMonth) {
      const start=p79EmploymentStartDate(emp);
      if(start&&String(yearMonth||'').slice(0,7)<start.slice(0,7))return false;
      // 排班操作名單僅保留在職人員；不刪除雲端既有班表。
      const end=String(emp?.lastWorkDate||emp?.terminationDate||'').replaceAll('/','-').slice(0,10);
      if(/^\d{4}-\d{2}-\d{2}$/.test(end)&&end<scheduleTaipeiTodayKey())return false;
      return normalizeScheduleEmploymentStatus(emp?.employmentStatus)==='active';
    }
    function cloneScheduleEmployee(emp) {
      return {
        id: String(emp?.id || '').trim().toUpperCase(),
        name: String(emp?.name || ''),
        dept: String(emp?.dept || '').trim(),
        role: String(emp?.role || 'AQC'),
        group: String(emp?.group || '不分組'),
        lockType: String(emp?.lockType || 'ROTATION'),
        order: scheduleOrderNumber(emp?.order),
        employmentStatus: normalizeScheduleEmploymentStatus(emp?.employmentStatus),
        startDate:String(emp?.startDate||''),reportingDate:String(emp?.reportingDate||''),
        terminationDate: String(emp?.terminationDate||''),
        lastWorkDate: String(emp?.lastWorkDate||'')
      };
    }

    function currentScheduleMonthKey() {
      return String(document.getElementById('month-picker')?.value || '').trim();
    }

    function savePersonnelOverrideForCurrentMonth(emp) {
      const month = currentScheduleMonthKey();
      const id = String(emp?.id || '').trim().toUpperCase();
      if (!month || !id) return;
      if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
      schedulePersonnelOverrides[month][id] = {
        role: String(emp.role || 'AQC'),
        group: String(emp.group || '不分組'),
        groupExplicit:true,
        lockType: String(emp.lockType || 'ROTATION'),
        order: scheduleOrderNumber(emp.order)
      };
    }

    function scheduleGroupIsMeaningful(value) {
      const g = String(value || '').trim();
      return !!g && g !== '不分組' && g !== '不輪班';
    }

    function latestHistoricalScheduleOverride(empId, targetMonth) {
      const id = String(empId || '').trim().toUpperCase();
      const target = String(targetMonth || '').trim();
      if (!id) return null;
      const months = Object.keys(schedulePersonnelOverrides || {})
        .filter(m => /^\d{4}-\d{2}$/.test(m) && (!target || m < target))
        .sort()
        .reverse();
      for (const month of months) {
        const ov = schedulePersonnelOverrides?.[month]?.[id];
        if (ov && Object.prototype.hasOwnProperty.call(ov,'group')) {
          // A snapshot of an untouched new month often stores 不分組.
          // Only an explicit unassignment may hide a meaningful older group.
          const value=String(ov.group||'').trim();
          if(scheduleGroupIsMeaningful(value)||value==='不輪班'||ov.groupExplicit===true)
            return { month, override: ov };
        }
      }
      return null;
    }

    function scheduleRoleGroupRecoveryNeeded(baseList, overrides, roleName) {
      const role = String(roleName || '').trim();
      const members = (baseList || []).filter(emp => String(emp?.role || '').trim() === role);
      if (members.length < 3) return false;

      let currentMeaningful = 0;
      let historicalMeaningful = 0;
      members.forEach(emp => {
        const ov = overrides?.[emp.id];
        if (scheduleGroupIsMeaningful(ov?.group || emp?.group)) currentMeaningful++;
        if (latestHistoricalScheduleOverride(emp?.id, String(document.getElementById('month-picker')?.value || '').trim())) historicalMeaningful++;
      });

      // 只有「目前整個單位幾乎全掉成不分組、但歷史明確有多筆分組」才啟動救援，
      // 避免使用者真的想把單一同仁改成不分組時被自動改回。
      return currentMeaningful === 0 && historicalMeaningful >= Math.min(3, members.length);
    }

    function applySchedulePersonnelOverrides(yearMonth) {
      const month = String(yearMonth || currentScheduleMonthKey()).trim();
      const base = (employeeMasterBase.length ? employeeMasterBase : employees)
        .map(cloneScheduleEmployee)
        .filter(emp=>scheduleEmployeeEligibleForMonth(emp,month));
      const overrides = schedulePersonnelOverrides[month] || {};

      employees = base.map(emp => {
        const ov = overrides[emp.id] || null;
        const inheritGroup=!ov||(!scheduleGroupIsMeaningful(ov.group)&&ov.group!=='不輪班'&&ov.groupExplicit!==true);
        const inherited=inheritGroup?latestHistoricalScheduleOverride(emp.id,month)?.override:null;
        let group = String((inheritGroup?inherited?.group:null)||ov?.group||emp.group||'不分組').trim()||'不分組';

        return Object.assign(emp, ov ? {
          role: ov.role || emp.role,
          group,
          lockType: ov.lockType || emp.lockType,
          order: scheduleOrderNumber(ov.order) !== null ? scheduleOrderNumber(ov.order) : emp.order
        } : {
          group
        });
      });


    }

    // Read historical group metadata from the same authenticated cloud source.
    // A month-only GET must not be mistaken for the complete cross-month history.
    let p79ScheduleGroupHistoryToken='';
    const p79ScheduleGroupHistoryCache=new Map();
    let p79ScheduleGroupHistoryUnverifiedMonth='';

    function p79ScheduleGroupPreviousMonth(month,offset=1) {
      const match=/^(\d{4})-(0[1-9]|1[0-2])$/.exec(String(month||''));
      if(!match)return '';
      const date=new Date(Date.UTC(Number(match[1]),Number(match[2])-1-offset,1));
      return date.getUTCFullYear()+'-'+String(date.getUTCMonth()+1).padStart(2,'0');
    }

    function p79ScheduleGroupHistorySnapshot(data,expectedMonth) {
      if(!data?.ok||!Array.isArray(data.schedules)||
         (data.month&&String(data.month)!==expectedMonth))return null;
      const overrides={},roleOptions={};
      for(const row of data.schedules){
        if(row.month&&String(row.month)!==expectedMonth)continue;
        const id=String(row.empId||'').trim().toUpperCase();
        if(!id)continue;
        const personnel=row.schedule?.__personnel&&typeof row.schedule.__personnel==='object'
          ?row.schedule.__personnel:{};
        const role=String(personnel.role||row.role||'').trim();
        if(role&&Array.isArray(personnel.groupOptions)){
          roleOptions[role]=[...new Set(personnel.groupOptions.filter(g=>typeof g==='string'&&g.trim()))];
        }
        overrides[id]={
          role,
          group:String(personnel.group||row.group||'不分組').trim()||'不分組',
          groupExplicit:personnel.groupExplicit===true
        };
      }
      return {month:expectedMonth,overrides,roleOptions};
    }

    function p79ScheduleRolesWithoutGroups(month) {
      const roles=new Map();
      for(const emp of employees){
        const role=String(emp.role||'');
        if(!roles.has(role))roles.set(role,[]);
        roles.get(role).push(emp);
      }
      return [...roles].filter(([role,members])=>
        role&&members.length>=3&&
        !members.some(emp=>scheduleGroupIsMeaningful(emp.group))&&
        members.some(emp=>String(emp.group||'不分組')==='不分組'&&
          schedulePersonnelOverrides[month]?.[emp.id]?.groupExplicit!==true)
      ).map(([role])=>role);
    }

    async function p79ScheduleLoadPreviousGroups(month,token,roles) {
      if(token!==p79ScheduleGroupHistoryToken){
        p79ScheduleGroupHistoryCache.clear();
        p79ScheduleGroupHistoryToken=token;
      }
      const history=[],found=new Set();
      // Look back past any untouched months until the prior assignment is found.
      // Keep requests bounded; never touch official shifts from other months.
      for(let distance=1;distance<=4;distance++){
        const previous=p79ScheduleGroupPreviousMonth(month,distance);
        if(!previous)break;
        let snapshot=p79ScheduleGroupHistoryCache.get(previous);
        if(!snapshot){
          const controller=typeof AbortController!=='undefined'?new AbortController():null;
          const timer=controller?setTimeout(()=>controller.abort(),8000):null;
          try{
            const res=await fetch(
              GAS_URL+'?action=getScheduleDataSecure&gcToken='+encodeURIComponent(token)+
              '&month='+encodeURIComponent(previous)+'&_='+Date.now(),
              {redirect:'follow',cache:'no-store',signal:controller?.signal}
            );
            if(!res.ok)throw new Error('歷史月份讀取 HTTP '+res.status);
            snapshot=p79ScheduleGroupHistorySnapshot(await res.json(),previous);
            if(!snapshot)throw new Error('歷史月份 '+previous+' 回傳資料不完整');
            p79ScheduleGroupHistoryCache.set(previous,snapshot);
          }catch(error){
            console.warn('歷史分組核對失敗：'+previous,error);
            return {history,verified:false};
          }finally{if(timer)clearTimeout(timer);}
        }
        history.unshift(snapshot);
        for(const row of Object.values(snapshot.overrides)){
          if(roles.includes(row.role)&&scheduleGroupIsMeaningful(row.group))found.add(row.role);
        }
        if(roles.every(role=>found.has(role)))break;
      }
      return {history,verified:true};
    }

    function p79ScheduleRestorePreviousGroups(month,history) {
      for(const snapshot of history||[]){
        if(snapshot.month>=month)continue;
        if(!schedulePersonnelOverrides[snapshot.month])schedulePersonnelOverrides[snapshot.month]={};
        for(const [id,override] of Object.entries(snapshot.overrides)){
          if(!Object.prototype.hasOwnProperty.call(schedulePersonnelOverrides[snapshot.month],id))
            schedulePersonnelOverrides[snapshot.month][id]=override;
        }
        if(!scheduleRoleGroupOptions[snapshot.month])scheduleRoleGroupOptions[snapshot.month]={};
        for(const [role,groups] of Object.entries(snapshot.roleOptions)){
          if(!Object.prototype.hasOwnProperty.call(scheduleRoleGroupOptions[snapshot.month],role))
            scheduleRoleGroupOptions[snapshot.month][role]=groups;
        }
      }
      applySchedulePersonnelOverrides(month);
      const groups=new Set(availableGroups||[]);
      for(const emp of employees)if(emp.group)groups.add(emp.group);
      groups.add('不分組');
      groups.delete('不輪班');
      availableGroups=[...groups,'不輪班'];
    }

    let p79ScheduleCloudRows=[];
    function p79PreserveLinkedScheduleDays(rows,cloudRows,month,isProtected){
      const originals=new Map((cloudRows||[]).filter(row=>String(row.month||'')===month)
        .map(row=>[String(row.empId||'').trim().toUpperCase(),row.schedule||{}]));
      return rows.map(row=>{
        const original=originals.get(String(row.empId||'').trim().toUpperCase());
        if(!original)return row;
        const next=JSON.parse(JSON.stringify(row)),schedule=next.schedule;
        const dates=new Set([...Object.keys(original),...Object.keys(original.__meta||{}),...Object.keys(schedule)]);
        for(const date of dates){
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!date.startsWith(month+'-'))continue;
          const meta=original.__meta?.[date];
          if(!meta?.forEmpId&&!meta?.overtimeReport?.leaveId&&!isProtected(row.empId,date,row.name))continue;
          // Daily editing already forbids linked leave/cover dates. A monthly
          // save must not turn a display/automatic overlay into an edit to them.
          if(Object.prototype.hasOwnProperty.call(original,date))schedule[date]=original[date];
          else delete schedule[date];
          if(Object.prototype.hasOwnProperty.call(original.__meta||{},date)){
            if(!schedule.__meta)schedule.__meta={};
            schedule.__meta[date]=JSON.parse(JSON.stringify(original.__meta[date]));
          }else if(schedule.__meta)delete schedule.__meta[date];
        }
        return next;
      });
    }

    function p79PreserveHiddenScheduleRows(editedRows,cloudRows,month){
      const result=JSON.parse(JSON.stringify(editedRows));
      const ids=new Set(result.map(row=>String(row.empId||'').trim().toUpperCase()));
      for(const row of cloudRows||[]){
        if(String(row.month||'')!==month)continue;
        const id=String(row.empId||'').trim().toUpperCase();
        if(!id||ids.has(id))continue;
        if(!row.schedule||typeof row.schedule!=='object'||Array.isArray(row.schedule))throw Error('雲端保留班表格式不完整，已停止儲存：'+id);
        // Hidden/inactive staff are not a deletion request. Preserve the exact
        // official row, including personnel, declarations and amendment history.
        result.push(JSON.parse(JSON.stringify(row)));
        ids.add(id);
      }
      return result;
    }

    function p79ApplySchedulePayload(data,requestMonth){
        p79ScheduleCloudRows=JSON.parse(JSON.stringify(data.schedules||[])).map(row=>({...row,month:row.month||requestMonth}));
        const cloudEmployees = (data.employees || [])
          .filter(emp => String(emp.empId || '').toUpperCase() !== 'ADMIN' && (emp.empId || emp.name))
          .map(emp => ({
            id: String(emp.empId || '').trim().toUpperCase(),
            name: emp.name || '',
            dept: String(emp.dept || '').trim(),
            role: emp.jobTitle || emp.deptDetail || emp.role || emp.dept || 'AQC',
            group: emp.group || '不分組',
            lockType: emp.lockType || 'ROTATION',
            order: scheduleOrderNumber(emp.order),
            employmentStatus: emp.employmentStatus || 'active',
            startDate:emp.startDate||'',reportingDate:emp.reportingDate||'',
            terminationDate: emp.terminationDate || '',
            lastWorkDate: emp.lastWorkDate || '',
            attendanceNo: String(emp.attendanceNo || emp.attNo || emp.attendanceId || '').trim().toUpperCase(),
            attNo: String(emp.attNo || emp.attendanceNo || emp.attendanceId || '').trim().toUpperCase()
          }))
          .filter(emp => emp.id);

        employeeMasterBase = cloudEmployees.map(cloneScheduleEmployee);

        leaveRecords = Array.isArray(data.leaveRecords) ? data.leaveRecords : [];
        leaveCoverAssignments = Array.isArray(data.leaveCoverAssignments) ? data.leaveCoverAssignments : [];
        // 不使用排班快照的空值清除出勤中狀態；由即時考勤端點更新。
        monthlyScheduleData = {};
      window.P79ScheduleRestSummary?.clear();
        monthlyScheduleMeta = {};
        schedulePersonnelOverrides = {};
        scheduleRoleGroupOptions = {};

        (data.schedules || []).forEach(row => {
          const empId = String(row.empId || '').trim().toUpperCase();
          const month = String(row.month || '').trim();
          const schedule = row.schedule && typeof row.schedule === 'object' ? Object.assign({}, row.schedule) : {};
          if (!empId) return;

          const personnel = schedule.__personnel && typeof schedule.__personnel === 'object'
            ? Object.assign({}, schedule.__personnel)
            : {};
          const groupRole=String(personnel.role||row.role||'');
          if(month&&groupRole&&Array.isArray(personnel.groupOptions)){
            if(!scheduleRoleGroupOptions[month])scheduleRoleGroupOptions[month]={};
            scheduleRoleGroupOptions[month][groupRole]=personnel.groupOptions.filter(g=>typeof g==='string'&&g.trim());
          }
          if (month) {
            if (!schedulePersonnelOverrides[month]) schedulePersonnelOverrides[month] = {};
            schedulePersonnelOverrides[month][empId] = {
              role: String(personnel.role || row.role || ''),
              group: String(personnel.group || row.group || '不分組'),
              groupExplicit:personnel.groupExplicit===true,
              lockType: String(personnel.lockType || 'ROTATION'),
              order: scheduleOrderNumber(personnel.order ?? row.order)
            };
          }
          delete schedule.__personnel;

          if (!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
          if (!monthlyScheduleMeta[empId]) monthlyScheduleMeta[empId] = {};
          const meta = schedule.__meta && typeof schedule.__meta === 'object' ? schedule.__meta : {};
          delete schedule.__meta;
          Object.assign(monthlyScheduleData[empId], schedule);
          // GAS may legitimately return null for an unannotated day. Keep the
          // actual roster unchanged, but normalize nullable day metadata in the
          // in-memory presentation model so rendering can safely read overtimeReport.
          const safeMeta={};
          for(const [date,entry] of Object.entries(meta)){
            safeMeta[date]=/^\d{4}-\d{2}-\d{2}$/.test(date)&&
              (!entry||typeof entry!=='object'||Array.isArray(entry))?{}:entry;
          }
          Object.assign(monthlyScheduleMeta[empId], safeMeta);
        });

        window.P79ScheduleRestSummary.acceptRows(data.schedules||[]);
        applySchedulePersonnelOverrides(requestMonth);

        const groupSet = new Set(['不分組']);
        (data.scheduleGroups || []).forEach(g => { if(g) groupSet.add(g); });
        employees.forEach(emp => { if(emp.group) groupSet.add(emp.group); });

        // V10.24：即使 ScriptProperties 的組別清單被洗掉，
        // 仍從歷史月份的人員分組撈回 A組/B組/C組等有效組別。
        Object.values(schedulePersonnelOverrides || {}).forEach(monthMap => {
          Object.values(monthMap || {}).forEach(ov => {
            const g = String(ov?.group || '').trim();
            if (scheduleGroupIsMeaningful(g)) groupSet.add(g);
          });
        });

        groupSet.delete('不輪班');
        availableGroups = [...groupSet, '不輪班'];

    }

    async function loadCloudData(showAlert = false) {
      const requestMonth=currentScheduleMonthKey();
      const requestEpoch=p79SchedulePreviewEpoch;
      const requestToken=currentPort79SsoToken();
      const requestViewer=window.Port79DataCache?.viewerKey?.();
      const requestMutationVersion = p79ScheduleLocalMutationVersion;
      const requestStartedAt = Date.now();

      if (!isGasUrlConfigured()) {
        if (showAlert) alert('⚠️ 請先在 HTML 程式上方設定 GAS_URL。');
        return false;
      }
      try {
        const token = requestToken;
        // V10.16：雲端整包讀取最多等 10 秒，避免 GAS 冷啟動或網路異常時
        // port79ScheduleAutoSyncBusy 永久卡住；失敗交由背景重試，不阻擋進頁。
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        p79ScheduleCloudReadController=controller;
        const timer = controller ? setTimeout(() => controller.abort(), 10000) : null;
        let data;
        try {
          const res = await fetch(
            GAS_URL + '?action=getScheduleDataSecure&gcToken=' + encodeURIComponent(token) + '&month=' + encodeURIComponent(requestMonth) + '&_=' + Date.now(),
            { redirect:'follow', cache:'no-store', signal:controller?.signal }
          );
          if(!res.ok)throw new Error('排班讀取失敗：HTTP '+res.status);
          data=await res.json();
        } finally {
          if (timer) clearTimeout(timer);
          if(p79ScheduleCloudReadController===controller)p79ScheduleCloudReadController=null;
        }
        if(requestMonth!==currentScheduleMonthKey()||requestEpoch!==p79SchedulePreviewEpoch||requestToken!==currentPort79SsoToken())return false;
        if (!data.ok) throw new Error(data.error || '讀取失敗');
        if(!Array.isArray(data.employees)||!Array.isArray(data.schedules)||(data.month&&String(data.month)!==requestMonth))throw new Error('排班資料不完整或月份不符，已保留目前畫面');

        // V10.15：這份 GET 若是在使用者修改前發出、修改後才回來，就是過期快照。
        // 不允許它清空 monthlyScheduleData / personnel overrides。
        const staleAgainstLocalEdit =
          requestMutationVersion !== p79ScheduleLocalMutationVersion ||
          port79ScheduleDirty ||
          !!scheduleSaveTimer ||
          !!personnelSaveTimer ||
          !!port79ScheduleWriteInFlight ||
          Date.now() < p79ScheduleProtectLocalUntil;

        if (staleAgainstLocalEdit) {
          // 非排班附屬狀態仍可安全更新。
          leaveRecords = Array.isArray(data.leaveRecords) ? data.leaveRecords : leaveRecords;
          leaveCoverAssignments = Array.isArray(data.leaveCoverAssignments) ? data.leaveCoverAssignments : leaveCoverAssignments;
          // 亮燈由獨立即時端點管理；全量排班快照不可覆寫較新的狀態。
          cloudLoaded = true;
          console.info('[PORT79 SCHEDULE V10.15] 忽略過期雲端班表快照', {
            requestStartedAt,
            requestMutationVersion,
            currentMutationVersion:p79ScheduleLocalMutationVersion,
            dirty:port79ScheduleDirty
          });
          return true;
        }

        p79ApplySchedulePayload(data,requestMonth);
        const missingRoles=typeof p79ScheduleRolesWithoutGroups==='function'
          ?p79ScheduleRolesWithoutGroups(requestMonth):[];
        if(missingRoles.length){
          // No save while history is unverified: an ungrouped snapshot could
          // otherwise permanently overwrite the previous group's assignments.
          p79ScheduleGroupHistoryUnverifiedMonth=requestMonth;
          const {history,verified}=await p79ScheduleLoadPreviousGroups(requestMonth,token,missingRoles);
          if(requestMonth!==currentScheduleMonthKey()||requestEpoch!==p79SchedulePreviewEpoch||
             token!==currentPort79SsoToken()||requestMutationVersion!==p79ScheduleLocalMutationVersion||
             port79ScheduleDirty||scheduleSaveTimer||personnelSaveTimer||port79ScheduleWriteInFlight)return false;
          p79ScheduleRestorePreviousGroups(requestMonth,history);
          if(verified)p79ScheduleGroupHistoryUnverifiedMonth='';
        }else if(typeof p79ScheduleGroupHistoryUnverifiedMonth!=='undefined'&&
                 p79ScheduleGroupHistoryUnverifiedMonth===requestMonth){
          p79ScheduleGroupHistoryUnverifiedMonth='';
        }
        p79ConfirmScheduleSource(data,requestMonth,requestStartedAt,requestViewer,token);
        p79ScheduleRestClient().refresh(requestMonth);
        cloudLoaded = true;
        saveAllDataToLocalStorage();
        if (showAlert) alert('✅ 已重新載入 Google 雲端最新資料！');
        return true;
      } catch (err) {
        if(requestEpoch===p79SchedulePreviewEpoch&&requestMonth===currentScheduleMonthKey()&&requestToken===currentPort79SsoToken()){p79ScheduleSourceState.error=String(err?.message||'雲端連線未完成');p79RenderScheduleDataSource();}
        console.error(err);
        // 網路失敗後也必須結束「正在讀取班表」；若已有快取則繼續呈現可查看班表。
        if(requestEpoch===p79SchedulePreviewEpoch&&requestMonth===currentScheduleMonthKey()){
          try {renderRoleScheduleView();}
          catch(error){p79SchedulePreviewRenderError(error);}
        }
        if (showAlert) alert('❌ 無法讀取 Google 雲端：\n' + err.message + '\n\n請確認 GAS 網址、部署版本與存取權限。');
        return false;
      }
    }

    function p79CreateScheduleSaveRequestId(){
      let random='';
      try{random=crypto.randomUUID();}
      catch(e){random=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);}
      return 'SCHSAVE-'+random;
    }

    // Only a matching V5 server receipt counts as confirmation after an ambiguous timeout.
    // This is read-only and NEVER resubmits the original whole-month POST.
    async function p79ConfirmScheduleSaveReceipt(requestId,yearMonth){
      const token=currentPort79SsoToken();
      const clientId=getScheduleClientId();
      if(!token||!clientId||!requestId)return null;
      // GAS 排隊或 Google 暫時回傳 5xx 時，仍只查同一筆回條，不重送班表。
      for(let attempt=0;attempt<4;attempt++){
        if(currentPort79SsoToken()!==token||getScheduleClientId()!==clientId)return null;
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),20000);
        try{
          const u=new URL(GAS_URL);
          u.searchParams.set('action','scheduleGetSaveReceipt');
          u.searchParams.set('gcToken',token);
          u.searchParams.set('scheduleClientId',clientId);
          u.searchParams.set('saveRequestId',requestId);
          u.searchParams.set('_',String(Date.now()));
          const response=await fetch(u.toString(),{method:'GET',cache:'no-store',redirect:'follow',signal:controller.signal});
          const data=await response.json();
          if(!response.ok||data?.ok!==true){
            // A failed lookup is not proof of an old deployment or a failed save.
            if(response.status===401||response.status===403)return null;
            throw new Error('存檔回條暫時無法讀取');
          }
          if(data.found && data.completed && data.saveRequestId===requestId &&
             data.month===yearMonth && currentPort79SsoToken()===token &&
             getScheduleClientId()===clientId)return data;
        }catch(e){
          console.warn('查詢排班存檔回條暫時失敗：',String(e?.name||'連線異常'));
        }finally{clearTimeout(timeout);}
        if(attempt<3)await new Promise(resolve=>setTimeout(resolve,[1500,3000,5000][attempt]));
      }
      return null;
    }

    // 只在持有排班編輯鎖且正式考勤全月讀取成功時，自動把無任何打卡的已過日期改為「休」。
    // 考勤歸屬以原上班日為準；隔日凌晨的 OUT 同時計入前一日，避免跨日班誤判。
    async function p79ApplyNoPunchRestFromOfficial(yearMonth) {
      const requestMutationVersion=p79ScheduleLocalMutationVersion;
      const requestViewVersion=p79ScheduleAttendanceViewVersion;
      if(!scheduleEditLockState.mine||port79ScheduleDirty||!p79ScheduleHasOfficialData())return 0;
      const token=currentPort79SsoToken();
      if(!token)return 0;
      const today=scheduleTaipeiTodayKey();
      const [year,month]=yearMonth.split('-').map(Number);
      if(!year||!month||yearMonth>today.slice(0,7))return 0;
      const nextDate=new Date(Date.UTC(year,month,1));
      const nextMonth=nextDate.toISOString().slice(0,7);
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),18000);
      let fetched;
      try{
        fetched=await Promise.all([...new Set([yearMonth,nextMonth])].map(async m=>{
          const url=GAS_URL+'?action=getAttendanceMainDirect&month='+encodeURIComponent(m)+'&token='+encodeURIComponent(token)+'&t='+Date.now();
          const response=await fetch(url,{cache:'no-store',signal:controller.signal});
          const data=await response.json();
          if(!response.ok||data?.ok!==true||!Array.isArray(data.records)||String(data.month||'')!==m)throw Error('正式考勤月份核對失敗：'+m);
          return data.records;
        }));
      }catch(error){
        console.warn('未能安全核對全月正式考勤，排班保持原狀',error);
        return 0;
      }finally{clearTimeout(timeout);}
      if(document.getElementById('month-picker')?.value!==yearMonth||!scheduleEditLockState.mine||currentPort79SsoToken()!==token||requestViewVersion!==p79ScheduleAttendanceViewVersion||requestMutationVersion!==p79ScheduleLocalMutationVersion||port79ScheduleDirty||scheduleSaveTimer||personnelSaveTimer||port79ScheduleWriteInFlight)return 0;
      const presence=new Set();
      const stamp=record=>{
        const raw=String(record?.timeStr||record?.time||'');
        const m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}):(\d{2})/);
        if(!m)return null;
        return {date:m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'),hour:Number(m[4]),type:scheduleAttendanceRecordType(record)};
      };
      const byAtt=new Map();
      employees.forEach(emp=>{const key=String(emp.attNo||emp.attendanceNo||'').trim();if(key){const set=byAtt.get(key)||new Set();set.add(String(emp.id||emp.empId||'').trim().toUpperCase());byAtt.set(key,set);}});
      fetched.flat().forEach(record=>{
        if(record?.deleted===true||record?.isDeleted===true)return;
        const info=stamp(record);if(!info||!info.type)return;
        let id=String(record.empId||'').trim().toUpperCase();
        if(!id){const set=byAtt.get(String(record.attNo||record.attendanceNo||'').trim());if(set?.size===1)id=[...set][0];}
        if(!id)return;
        presence.add(id+'|'+info.date);
        if(info.type==='OUT'&&info.hour<12){
          const p=new Date(Date.parse(info.date+'T00:00:00Z')-86400000).toISOString().slice(0,10);
          presence.add(id+'|'+p);
        }
      });
      let changed=0,restored=0;
      // Official full IN+OUT pairs can reverse an earlier automated 休, including
      // dates that an auto-v1 quota subsequently displayed as 例 or 國.
      // No guessing from an IN-only record, a payroll declaration or a bare date.
      const recover=window.P79SchedulePunchRestore?.plan({
        records:fetched.flat(),employees,schedules:monthlyScheduleData,
        metadata:monthlyScheduleMeta,month:yearMonth,today,
        allowUnmarked:true,
        isProtected:(empId,date)=>approvedLeaveForEmployee(empId,date)||
          p79LeaveCoverOnDay(empId,date).length>0
      });
      if(!recover)throw Error('考勤與排班反向核對模組未載入，本次不修改班表');
      for(const row of recover.corrections){
        const emp=employees.find(e=>String(e.id||e.empId).trim().toUpperCase()===row.empId);
        if(!emp||!monthlyScheduleData[emp.id]||
           !['休','例','國','早','中','晚'].includes(String(monthlyScheduleData[emp.id][row.date]||''))||
           String(monthlyScheduleData[emp.id][row.date])===row.shift)continue;
        const old=monthlyScheduleData[emp.id][row.date];
        const prior={...(monthlyScheduleMeta[emp.id]?.[row.date]||{})};
        const safe={...prior};
        if(safe.restAllocationSource==='auto-v1'){
          for(const field of ['restCategory','restSourceDate','restHolidayName','restQuotaOvertime',
            'restAllocationSource','restPreferredCategory'])delete safe[field];
        }
        delete safe.noPunchOriginalShift;
        safe.punchRestoredOriginalShift=String(prior.noPunchOriginalShift||old);
        if(!monthlyScheduleMeta[emp.id])monthlyScheduleMeta[emp.id]={};
        monthlyScheduleMeta[emp.id][row.date]=safe;
        monthlyScheduleData[emp.id][row.date]=row.shift;
        restored++;changed++;
      }
      if(restored)console.info('正式考勤已恢復 '+restored+' 個原本誤判為休假的工作班（不含人工休假／正式加班）');
      employees.forEach(emp=>{
        const id=String(emp.id||emp.empId||'').trim().toUpperCase();
        if(!id||!monthlyScheduleData[emp.id])return;
        Object.keys(monthlyScheduleData[emp.id]).forEach(date=>{
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!date.startsWith(yearMonth)||date>=today)return;
          if(!p79EmployeeDateEligible(emp,date)||presence.has(id+'|'+date))return;
          const shift=monthlyScheduleData[emp.id][date];
          if(!shift||['休','例','國','特','年','事','病','公','喪','颱','離'].includes(String(shift)))return;
          const meta=monthlyScheduleMeta[emp.id]?.[date];
          if(meta&&(meta.manualRosterShift===shift||meta.forEmpId||meta.overtime||meta.overtimeReport||meta.note))return;
          if(approvedLeaveForEmployee(emp.id,date)||p79LeaveCoverOnDay(emp.id,date).length)return;
          if(!monthlyScheduleMeta[emp.id])monthlyScheduleMeta[emp.id]={};
          const original={...(monthlyScheduleMeta[emp.id][date]||{})};
          // Persist the original shift so a later cloud punch can restore it.
          if(!original.noPunchOriginalShift)original.noPunchOriginalShift=String(shift);
          monthlyScheduleMeta[emp.id][date]=original;
          monthlyScheduleData[emp.id][date]='休';
          changed++;
        });
      });
      if(changed){p79MarkScheduleLocalMutation();try{buildRoleTabsAndRender();}catch(ignore){}}
      return changed;
    }

    async function saveScheduleMonthToCloud(showAlert = true) {
      if(!requireScheduleEditLock(showAlert))return false;
      const yearMonth = document.getElementById('month-picker').value;
      if(p79ScheduleGroupHistoryUnverifiedMonth===yearMonth){
        if(showAlert)alert('尚未確認上月分組資料，為避免把原組別覆蓋成不分組，請先重新讀取雲端班表。');
        return false;
      }
      if(scheduleEditLockState.mine)await p79ApplyNoPunchRestFromOfficial(yearMonth);
      if (scheduleEditLockState.mine) p79ApplyAutomaticRestMetadata();
      const snapshotVersion=p79ScheduleLocalMutationVersion;
      let schedules = employees.map(emp => {
        const monthData = {};
        const allEmp = monthlyScheduleData[emp.id] || {};
        Object.keys(allEmp).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-')) monthData[dateKey] = allEmp[dateKey];
        });
        const allMeta = monthlyScheduleMeta[emp.id] || {};
        const monthMeta = {};
        Object.keys(allMeta).forEach(dateKey => {
          if (dateKey.startsWith(yearMonth + '-') && allMeta[dateKey] && typeof allMeta[dateKey] === 'object') {
            monthMeta[dateKey] = allMeta[dateKey];
          }
        });
        if (Object.keys(monthMeta).length) monthData.__meta = monthMeta;
        monthData.__personnel = {
          role: emp.role || 'AQC',
          group: emp.group || '不分組',
          groupExplicit:schedulePersonnelOverrides[yearMonth]?.[emp.id]?.groupExplicit===true,
          groupOptions:scheduleRoleGroupList(emp.role,yearMonth).filter(g=>g!=='不分組'),
          lockType: emp.lockType || 'ROTATION',
          order: scheduleOrderNumber(emp.order)
        };
        savePersonnelOverrideForCurrentMonth(emp);
        return { empId: emp.id, name: emp.name, role: emp.role, group: emp.group, month: yearMonth, schedule: monthData };
      });
      try {
        const editedIds=new Set(schedules.map(row=>String(row.empId).trim().toUpperCase()));
        schedules=p79PreserveHiddenScheduleRows(schedules,p79ScheduleCloudRows,yearMonth);
        schedules=p79PreserveLinkedScheduleDays(schedules,p79ScheduleCloudRows,yearMonth,
          (id,date,name)=>!!approvedLeaveForEmployee(id,date,name)||p79LeaveCoverOnDay(id,date).length>0);
        schedules.filter(row=>editedIds.has(String(row.empId).trim().toUpperCase())).forEach(row=>Object.entries(row.schedule.__meta||{}).forEach(([date,meta])=>{
          if(!meta?.overtimeType)return;
          try {
            p79BuildScheduleOvertimeMeta(meta,meta.type==='substitute'?'substitute':meta.overtimeType,
              String(row.schedule[date]||''),String(row.schedule[date]||''),
              String(meta.overtimeStart||''),String(meta.overtimeEnd||''),{});
          }catch(error){throw new Error(`${row.name}（${row.empId}）${date}：${error.message}。請開啟該日「代班／加班設定」補齊後再儲存。`);}
        }));
        // 限定對可重試的 GAS 忙碌錯誤重試。完整月份快照固定不變，
        // 絕不對編輯權不足、資料格式錯誤或不明原因做盲目重送。
        const confirmedRestRows=JSON.parse(JSON.stringify(schedules));
        const snapshot={
          action:'syncSchedules',month:yearMonth,schedules,
          expectedEmployeeCount:schedules.length,
          saveRequestId:p79CreateScheduleSaveRequestId()
        };
        let result;
        for(let attempt=0;attempt<3;attempt++){
          try{
            result=await cloudPost(snapshot);
            break;
          }catch(error){
            // POST may already have committed when a network timeout/HTML response happens.
            // Query its V5 receipt instead of blindly sending the entire month again.
            if(['SCHEDULE_SAVE_RESULT_UNKNOWN','GAS_HTML_RESPONSE','GAS_INVALID_JSON'].includes(error?.code) ||
               scheduleLockIsTransientNetworkError(error)){
              const receipt=await p79ConfirmScheduleSaveReceipt(snapshot.saveRequestId,yearMonth);
              if(receipt){
                result={ok:true,receiptConfirmed:true,recoveredAfterTimeout:true,
                  message:'已向 GAS 查到這筆排班的成功存檔回條'};
                break;
              }
              const unknown=new Error('存檔請求已發出，但目前仍無法確認雲端結果，不能判定儲存成功或失敗。請保留目前畫面，暫勿重新整理或重複儲存；需核對這筆存檔回條與雲端班表。');
              unknown.code='SCHEDULE_SAVE_RESULT_UNKNOWN';
              throw unknown;
            }
            const message=String(error?.message||error||'');
            const temporaryBusy=/雲端目前正在處理其他資料|雲端忙碌|雲端正忙|稍後自動重試|尚未完成儲存|排班雲端忙碌/.test(message);
            if(!temporaryBusy || attempt>=2)throw error;
            // 不再在忙碌重試途中額外發 GET 查鎖，避免每一次存檔又多出等待。
            // 下次正式 syncSchedules 由 GAS 在寫入鎖內重新驗證編輯權。
            if(!scheduleEditLockState.mine)throw error;
            await new Promise(resolve=>setTimeout(resolve,[1700,3200][attempt]));
            console.warn('排班雲端忙碌，等待後重試存檔',attempt+2);
          }
        }
        saveAllDataToLocalStorage();
        p79MarkScheduleCloudWriteConfirmed(snapshotVersion);
        // Notify other open systems only after GAS confirmed this month's schedule save.
        // A single notification covers every employee / shift, not just overtime edits.
        try{localStorage.setItem('port79_schedule_month_saved_v1',JSON.stringify({month:yearMonth,at:Date.now(),version:snapshotVersion}));}catch(error){console.warn('跨系統排班更新通知未送出',error)}
        window.P79ScheduleRestSummary.acceptRows(confirmedRestRows,yearMonth);
        p79RefreshScheduleRestCounts(yearMonth);
        p79ScheduleRestClient().refresh(yearMonth);
        try{
          const draft=JSON.parse(sessionStorage.getItem(P79Overtime.KEY)||'null');

    // v2026.09.30.8.9：恢復「人員上下移動」。
    // 順序存進目前月份排班資料的 __personnel.order，不修改人資主檔。
    function scheduleOrderNumber(v) {
      if (v === null || v === undefined || String(v).trim() === '') return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function compareScheduleEmployeeOrder(a, b) {
      const ao = scheduleOrderNumber(a?.order);
      const bo = scheduleOrderNumber(b?.order);
      if (ao !== null || bo !== null) {
        if (ao === null) return 1;
        if (bo === null) return -1;
        if (ao !== bo) return ao - bo;
      }
      return String(a?.id || '').localeCompare(String(b?.id || ''), 'zh-Hant', { numeric: true });
    }

    function sortScheduleEmployeesForRole(list) {
      return [...(list || [])].sort((a, b) => {
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return compareScheduleEmployeeOrder(a, b);
      });
    }

    function nextScheduleOrder(role, group, excludeId = '') {
      const nums = employees
        .filter(e => e.id !== excludeId && e.role === role && e.group === group)
        .map(e => scheduleOrderNumber(e.order))
        .filter(v => v !== null);
      return nums.length ? Math.max(...nums) + 10 : 10;
    }

    function moveScheduleEmployee(empId, direction) {
      if (!requireScheduleEditLock()) return;
      const emp = employees.find(e => e.id === empId);
      if (!emp) return;

      const peers = employees
        .filter(e => e.role === emp.role && e.group === emp.group)
        .sort(compareScheduleEmployeeOrder);

      // 舊資料沒有 order 時，先依目前穩定順序建立 10、20、30...。
      peers.forEach((p, i) => { p.order = (i + 1) * 10; });

      const idx = peers.findIndex(e => e.id === empId);
      if (idx < 0) return;
      const target = direction < 0 ? idx - 1 : idx + 1;
      if (target < 0 || target >= peers.length) return;

      const [moved] = peers.splice(idx, 1);
      peers.splice(target, 0, moved);
      peers.forEach((p, i) => {
        p.order = (i + 1) * 10;
        savePersonnelOverrideForCurrentMonth(p);
      });

      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    // v10.4：人員順序改為拖曳排序，支援滑鼠 / 觸控筆 / 手指。
    let scheduleDragState = null;

    function scheduleNormalizePeerOrders(role, group) {
      const peers=employees.filter(e=>e.role===role && e.group===group).sort(compareScheduleEmployeeOrder);
      peers.forEach((p,i)=>{p.order=(i+1)*10;});
      return peers;
    }

    function scheduleCommitDragOrder(sourceId, targetId, insertAfter=false) {
      if (!requireScheduleEditLock()) return;
      if (!sourceId || !targetId || sourceId===targetId) return;
      const source=employees.find(e=>e.id===sourceId);
      const target=employees.find(e=>e.id===targetId);
      if(!source || !target) return;
      if(source.role!==target.role || source.group!==target.group){
        if(typeof showScheduleToast==='function') showScheduleToast('拖曳排序只能在同一職稱、同一組別內調整','warning');
        else alert('拖曳排序只能在同一職稱、同一組別內調整');
        return;
      }
      const peers=scheduleNormalizePeerOrders(source.role,source.group);
      const from=peers.findIndex(e=>e.id===sourceId);
      let to=peers.findIndex(e=>e.id===targetId);
      if(from<0 || to<0)return;
      const [moved]=peers.splice(from,1);
      to=peers.findIndex(e=>e.id===targetId);
      if(insertAfter) to+=1;
      peers.splice(Math.max(0,Math.min(to,peers.length)),0,moved);
      peers.forEach((p,i)=>{ p.order=(i+1)*10; savePersonnelOverrideForCurrentMonth(p); });
      queuePersonnelCloudSave();
      buildRoleTabsAndRender();
    }

    function scheduleDragPointerMove(ev) {
      if(!scheduleDragState)return;
      const row=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.('[data-p79-drag-emp]');
      document.querySelectorAll('[data-p79-drag-emp].p79-drag-target-before,[data-p79-drag-emp].p79-drag-target-after').forEach(x=>x.classList.remove('p79-drag-target-before','p79-drag-target-after'));

      if(!source||!target||source.role!==target.role||source.group!==target.group)return;
      const rect=row.getBoundingClientRect();

      scheduleDragState.targetId=targetId; scheduleDragState.insertAfter=after;

    function calculateShiftForDay(emp, empIndexInRole, dayNum, dayOfWeek) {
      const date=currentScheduleMonthKey()+'-'+String(dayNum).padStart(2,'0');
      if(!p79EmployeeDateEligible(emp,date))return '';
      if (emp.lockType === 'FIXED_LOCKED') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }
      if (emp.group === '不輪班') {
        return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      }

      const algo = document.getElementById('schedule-algorithm').value;
      if (algo === 'WEEKEND_OFF') return (dayOfWeek === 0 || dayOfWeek === 6) ? '休' : '早';
      if (algo === 'FIXED_EARLY') return '早';

      const offset = empIndexInRole * 2;

      if (algo === 'TWO_TWO') {
        const cycle = ['早', '早', '休', '休', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      if (algo === 'FOUR_TWO') {
        const cycle = ['早', '早', '早', '早', '休', '休', '中', '中', '中', '中', '休', '休', '晚', '晚', '晚', '晚', '休', '休'];
        const pos = (dayNum - 1 + offset) % cycle.length;
        return cycle[pos];
      }

      const ew = parseInt(document.getElementById('early-work-input').value) || 0;
      const eo = parseInt(document.getElementById('early-off-input').value) || 0;
      const mw = parseInt(document.getElementById('mid-work-input').value) || 0;
      const mo = parseInt(document.getElementById('mid-off-input').value) || 0;
      const nw = parseInt(document.getElementById('night-work-input').value) || 0;
      const no = parseInt(document.getElementById('night-off-input').value) || 0;

      const cycleLength = ew + eo + mw + mo + nw + no;
      if (cycleLength === 0) return '休';

      const pos = (dayNum - 1 + offset) % cycleLength;

      const p1 = ew;
      const p2 = p1 + eo;
      const p3 = p2 + mw;
      const p4 = p3 + mo;
      const p5 = p4 + nw;

      if (pos < p1) return '早';
      if (pos < p2) return '休';
      if (pos < p3) return '中';
      if (pos < p4) return '休';
      if (pos < p5) return '晚';
      return '休';
    }

    function initDefaultScheduleData(yearMonth, persistLocal = true) {
      const [year, month] = yearMonth.split('-').map(Number);

      MAIN_ROLES.forEach(roleName => {
        const roleEmps = sortScheduleEmployeesForRole(employees.filter(e => e.role === roleName));
        roleEmps.forEach((emp, idx) => {
          if(!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          for(let d = 1; d <= totalDays; d++) {
            const dayStr = `${yearMonth}-${String(d).padStart(2, '0')}`;
            const dateObj = new Date(year, month - 1, d);
            if(!monthlyScheduleData[emp.id][dayStr]) {
              if (monthlyScheduleData[emp.id][dayStr] === '離') continue;
            if(approvedLeaveForEmployee(emp.id,dayStr)||p79LeaveCoverOnDay(emp.id,dayStr).length)continue;
            monthlyScheduleData[emp.id][dayStr] = calculateShiftForDay(emp, idx, d, dateObj.getDay());
            }
          }
        });
      });
      if (persistLocal) saveAllDataToLocalStorage();
    }

    function p79CompactOvertimeCode(value){

      if(!match)return '';

    function p79OvertimePeriodLabel(report){
 const code=String(report?.code||'').trim();
 const extended=report?.category==='延'||['before','after'].includes(report?.position);
 if(!extended){
   // Keep the saved special-day code; older named reports may still use 國 as their prefix.

 }
 const start=String(report.overtimeStart||'').trim(),end=String(report.overtimeEnd||'').trim();
 const part=value=>{const m=value.match(/^(\d{1,2})(?::(\d{2}))?$/);if(!m||Number(m[1])>24||Number(m[2]||0)>59||(Number(m[1])===24&&Number(m[2]||0)))return '';return m[1].padStart(2,'0')+(m[2]&&m[2]!=='00'?':'+m[2]:'');};
 if(part(start)&&part(end))return part(start)+'-'+(part(end)==='00'?'24':part(end));
 const bare=code.replace(/^[代延]/,'');
 return ({'08-20':'16-20','20-08':'20-24'})[bare]||bare;
}

    function p79SubstituteShiftLabel(empId,dayStr,meta){
      const saved=typeof monthlyScheduleMeta!=='undefined'?monthlyScheduleMeta[empId]?.[dayStr]:null;
      meta={...(saved||{}),...(meta&&typeof meta==='object'?meta:{})};
      const savedReport=meta.overtimeReport;
      const revokedReport=!!String(savedReport?.id??'').trim()&&
        (meta.overtimeRevocations||[]).some(x=>x?.confirmed===true&&
          String(x.reportId)===String(savedReport.id));
      const hasConfirmedReport=!!String(savedReport?.id??'').trim()&&
        meta.overtimeExcluded!==true&&!revokedReport;
      // An excluded/revoked overtime report must never reappear via a stale
      // overtime flag, old saved time range, or an old raw overtime code.
      const cover=p79LeaveCoverOnDay(empId,dayStr).find(x=>x.kind==='worker');
      if(!cover&&(revokedReport||meta.overtimeExcluded===true))return '';
      const reportCode=p79CompactOvertimeCode(savedReport?.code);
      if(reportCode&&hasConfirmedReport)return p79OvertimePeriodLabel({...savedReport,code:reportCode});
      const own=String(monthlyScheduleData?.[empId]?.[dayStr]||'').trim();
      const ownCode=p79CompactOvertimeCode(own);if(ownCode)return p79OvertimePeriodLabel({category:meta.overtimeReport?.category||(meta.overtimeType==='extended'||(!meta.restCategory&&/^(08-20|20-08)$/.test(ownCode))?'延':''),code:ownCode,overtimeStart:meta.overtimeReport?.overtimeStart||meta.overtimeStart,overtimeEnd:meta.overtimeReport?.overtimeEnd||meta.overtimeEnd});
      const validClock=value=>/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(String(value||''));
      const explicitTimedAssignment=!!(meta.overtime||meta.forEmpId||meta.type==='substitute')&&
        validClock(meta.overtimeStart)&&validClock(meta.overtimeEnd);
      // Legacy boolean flags, without any formal report or actual assigned time,
      // must not synthesize a fake 國08-16／休08-16 cell.
      if(!cover&&!hasConfirmedReport&&!explicitTimedAssignment)return '';
      const ranges={早:'08-16',中:'16-24',晚:'24-08'};
      const substitute=!!cover||!!meta.forEmpId||meta.type==='substitute'||meta.overtimeReport?.category==='代';
      const prefix=substitute?'代':['休','國','例'].includes(meta.overtimeReport?.category)?meta.overtimeReport.category:['休','國','例'].includes(meta.restCategory)?meta.restCategory:meta.overtimeType==='extended'?'延':'休';
      const start=meta.overtimeReport?.overtimeStart||meta.overtimeStart,end=meta.overtimeReport?.overtimeEnd||meta.overtimeEnd;
      if(start&&end){const compact=p79CompactOvertimeCode(prefix+start+'-'+(end==='00:00'?'24':end));if(compact)return meta.overtimeType==='extended'?p79OvertimePeriodLabel({category:'延',code:compact,overtimeStart:start,overtimeEnd:end}):compact;}
      const target=cover?.data?.leaveEmpId||meta.forEmpId;
      const original=String(monthlyScheduleData?.[target]?.[dayStr]||'').trim();
      const shift=[meta.reportOriginalShift,meta.overtimeOriginalShift,meta.overtimeAssignedShift,own,original].map(v=>String(v||'').trim()).find(v=>ranges[v])||'';
      if(!shift)return own==='代班'?'代班':'';
      if(cover?.data?.mode==='two'){
        const index=(cover.data.workerIds||[]).findIndex(id=>String(id).toUpperCase()===String(empId).toUpperCase());
        const halves={早:['08-12','12-16'],中:['16-20','20-24'],晚:['24-04','04-08']};return '代'+halves[shift][index===1?1:0];
      }
      return prefix+ranges[shift];
    }

    function p79BuildScheduleOvertimeMeta(old,kind,currentShift,shift,start,end,details) {
      if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end)||start===end)
        throw new Error('請填有效且不同的加班開始、結束時間');
      if(!['早','中','晚'].includes(shift))throw new Error('請選擇加班班別');
      const original=old.overtimeOriginalShift===undefined?currentShift:String(old.overtimeOriginalShift);
      const normal=['早','中','晚'].includes(original);
      if(kind==='rest'&&normal)throw new Error('當日已有正常班別，請選擇延時加班或代班加班');
      const overtimeType=kind==='substitute'?(normal?'extended':'rest'):kind;
      if(!['rest','extended'].includes(overtimeType))throw new Error('請選擇有效的加班類型');
      if(overtimeType==='extended'&&(!normal||shift!==original))throw new Error('延時加班必須保留當日正常班別');
      if(overtimeType==='rest'&&!['休',''].includes(original))throw new Error('請假當日不能安排加班');
      if(old.overtimeReport&&(old.overtimeStart!==start||old.overtimeEnd!==end||old.overtimeType!==overtimeType)&&!p79PendingOvertimeReport){old={...old};delete old.overtimeReport;}
      old={...old};delete old.overtimeExcluded;delete old.overtimeDeletedAt;
      return {...old,...details,type:kind==='substitute'?'substitute':'overtime',overtime:true,
        overtimeType,overtimeOriginalShift:original,overtimeAssignedShift:shift,
        overtimeStart:start,overtimeEnd:end};
    }

    // Cancel the linked overtime in the authoritative cloud store, not only local __meta.
    async function clearSubstituteAssignment() {
      if (!requireScheduleEditLock() || p79OvertimeShiftEditBusy) return;
      const empId=String(document.getElementById('substitute-worker-emp')?.value || document.getElementById('substitute-cover-emp-id')?.value || '').trim().toUpperCase();
      const dayStr=String(document.getElementById('substitute-date-key')?.value || '').trim();
      if(!empId||!/^\d{4}-\d{2}-\d{2}$/.test(dayStr)){alert('請先選擇要取消的員工與日期');return;}
      if(!confirm('確定取消此人當日加班／代班？將同步刪除雲端相關申報，保留原始打卡紀錄。'))return;
      p79OvertimeShiftEditBusy=true;
      try {
        if(!await flushSchedulePendingWrites())throw Error('尚有班表修改未儲存，無法安全刪除');
        await runScheduleCloudWrite(async()=>{
          const month=dayStr.slice(0,7),token=currentPort79SsoToken();
          const read=async()=>{
            const response=await scheduleLockFetch(GAS_URL+'?action=getScheduleDataSecure&month='+month+'&gcToken='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'},45000);
            const data=await response.json();
            if(!data.ok||!Array.isArray(data.schedules))throw Error(data.error||'無法核對雲端班表');
            return data;
          };
          const before=await read();
          if(!before.overtimeLinkedDelete||!before.revision)throw Error('雲端尚未支援加班連動刪除，未修改本機資料');
          const result=await cloudPost({action:'deleteOvertimeAssignment',empId,date:dayStr,expectedRevision:before.revision,scheduleClientId:getScheduleClientId()});
          if(result?.ok===false)throw Error(result.error||'雲端刪除失敗');
          const after=await read();
          const affected=new Set(result?.affectedEmployeeIds||[empId]);affected.add(empId);
          for(const id of affected){
            const row=after.schedules.find(r=>String(r.empId).trim().toUpperCase()===String(id).trim().toUpperCase());
            if(!row)throw Error('雲端刪除後找不到相關員工班表');
            const meta=row.schedule?.__meta?.[dayStr]||{};
            if(meta.overtimeReport||meta.overtime||meta.forEmpId||meta.restQuotaOvertime)throw Error('雲端仍存在加班／代班申報，刪除未通過核對');
          }
          for(const id of affected){
            const row=after.schedules.find(r=>String(r.empId).trim().toUpperCase()===String(id).trim().toUpperCase());
            if(!monthlyScheduleData[id])monthlyScheduleData[id]={};
            if(!monthlyScheduleMeta[id])monthlyScheduleMeta[id]={};
            if(row.schedule?.[dayStr]!==undefined)monthlyScheduleData[id][dayStr]=row.schedule[dayStr];
            else delete monthlyScheduleData[id][dayStr];
            const meta=row.schedule?.__meta?.[dayStr];
            if(meta)monthlyScheduleMeta[id][dayStr]={...meta};
            else delete monthlyScheduleMeta[id][dayStr];
          }
          leaveCoverAssignments=after.leaveCoverAssignments||[];
          return true;
        });
        closeSubstituteAssignment();
        renderRoleScheduleView();
        renderTodaySchedulePanel();
        alert('加班／代班已從雲端刪除，並完成讀回核對；原始打卡保留。');
      } catch(error){
        alert('無法確認雲端已刪除：'+(error?.message||error)+'。請重新讀取班表核對，系統不會假裝刪除成功。');
        renderRoleScheduleView();
      } finally {p79OvertimeShiftEditBusy=false;}
    }

    function getSubstituteRecommendation(unitRole, targetEmpId, dayStr) {
      const sameRoleEmps = employees.filter(e => e.role === unitRole && e.id !== targetEmpId);
      let candidates = [];
      sameRoleEmps.forEach(cand => {
        const candShift = monthlyScheduleData[cand.id] && monthlyScheduleData[cand.id][dayStr];
        if (candShift === '休' || candShift === '特') {
          candidates.push(`${cand.name}(${cand.id}) - 當日休假`);
        }
      });
      if (candidates.length > 0) return `💡 建議代班: ${candidates.join(', ')}`;

        fixed.style.width=personWidth+'px';

          item.clone.style.height=Math.ceil(rect.height)+'px';

      try{session=JSON.parse(sessionStorage.getItem('admin_session')||'null');}catch(_){}

      if(!token)return;
      p79TyphoonLeaveCancelBusy=true;

        const url=GAS_URL+'?action=getLeaveData&token='+encodeURIComponent(token)+'&t='+Date.now();
        const response=await scheduleLockFetch(url,{cache:'no-store',redirect:'follow'},22000);
        const data=await readScheduleSsoJson(response);
        if(!data?.ok||!Array.isArray(data.employees)||!Array.isArray(data.leaveRecords)||!Array.isArray(data.leaveCoverAssignments))
          throw new Error(data?.error||'雲端未傳回完整請假與代班資料');
        return data;
      };
      const remove=async(id,note)=>{
        // Do not retry a destructive request if the response is uncertain.
        const response=await scheduleLockFetch(GAS_URL,{
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=UTF-8','Accept':'application/json'},
          body:JSON.stringify({action:'deleteLeaveRecord',id,token,gcToken:token,cancelReason:note}),
          redirect:'follow',cache:'no-store'
        },25000);
        const result=await readScheduleSsoJson(response);
        if(!result?.ok)throw new Error(result?.error||'請假連動刪除失敗');
        return result;
      };
      try{
        showScheduleNotice('正在核對颱風停班日的請假與代班資料…','info',5500);
        const result=await window.P79TyphoonLeaveSync.run({
          dates,read,remove,confirm:message=>window.confirm(message)

        const messages=[];
        if(result.deleted.length){
          messages.push(result.note+'：已自動取消 '+result.deleted.length+' 筆請假及關聯代班。');

          if(!updated)messages.push('排班畫面尚未重新核對，請按「重新讀取雲端」。');

        if(result.balanceReview.length)messages.push('另有 '+result.balanceReview.length+' 筆年假已列入匯入餘額基準或人員無法核對，已保留，請先核對年假回補方式再處理。');
        if(result.skipped.length)messages.push(result.skipped.length+' 筆請假資料在確認期間變更，本次未刪除。');
        if(result.errors.length)messages.push('連動刪除未完成／待核對：'+result.errors.join('；'));

          showScheduleNotice(message,result.errors.length?'error':'success',11000);
          if(result.review.length||result.balanceReview.length||result.skipped.length||result.errors.length)alert(message);
        }else if(result.confirmed){
          showScheduleNotice('沒有需要刪除的請假紀錄。','info');

      // 正式 syncSchedules 會在 GAS ScriptLock 裡原子核對 gcToken 與 scheduleClientId。
      // 不再多打一筆容易被其他系統長任務擋住的 heartbeat/GET。
      // 伺服器如確認不是鎖持有人，會拒絕整月寫入，保留編輯中的畫面。
      const tabName = (activeRoleTab === 'ALL') ? '全部人員' : activeRoleTab + '單位';
      lastScheduleCloudError = '';

      // V10.15：手動按儲存時取消延遲 autosave，改由同一條序列寫入送「目前畫面最新版本」。
      if (scheduleSaveTimer) {
        clearTimeout(scheduleSaveTimer);
        scheduleSaveTimer = null;
      }
      flushScheduleLocalPersist();

      const saveVersion = p79ScheduleLocalMutationVersion;
      // If autosave is already writing this same or a newer snapshot, wait once.
      // Only skip the manual POST if cloud success and no local edits remain pending.
      if (port79ScheduleWriteInFlight) {
        const previousOk=await port79ScheduleWriteInFlight.catch(()=>false);
        if (previousOk && !port79ScheduleDirty &&
            p79ScheduleLocalMutationVersion === saveVersion &&
            !personnelSaveTimer) {
          alert('✅ 儲存完畢：背景自動儲存已完成，沒有需要重複寫入的班表修改。');
          return;
        }
      }
      const ok = await runScheduleCloudWrite(() => saveScheduleMonthToCloud(false));

      if (ok) {
        // The monthly write already confirmed its captured mutation version.

        // 儲存期間若又有新的編輯，不可誤把它標成已完成；交給下一次 autosave。
        if (p79ScheduleLocalMutationVersion !== saveVersion) {
          port79ScheduleDirty = true;
          queueScheduleCloudSave();
        }

        // Do not claim the *latest* edits have been saved if another mutation
        // was made after the payload snapshot was captured.
        try { renderTodaySchedulePanel(); } catch (e) {}
        if (port79ScheduleDirty) {
          alert('⚠️ 前一筆班表已寫入，但仍有較新的修改等待同步；請保持本頁開啟。');
        } else {
          alert(`✅ 儲存完畢\n\n【${tabName}】目前月份班表已成功儲存至 Google 雲端。`);
        }
      } else {
        port79ScheduleDirty = true;
        alert('❌ 排班雲端儲存失敗：\n' + (lastScheduleCloudError || '雲端沒有回傳詳細錯誤，請確認 Apps Script 已部署最新版。'));
      }
      } finally {
        p79ManualScheduleSaveBusy=false;
        p79SetScheduleSaving(false);
        applyScheduleAccessUi();
      }
    }

    let p79OvertimeShiftEditBusy=false;
    async function updateDailyShift(empId,dayStr,val){
      if(val==='__overtime__')return;
      if(approvedLeaveForEmployee(empId,dayStr)||p79LeaveCoverOnDay(empId,dayStr).length){alert('此日期仍連結請假或代班，請先到請假管理完成連動刪除，再修改排班。');renderRoleScheduleView();return;}
      if(p79OvertimeShiftEditBusy){renderRoleScheduleView();return;}
      if(!requireScheduleEditLock())return;
      const meta=monthlyScheduleMeta[empId]?.[dayStr]||{};
      const cover=p79LeaveCoverOnDay(empId,dayStr).find(c=>c.kind==='worker');
      if(!meta.overtimeReport&&!meta.overtime&&!meta.forEmpId&&meta.type!=='substitute'&&!cover){p79SetDailyShift(empId,dayStr,val);return;}
      const person=employees.find(e=>String(e.id)===String(empId));
      if(!confirm('將 '+(person?.name||empId)+' '+dayStr+' 改為「'+val+'」？此操作會取消當日加班及對應代班；同一安排若有兩位代班人員，兩位當日安排都會取消。請假與打卡紀錄保留。')){renderRoleScheduleView();return;}
      p79OvertimeShiftEditBusy=true;
      let cancelled=false;
      try{
        if(!await flushSchedulePendingWrites())throw Error('尚有班表修改未儲存，請先完成儲存');
        const ok=await runScheduleCloudWrite(async()=>{
          const month=dayStr.slice(0,7),token=currentPort79SsoToken();
          const read=async()=>{
            const response=await scheduleLockFetch(GAS_URL+'?action=getScheduleDataSecure&month='+month+'&gcToken='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'},45000);
            const data=await response.json();if(!data.ok||!Array.isArray(data.schedules))throw Error(data.error||'無法確認正式班表');return data;
          };
          const before=await read();
          if(!before.overtimeLinkedDelete||!before.revision)throw Error('雲端尚未提供取消加班功能');
          const deleted=await cloudPost({action:'deleteOvertimeAssignment',empId,date:dayStr,expectedRevision:before.revision,scheduleClientId:getScheduleClientId()});
          cancelled=true;
          const after=await read(),affected=new Set(deleted.affectedEmployeeIds||[empId]);
          for(const id of affected){
            const row=after.schedules.find(r=>String(r.empId)===String(id));
            if(!row||row.schedule?.__meta?.[dayStr]?.overtimeReport)throw Error('取消後的班表讀回未通過，請重新整理核對');
            if(!monthlyScheduleData[id])monthlyScheduleData[id]={};
            if(!monthlyScheduleMeta[id])monthlyScheduleMeta[id]={};
            if(row.schedule[dayStr]!==undefined)monthlyScheduleData[id][dayStr]=row.schedule[dayStr];
            monthlyScheduleMeta[id][dayStr]={...(row.schedule.__meta?.[dayStr]||{})};
          }
          leaveCoverAssignments=after.leaveCoverAssignments||[];
          p79SetDailyShift(empId,dayStr,val);
          clearTimeout(scheduleSaveTimer);scheduleSaveTimer=null;
          const saved=await saveScheduleMonthToCloud(false);
          if(!saved)throw Error('新班別尚未確認儲存，請保留畫面並按儲存班表');
          return true;
        });
        if(!ok)throw Error(cancelled?'當日加班已取消，新班別尚未確認儲存，請核對儲存狀態':'未確認變更，請核對權限與雲端連線');
      }catch(error){alert((cancelled?'加班已取消；':'尚未確認取消加班：')+(error.message||error));}
      finally{p79OvertimeShiftEditBusy=false;renderRoleScheduleView();try{renderTodaySchedulePanel();}catch(ignore){}}
    }
    function p79SetDailyShift(empId, dayStr, val) {
      if (!requireScheduleEditLock()) return;
      if(!monthlyScheduleData[empId]) monthlyScheduleData[empId] = {};
      const previousShift=String(monthlyScheduleData[empId][dayStr]||'');
      if(!monthlyScheduleMeta[empId])monthlyScheduleMeta[empId]={};
      const meta={...(monthlyScheduleMeta[empId][dayStr]||{})};
      for(const key of ['restCategory','restSourceDate','restHolidayName','restQuotaOvertime','restAllocationSource'])delete meta[key];
      if(['例','國'].includes(val)) {meta.restCategory=val;meta.restAllocationSource='manual';}
      meta.manualRosterShift=String(val);
      monthlyScheduleMeta[empId][dayStr]=meta;
      monthlyScheduleData[empId][dayStr] = ['例','國'].includes(val)?'休':val;
      if(['年','特','年假','特休'].includes(val) && !['年','特','年假','特休'].includes(previousShift)) {
        setTimeout(()=>openSubstituteAssignment(empId,dayStr,true),0);
      }

      // 立即保留資料，但不要每改一格就重建「所有人 × 31天」整張表。
      queueScheduleCloudSave();
      queueScheduleEditRender(320);
      // 重新按新班別配對已讀取的打卡；不可沿用舊班別的無卡判定。
      p79ScheduleRestClient().refresh(dayStr.slice(0,7));

      // 只有真的修改今天班別時才更新今日排班；其他日期不用多做一次全員統計。
      if (dayStr === scheduleTaipeiTodayKey() || dayStr === scheduleNightRosterDate()) {
        try { renderTodaySchedulePanel(); } catch (e) {}
      }
    }

    let p79ScheduleRestEvidenceClient=null;
    function p79ScheduleRestLeaveDates(month,employeeId='') {
      const dates=[];for(const emp of employees.filter(e=>!employeeId||e.id===employeeId))for(let d=1;d<=p79RestQuota(month).days;d++){const date=month+'-'+String(d).padStart(2,'0');if(approvedLeaveForEmployee(emp.id,date))dates.push(String(emp.id).toUpperCase()+'|'+date);}return dates;
    }
    function p79ScheduleRestClient() {
      if(!p79ScheduleRestEvidenceClient)p79ScheduleRestEvidenceClient=window.P79ScheduleRestEvidence.create({
        token:currentPort79SsoToken,employees:()=>employees,schedules:()=>employees.map(e=>({empId:e.id,schedule:{...(monthlyScheduleData[e.id]||{}),__meta:monthlyScheduleMeta[e.id]||{}}})),
        buildShifts:rows=>P79AttendanceV6.buildShifts(rows),timestamp:p79DirectAttendanceTimestamp,leaveDates:p79ScheduleRestLeaveDates,
        shiftForSession:row=>window.P79SchedulePunchRestore?.displayShiftFromClockIn(row.clockIn,row.clockOut)||null,
        read:async(month,token)=>{const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);try{const url=new URL(GAS_URL);for(const [k,v]of Object.entries({action:'getAttendanceMonthRaw',month,token,gcToken:token,_:Date.now()}))url.searchParams.set(k,v);const response=await fetch(url,{cache:'no-store',signal:ctl.signal});if(!response.ok)throw Error('出勤讀取失敗');return await response.json();}finally{clearTimeout(timer);}},
        update:(month,state)=>{if(currentScheduleMonthKey()!==month)return;const status=document.getElementById('scheduleRestEvidenceStatus');if(status)status.textContent=state.pending?(state.evidence?.complete?'重新核對中（暫顯示上次成功結果）…':'出勤核對中…'):state.error?'出勤未完成核對：'+state.error:'';if(!state.pending){
          // A failed official read is unverified. Do not repaint a previously
          // checked roster with unverified fallback counts; display the error
          // without authorizing any write or treating stale evidence as fresh.
          if(!state.error)renderRoleScheduleView();
          // A completed official attendance refresh must also reconcile the
          // saved roster, not merely repaint a temporary attendance label.
          // The reconciliation itself rechecks edit lock, pending writes, month,
          // identity and complete punches before making any cloud change.
          if(!state.error&&state.evidence?.complete===true&&
             scheduleEditLockState.mine&&!port79ScheduleDirty){
            void p79QueueScheduleNoPunchReconcile(month);
          }
        }}
      });return p79ScheduleRestEvidenceClient;
    }
    function p79RefreshScheduleRestEvidence() {
      const month=currentScheduleMonthKey();
      if(!currentPort79SsoToken()||!/^\d{4}-\d{2}$/.test(month)||!employees.length)return;
      // 出勤核對獨立於班表同步；編輯鎖或尚未儲存的班表不應阻止晚班結束後核對。
      return p79ScheduleRestClient().refreshIfStale(month);
    }
    function p79ScheduleRestBalance(emp,month,allocated=null) {
      const leaveDates=p79ScheduleRestLeaveDates(month,emp.id);
      return window.P79ScheduleRestSummary.summary(emp,monthlyScheduleData[emp.id]||{},allocated||p79AutomaticRestMetadata(emp.id,month),month,{leaveDates,leaveCoverAssignments,attendanceEvidence:p79ScheduleRestClient().status(month).evidence},p79EmploymentStartDate(emp));
    }
    function p79ScheduleConfirmedOvertime(empId,date,shift) {
      const meta=monthlyScheduleMeta[empId]?.[date]||{},report=meta.overtimeReport;
      const revoked=!!String(report?.id??'').trim()&&
        (meta.overtimeRevocations||[]).some(x=>x?.confirmed===true&&
          String(x.reportId)===String(report.id));
      if(meta.overtimeExcluded===true||revoked)return '';
      const code=p79CompactOvertimeCode(report?.code);
      if(code&&p79ConfirmedOvertimeReport(monthlyScheduleMeta[empId]?.[date]))return p79OvertimePeriodLabel({...report,code});
      const own=p79CompactOvertimeCode(shift);
      return own?(p79SubstituteShiftLabel(empId,date)||own):'';
    }
    // 與排班畫面、試算表 匯出共用判定：只有考勤已完整核對且整班無卡，
    // 才以颱風／選舉日覆蓋原班別；單邊打卡、已出勤、請假、未核對與未來日期不覆蓋。
    function p79ScheduleSpecialNoPunchCode(empId,date,shift,leave,knownState=null,knownEvidence=null,specialDates=null,today=null) {

      if(date>todayKey)return '';

      if(evidence?.complete!==true)return '';
      const state=knownState!==null?knownState:window.P79RestAttendance.state({attendanceEvidence:evidence},empId,date);
      if(state!=='rest'&&state!=='open')return '';

      if(typhoon.has(date))return '颱';
      const election=specialDates?.election||new Set(window.P79SpecialOvertime?.electionDates?.()||[]);
      return election.has(date)||/選舉|投票/.test(String(window.P79OfficialCalendar?.get?.(date)?.name||''))?'選':'';

    function p79ScheduleNoPunchRest(empId,date,shift,meta,leave,knownState=null) {
      if(p79ScheduleConfirmedOvertime(empId,date,shift))return false;

      if(knownState!==null)return knownState==='rest';

    // On-demand full staff check uses the same precedence as the month grid.
    function p79VisibleRestDayAudit(emp,month,allocation=null) {
      const dates={例:[],休:[],國:[]};
      const context=p79ScheduleDisplayContext(emp,month,allocation);
      for(let n=1;n<=p79RestQuota(month).days;n++){
        const day=month+'-'+String(n).padStart(2,'0');

    // 所有人員共用單一逐日分類器；不使用自動補配額度作為已休天數。
    function p79DailyRestCount(emp,month,knownAllocation=null) {
      // Reuse the actual 31/30/28-day selected codes shown in the roster/export.
      // Hidden metadata or a verified working shift may not erase a visible
      // 國16-24, 休08-16 or 例08-16 label from the day-category total.
      const shown=p79VisibleRestDayAudit(emp,month,knownAllocation);
      const dates=Object.fromEntries(['例','休','國'].map(kind=>
        [kind,[...new Set(shown[kind])].map(date=>date.slice(-2))]));
      return {counts:Object.fromEntries(['例','休','國'].map(kind=>
        [kind,dates[kind].length])),dates};
    }
    // Same visible shift precedence as the day grid: verified typhoon no-punch,
    // approved typhoon leave, or an explicitly assigned 颱 shift. A holiday
    // marker alone does not count as a completed typhoon absence.
    // Typhoon is an event-day statistic, not a statutory holiday quota.
    // A reported or roster-assigned overtime shift still counts even when its
    // main grid cell displays 早／中／晚 or an overtime time-code.
    function p79ScheduleTyphoonHasWork(empId,date,meta,attendanceState,evidence=null) {
      const key=String(empId||'').trim().toUpperCase()+'|'+date;
      const hasPairedCalendarData=evidence?.complete===true&&!!evidence.workCalendarDays;
      if(hasPairedCalendarData?evidence.workCalendarDays[key]===true:attendanceState==='worked')return true;
      if(meta?.overtimeExcluded)return false;
      const reports=[meta?.overtimeReport,...(Array.isArray(meta?.overtimeReports)?meta.overtimeReports:[])]
        .filter(report=>String(report?.id||'').trim());
      const revoked=meta?.overtimeRevocations||[];
      if(reports.some(report=>!revoked.some(item=>
        item?.confirmed===true&&String(item.reportId)===String(report.id)
      )))return true;
      // Do not let an old assignment flag resurrect a fully revoked report.
      if(reports.length)return false;
      return !!(meta?.overtime||meta?.forEmpId||meta?.restQuotaOvertime||meta?.type==='substitute');
    }
    function p79ScheduleTyphoonDays(emp,month,workedDates=null) {
      const result=[],quota=p79RestQuota(month);
      const evidence=p79ScheduleRestClient().status(month).evidence;
      const snapshot={attendanceEvidence:evidence};
      const markers={typhoon:new Set(p79TyphoonDates().filter(d=>d.startsWith(month+'-'))),election:new Set()};
      const today=scheduleTaipeiTodayKey();
      const shifts=monthlyScheduleData[emp.id]||{},metadata=monthlyScheduleMeta[emp.id]||{},first=p79EmploymentStartDate(emp)||'';
      for(let n=1;n<=quota.days;n++){
        const date=month+'-'+String(n).padStart(2,'0');
        if(first&&date<first)continue;
        if(typeof p79EmployeeDateEligible==='function'&&!p79EmployeeDateEligible(emp,date))continue;
        const shift=String(shifts[date]||'休').trim();
        if(['離','離職'].includes(shift))break;
        const approved=approvedLeaveForEmployee(emp.id,date);
        const leaveCode=approved?p79ScheduleLeaveExportCode(scheduleLeaveTypeText(approved)):'';
        const state=window.P79RestAttendance.state(snapshot,emp.id,date);
        const special=p79ScheduleSpecialNoPunchCode(emp.id,date,shift,approved,state,evidence,markers,today);
        const marked=(markers.typhoon.has(date)&&date<=today)||shift==='颱'||leaveCode==='颱';
        const worked=p79ScheduleTyphoonHasWork(emp.id,date,metadata[date],state,evidence);
        if(!marked||state==='missing'&&!worked||approved&&leaveCode!=='颱'&&!worked)continue;

        else result.push(date);

    function p79ScheduleRestCountCells(emp,month,knownAllocation=null,knownTyphoonDays=null,knownTyphoonWorkDays=null,visibleRestDates=null) {
      const quota=p79RestQuota(month).counts;
      const audit=visibleRestDates?null:p79DailyRestCount(emp,month,knownAllocation);
      // The visible day count and the unreported balance are different values.
      // Confirmed overtime already consumes quota; do not show it as missing again.
      let ledger=null;
      if(typeof p79ScheduleRestBalance==='function'){
        try{ledger=p79ScheduleRestBalance(emp,month,knownAllocation);}catch(_){}
      }
      // Use one identical set of typhoon dates for the new counter AND for
      // excluding duplicate 國 classifications. Do not mutate the cloud roster,
      // statutory quota or any approved overtime report.
      const computedWork=[];
      const offDates=[...new Set(knownTyphoonDays||(typeof p79ScheduleTyphoonDays==='function'?p79ScheduleTyphoonDays(emp,month,computedWork):[]))];
      const workedDates=[...new Set(knownTyphoonWorkDays||computedWork)];
      const typhoonSet=new Set([...offDates,...workedDates]);
      const dates=kind=>[...new Set(visibleRestDates?(visibleRestDates[kind]||[]):audit.dates[kind].map(d=>month+'-'+d))];

      const total=typhoonSet.size;
      const quotaCells=['例','休','國'].map(category=>{
        // A day reported under 颱 must not also count under 例/休/國.
        const categoryDates=dates(category).filter(day=>!typhoonSet.has(day));
        const count=categoryDates.length;
        const displayDates=categoryDates.map(day=>day.slice(-2));
        const limit=Number.isFinite(ledger?.quota?.[category])?ledger.quota[category]:quota[category];
        const verified=Number.isFinite(ledger?.remaining?.[category]);

        // Official reports on OTHER dates consume quota once without double counting.
        const reportedOutside=new Set((ledger?.ledger||[]).filter(item=>
          item?.category===category&&['reported','reportedPendingAttendance'].includes(item.kind)&&
          item.date&&!typhoonSet.has(item.date)&&!categoryDates.includes(item.date)
        ).map(item=>item.date));
        const rest=Math.max(0,limit-count-reportedOutside.size),extra=Math.max(0,count-limit);
        const officialRemaining=verified?Math.max(0,ledger.remaining[category]):null;
        const color=category==='例'?'p79-rest-example bg-purple-50 text-purple-800':category==='休'?'p79-rest-break bg-blue-50 text-blue-800':'p79-rest-national bg-green-50 text-green-800';
        const title=category+'：逐日計入 '+count+' 天（'+(displayDates.join('、')||'無')+'）；額度 '+limit+' 天；尚未分配 '+rest+' 天'+
          (verified?'；正式已報 '+(ledger.reported?.[category]||0)+' 天；出勤待核 '+(ledger.reserved?.[category]||0)+' 天；帳本未報 '+officialRemaining+' 天':'；雲端申報額度待核')+
          (officialRemaining!==null&&officialRemaining!==rest?'；⚠ 班格與正式帳本差異須核對，未更動正式資料':'')+(extra?'；超額 '+extra+' 天':'')+
          (category==='國'&&nationalDuplicates?'；另有 '+nationalDuplicates+' 天颱風日已移至「颱」統計，不重複計入':'');

      }).join('');

      const typhoonCell='<td data-rest-category="颱" class="p79-rest-count-compact p79-rest-typhoon text-center font-bold border-r text-xs" title="'+
        scheduleEscapeHtml('颱風日：'+total+' 天（'+days+'）；有出勤、加班或颱風停班同一天都只算 1 筆；不重複計入國定假日')+
        '"><span>'+total+' 天</span></td>';

    function p79RefreshScheduleRestCounts(month) {

    // Never allocate an 例/休/國 slot to a day whose visible roster is replaced

        ?p79ScheduleRestClient().status(month).evidence?.actualShifts:null;

      const dates=[];
      for(let n=1;n<=quota.days;n++){
        const date=month+'-'+String(n).padStart(2,'0');
        if(approvedLeaveForEmployee(emp.id,date)||
           p79LeaveCoverOnDay(emp.id,date).length||
           !!punchShifts?.[String(emp.id).trim().toUpperCase()+'|'+date]||
           (['休','例','國'].includes(String(monthlyScheduleData[emp.id]?.[date]||'').trim())&&
            p79ScheduleHasVerifiedPunch(emp.id,date))||
           // 颱風假完全獨立；即使原排休也不可拿去補例／休／國。
