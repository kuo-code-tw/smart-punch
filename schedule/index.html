  <script>
    // BUILD PATCH: 2026.09.24-SCHEDULE-FULL-AUTO-SYNC-V1
    // ============================================================
    // ★ 只要改這一行：貼上你部署後的 Google Apps Script /exec 網址
    // 例如：https://script.google.com/macros/s/xxxxxxxxxxxxxxxx/exec
    // ============================================================
    const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzPD0v8QQol_7cMuMUFGnjHxo-9jFnRLEwoWQhW-n3g5GlbbHnaL7EhRAtcymUcdYOEzg/exec';

    function getScheduleGasUrl(){
      try{
        const hash=String(location.hash||'').replace(/^#/,'');
        const params=new URLSearchParams(hash);
        const fromHash=String(params.get('gasurl')||'').trim();
        if(fromHash === DEFAULT_GAS_URL){
          sessionStorage.setItem('port79_gas_url',DEFAULT_GAS_URL);
          return DEFAULT_GAS_URL;
        }
      }catch(e){}
      // 正式專案只使用目前驗證通過的 GAS；舊帳號網址不再覆蓋排班編輯鎖。
      try{sessionStorage.setItem('port79_gas_url',DEFAULT_GAS_URL)}catch(e){}
      return DEFAULT_GAS_URL;
    }

    const GAS_URL = getScheduleGasUrl();

    let scheduleAccessLevel = 'none';
    let lastScheduleCloudError = '';

    function normalizeSchedulePermissionLevel(value, fallback='none') {
      const text = String(value ?? '').toLowerCase();
      return ['none','view','manage'].includes(text) ? text : fallback;
    }

    function getSchedulePermissionFromData(data) {
      const role = String(data?.adminRole || '').toLowerCase();
      if (role === 'superadmin') return 'manage';
      return normalizeSchedulePermissionLevel(data?.systemPermissions?.schedule, 'none');
    }

    function canManageSchedule() {
      return scheduleAccessLevel === 'manage';
    }

    const SCHEDULE_LOCK_HEARTBEAT_MS = 20000; // 自己持有鎖：30秒續租
    const SCHEDULE_LOCK_WATCH_OTHER_MS = 2000; // 別人編輯中：1秒確認是否已離開
    const SCHEDULE_LOCK_FREE_POLL_MS = 2000; // 無人鎖定：4秒低頻確認
    const SCHEDULE_LOCK_HIDDEN_POLL_MS = 30000;
    const SCHEDULE_LOCK_FETCH_TIMEOUT_MS = 5000;
    const SCHEDULE_LOCK_ACQUIRE_TIMEOUT_MS = 8000;
    const SCHEDULE_LOCK_BACKGROUND_TIMEOUT_MS = 5000;
    const SCHEDULE_LOCK_INITIAL_RETRIES = 0;
    let scheduleEditLockTimer = null;
    let scheduleLockLastError = '';
    let scheduleLockFailureCount = 0;
    let scheduleLockFirstFailureAt = 0;
    let scheduleLockLastSuccessAt = 0;
    let scheduleEditLockRefreshBusy = false;
    let scheduleLockRequestEpoch = 0; // 忽略手動鎖定後才抵達的舊背景回應
    let scheduleManualLockBusy = false;
    let scheduleEditLockState = { locked:false, mine:false, ownerName:'', ownerEmpId:'', expiresAt:0, startedAt:0, lastCheckedAt:0 };

    // 內建診斷：不開新分頁、不使用 iframe，也不傳送或記錄登入 Token。
    // 直接使用排班頁目前 GAS_URL / SSO Token / clientId 進行純 GET 唯讀查詢。
    let p79ScheduleDiagBusy=false;
    let p79ScheduleDiagResults=[];
    let p79ScheduleDiagVersion='';
    let p79ScheduleDiagV4=null;
    const P79_DIAG_TESTS=[
      {id:'ping',label:'① GAS 基本連線',action:'ping',timeout:12000},
      {id:'activity',label:'② GAS 執行工作',action:'getCloudActivity',timeout:12000},
      {id:'lock',label:'③ 排班編輯鎖',action:'scheduleGetEditLock',timeout:12000,requiresAuth:true},
      {id:'meta',label:'④ 排班版本',action:'getScheduleSyncMeta',timeout:12000,requiresAuth:true},
      {id:'full',label:'⑤ 完整班表讀取（選用）',action:'getScheduleDataSecure',timeout:25000,requiresAuth:true}
    ];
    function p79DiagSession(){
      let token='';
      try{token=currentPort79SsoToken()}catch(e){}
      let clientId='';
      try{clientId=getScheduleClientId()}catch(e){}
      return {token,clientId,canManage:canManageSchedule(),localLock:!!scheduleEditLockState.mine};
    }
    function p79DiagStatus(testId,msg,kind=''){
      const el=document.getElementById('p79DiagStatus-'+testId);
      if(el){el.textContent=msg;el.dataset.kind=kind}
    }
    function p79DiagClassify(error,status){
      const message=String(error||'').slice(0,300);
      if(status===401||status===403||/Token|權限|登入|驗證|無效|過期|授權|session|permission/i.test(message))return '登入憑證過期或權限驗證失敗';
      if(/月歸檔|救回|ID 無法核對|資料安全|資料核對/i.test(message))return '考勤歸檔安全檢查阻擋';
      if(/雲端目前正在處理|忙碌|正在處理|編輯鎖|lock|重試/i.test(message))return '雲端忙碌或鎖定衝突';
      if(/JSON|HTML|Google 網頁/i.test(message))return 'GAS 回應格式異常';
      return 'GAS 回傳失敗';
    }
    function p79DiagReport(){
      const version=p79ScheduleDiagVersion||'尚未取得';
      const isolation=p79ScheduleDiagV4===true?'已確認 V4':p79ScheduleDiagV4===false?'線上版本未標記 V4':'尚未確認';
      const lines=['排班診斷報告（僅 GET，不儲存資料）',
        '時間：'+new Date().toLocaleString('zh-TW'),
        'GAS 版本：'+version,'排班／考勤歸檔分離：'+isolation];
      for(const r of p79ScheduleDiagResults)lines.push(r.label+'｜'+r.status+'｜'+r.ms+' ms｜'+r.detail);
      lines.push('本報告不包含登入 Token、工號或完整班表；唯讀檢查不能證明寫入成功。');
      const el=document.getElementById('p79DiagReport');
      if(el)el.textContent=lines.join('\n');
    }
    function p79DiagUpdateSession(){
      const s=p79DiagSession();
      const el=document.getElementById('p79DiagSessionInfo');
      if(el){
        el.textContent=s.token
          ? '本排班頁已有 SSO 登入憑證；本頁編輯分頁 ID：'+(s.clientId?'已建立':'不存在')+
            '；目前本機編輯鎖：'+(s.localLock?'由本頁持有':'尚未確認持有')
          : '本排班頁本身找不到 SSO 登入憑證（不是診斷頁讀取錯誤）。請先備份未儲存的班表，再檢查登入狀態。';
        el.dataset.kind=s.token?'ok':'bad';
      }
      return s;
    }
    async function p79DiagProbe(test){
      const auth=p79DiagSession();
      if(test.requiresAuth&&!auth.token){
        p79DiagStatus(test.id,'缺少本頁 SSO Token，略過','bad');
        p79ScheduleDiagResults.push({label:test.label,status:'略過',ms:0,detail:'排班頁本身沒有登入憑證'});
        p79DiagReport();return;
      }
      if(test.id==='lock'&&!auth.clientId){
        p79DiagStatus(test.id,'缺少編輯分頁 ID','bad');
        p79ScheduleDiagResults.push({label:test.label,status:'略過',ms:0,detail:'排班編輯分頁 ID 不存在'});
        p79DiagReport();return;
      }
      p79DiagStatus(test.id,'測試中…');
      const started=performance.now();
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),test.timeout);
      try{
        const url=new URL(GAS_URL);
        url.searchParams.set('action',test.action);
        url.searchParams.set('_',String(Date.now()));
        if(test.requiresAuth)url.searchParams.set('gcToken',auth.token);
        if(test.id==='lock')url.searchParams.set('scheduleClientId',auth.clientId);
        if(test.id==='meta'||test.id==='full'){
          const month=document.getElementById('month-picker')?.value||'';
          if(month)url.searchParams.set('month',month);
        }
        const res=await fetch(url.toString(),{method:'GET',cache:'no-store',redirect:'follow',signal:controller.signal});
        const raw=await res.text();
        let data;
        try{data=JSON.parse(raw)}catch(e){throw new Error('INVALID_JSON')}
        if(!res.ok||data?.ok!==true)throw new Error('SERVER:'+p79DiagClassify(data?.error||data?.message,res.status));
        const ms=Math.round(performance.now()-started);
        let detail='回應成功';
        if(test.id==='ping'){
          p79ScheduleDiagVersion=String(data.version||'').slice(0,60);
          p79ScheduleDiagV4=data.scheduleSaveRolloverIsolation===true;
          detail=p79ScheduleDiagV4?'GAS 排班／考勤已分離':'線上版本未回報排班／考勤分離標記';
          detail+='；寫入回條查詢 '+(Number(data.scheduleSaveReceiptVersion||0)>=1?'已部署':'尚未部署');
        }
        if(test.id==='activity'){
          detail='GAS 回報工作狀態成功（不代表其他資料鎖未被占用）';
        }
        if(test.id==='lock'){
          detail=data.mine?'雲端確認目前分頁持有編輯鎖':data.locked?'編輯鎖由其他分頁持有':'目前無人持有編輯鎖';
        }
        if(test.id==='meta'){
          if(data.apiVersion)p79ScheduleDiagVersion=String(data.apiVersion).slice(0,60);
          detail='排班版本讀取成功';
        }
        if(test.id==='full')detail='完整班表回應成功，內容未顯示';
        const status=ms>8000?'回應偏慢':'成功';
        p79DiagStatus(test.id,status+' · '+ms+' ms',ms>8000?'slow':'ok');
        p79ScheduleDiagResults.push({label:test.label,status,ms,detail});
      }catch(e){
        const ms=Math.round(performance.now()-started);
        const detail=e?.name==='AbortError'?'逾時超過 '+test.timeout/1000+' 秒':
          e?.message==='INVALID_JSON'?'不是有效 JSON':
          String(e?.message||'').startsWith('SERVER:')?String(e.message).slice(7):
          '瀏覽器連線或 CORS 失敗';
        p79DiagStatus(test.id,'失敗 · '+ms+' ms','bad');
        p79ScheduleDiagResults.push({label:test.label,status:'失敗',ms,detail});
      }finally{clearTimeout(timer);p79DiagReport();}
    }
    async function p79RunScheduleDiag(full=false){
      if(p79ScheduleDiagBusy)return;
      p79ScheduleDiagBusy=true;
      for(const id of ['p79DiagQuickBtn','p79DiagFullBtn']){
        const b=document.getElementById(id);
        if(b)b.disabled=true;
      }
      p79DiagUpdateSession();
      if(!full){
        p79ScheduleDiagResults=[];p79ScheduleDiagVersion='';p79ScheduleDiagV4=null;
        for(const t of P79_DIAG_TESTS)p79DiagStatus(t.id,t.id==='full'?'未測試':'等待測試');
      }
      p79DiagReport();
      try{
        const tests=full?P79_DIAG_TESTS.filter(t=>t.id==='full'):P79_DIAG_TESTS.filter(t=>t.id!=='full');
        for(const t of tests)await p79DiagProbe(t);
      }finally{
        p79ScheduleDiagBusy=false;
        for(const id of ['p79DiagQuickBtn','p79DiagFullBtn']){
          const b=document.getElementById(id);
          if(b)b.disabled=false;
        }
      }
    }
    async function p79CopyScheduleDiag(){
      const txt=document.getElementById('p79DiagReport')?.textContent||'';
      const button=document.getElementById('p79DiagCopyBtn');
      try{
        await navigator.clipboard.writeText(txt);
        if(button)button.textContent='已複製，請貼給 ChatGPT';
      }catch(e){
        if(button)button.textContent='請手動選取下方報告複製';
      }
    }
    function openScheduleDiagnostics(){
      let overlay=document.getElementById('p79ScheduleDiagOverlay');
      if(!overlay){
        overlay=document.createElement('div');
        overlay.id='p79ScheduleDiagOverlay';
        overlay.className='p79-schedule-diagnostic-overlay';
        overlay.setAttribute('role','dialog');
        overlay.setAttribute('aria-modal','true');
        overlay.setAttribute('aria-label','排班雲端連線診斷');
        overlay.innerHTML=`
          <div class="p79-schedule-diagnostic-panel">
            <div class="p79-schedule-diagnostic-bar">
              <strong><i class="fa-solid fa-stethoscope"></i> 排班雲端連線診斷（本頁唯讀）</strong>
              <button type="button" onclick="closeScheduleDiagnostics()" aria-label="關閉診斷視窗">返回班表 ✕</button>
            </div>
            <div class="p79diag-content">
              <p>直接使用目前排班頁的登入憑證與 GAS 設定，不開分頁、不修改班表。</p>
              <p id="p79DiagSessionInfo" class="p79diag-session"></p>
              <div class="p79diag-actions">
                <button id="p79DiagQuickBtn" type="button" onclick="p79RunScheduleDiag()">開始快速診斷</button>
                <button id="p79DiagFullBtn" type="button" onclick="p79RunScheduleDiag(true)">加測完整班表讀取</button>

    function setScheduleEditLockState(data) {

      scheduleEditLockState = {
        locked: !!data?.locked,

        ownerName: String(data?.ownerName || ''),

      };
      updateScheduleLockBadge();
      applyScheduleAccessUi();
      if (previousMine && !scheduleEditLockState.mine) {
        try { closeSubstituteAssignment(); } catch(e) {}
      }

      const lockChanged =
        previousMine !== !!scheduleEditLockState.mine ||
        previousLocked !== !!scheduleEditLockState.locked ||
        previousOwnerEmpId !== String(scheduleEditLockState.ownerEmpId || '');
      if (lockChanged && typeof scheduleNextEditLockPoll === 'function') {
        scheduleNextEditLockPoll(scheduleEditLockNextDelay());
      }
    }

    async function scheduleLockFetch(url, options = {}, timeoutMs = SCHEDULE_LOCK_FETCH_TIMEOUT_MS) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      } catch (e) {
        if (e && e.name === 'AbortError') {
          const err = new Error('雲端編輯鎖暫時未回應，系統會自動重新確認');
          err.code = 'SCHEDULE_LOCK_TIMEOUT';
          err.transient = true;
          throw err;
        }
        throw e;
      } finally {
        clearTimeout(timer);
      }
    }

    async function scheduleLockGet() {
      const token = currentPort79SsoToken();
      const url = GAS_URL + '?action=scheduleGetEditLock&gcToken=' + encodeURIComponent(token) + '&scheduleClientId=' + encodeURIComponent(getScheduleClientId()) + '&t=' + Date.now();
      const res = await scheduleLockFetch(url, { cache:'no-store', redirect:'follow' });
      return await readScheduleSsoJson(res);
    }

    function scheduleLockIsQuotaError(error) {
      const msg=String(error?.message||error||'').toLowerCase();
      return /quota|too many|429|service invoked too many|exceeded maximum execution|試算表服務.*過多|配額/.test(msg);
    }

    function scheduleLockIsTransientNetworkError(error) {
      const msg=String(error?.message||error||'').toLowerCase();
      return !!error?.transient || error?.code === 'SCHEDULE_LOCK_TIMEOUT' || /連線逾時|回應逾時|暫時未回應|timeout|timed out|failed to fetch|network|load failed|abort/.test(msg);
    }

    async function scheduleLockPost(action, keepalive=false) {
      const token = currentPort79SsoToken();
      const payload = { action, gcToken:token, token, scheduleClientId:getScheduleClientId() };
      const isManualAcquire = action==='scheduleAcquireEditLock' || action==='scheduleForceAcquireEditLock';
      const timeoutMs = isManualAcquire
        ? SCHEDULE_LOCK_ACQUIRE_TIMEOUT_MS
        : action==='scheduleHeartbeatEditLock' ? 12000 : SCHEDULE_LOCK_BACKGROUND_TIMEOUT_MS;

      const send = async () => {
        const res = await scheduleLockFetch(
          GAS_URL,
          { method:'POST', body:JSON.stringify(payload), redirect:'follow', keepalive:!!keepalive },
          timeoutMs
        );
        return await readScheduleSsoJson(res);
      };

      try {
        return await send();
      } catch (e) {
        if (!isManualAcquire || scheduleLockIsQuotaError(e) || !scheduleLockIsTransientNetworkError(e)) throw e;

        // V10.25：POST 逾時不代表 GAS 沒有完成。
        // 先查伺服器鎖定狀態；若其實已經是本人，就直接視為成功，避免重複 POST 與誤報失敗。
        await new Promise(resolve => setTimeout(resolve, 900));
        try {
          const verified = await scheduleLockGet();
          if (verified?.mine || verified?.acquired) return verified;
          // 若被別人先取得，也直接回傳現況，不需再打一個 POST。
          if (verified?.locked && !verified?.mine) return verified;
        } catch (verifyError) {
          console.debug('編輯鎖逾時後狀態確認暫時失敗，準備一次低頻重試：', verifyError);
        }

        // 只允許一次重試；避免 GAS 忙碌時形成連續請求。
        await new Promise(resolve => setTimeout(resolve, 1400));
        try {
          return await send();
        } catch (retryError) {
          if (scheduleLockIsTransientNetworkError(retryError)) {
            // 最後再查一次；即使第二次 POST 的回應也超時，伺服器仍可能已完成。
            try {
              await new Promise(resolve => setTimeout(resolve, 700));
              const verified = await scheduleLockGet();
              if (verified) return verified;
            } catch(ignore) {}
          }
          throw retryError;
        }
      }
    }

    async function forceTakeoverScheduleEditLock() {
      if (!isScheduleSuperAdmin()) { alert('此功能僅限超級管理員使用'); return; }
      const previous = scheduleEditLockState.locked ? scheduleLockOwnerLabel() : '目前編輯者';
      if (!confirm(`確定要踢除「${previous}」並由你接管排班編輯權嗎？\n\n對方下一次操作時會立即失去儲存權限。`)) return;
      try {
        const data = await scheduleLockPost('scheduleForceAcquireEditLock');
        scheduleLockLastError = '';
        setScheduleEditLockState(data);
        if(!scheduleEditLockState.mine)throw new Error(data?.error||'雲端尚未確認編輯權接管成功');
        await loadScheduleCloudWithRetry('manual', 2);
        renderTodaySchedulePanel();

    async function refreshOrAcquireScheduleEditLock() {
      // v9.1：避免定時心跳、手動重新整理、focus/online 同時進來造成重複請求與重繪。
      if (scheduleEditLockRefreshBusy || scheduleManualLockBusy) return false;
      const requestEpoch = scheduleLockRequestEpoch;
      scheduleEditLockRefreshBusy = true;
      try {
        if (canManageSchedule()) {
          // v10.14.7：進入頁面只查詢鎖定狀態，不自動搶編輯權。
          const data = scheduleEditLockState.mine
            ? await scheduleLockPost('scheduleHeartbeatEditLock')
            : await scheduleLockGet();
          if (requestEpoch !== scheduleLockRequestEpoch || scheduleManualLockBusy) return false;
          scheduleLockLastError = ''; scheduleLockFailureCount=0; scheduleLockFirstFailureAt=0;
          setScheduleEditLockState(data);
        } else {
          const data = await scheduleLockGet();
          if (requestEpoch !== scheduleLockRequestEpoch || scheduleManualLockBusy) return false;
          scheduleLockLastError = ''; scheduleLockFailureCount=0; scheduleLockFirstFailureAt=0;
          setScheduleEditLockState(data);
        }
        return true;
      } catch (e) {
        if (requestEpoch !== scheduleLockRequestEpoch || scheduleManualLockBusy) return false;
        scheduleLockLastError = String(e?.message || e || '編輯鎖連線失敗');
        scheduleLockFailureCount += 1; if(!scheduleLockFirstFailureAt)scheduleLockFirstFailureAt=Date.now();
        console.warn('排班編輯鎖同步失敗：', e);
        // v10.8 穩定租約：單次/短暫連線失敗不能立刻取消自己的編輯權。
        // 只有租約已真正到期，才切回唯讀；伺服器若成功回覆「已非本人」則 setScheduleEditLockState() 會立即處理。
        const leaseExpires=Number(scheduleEditLockState.expiresAt||0);
        const leaseStillValid=!!scheduleEditLockState.mine && leaseExpires>Date.now();
        if(!leaseStillValid && scheduleEditLockState.mine){
          scheduleEditLockState.mine=false;
          scheduleEditLockState.locked=false;
        }
        updateScheduleLockBadge();
        applyScheduleAccessUi();
        return leaseStillValid;
      } finally {
        scheduleEditLockRefreshBusy = false;
      }
    }

    function scheduleEditLockNextDelay() {
      if (document.visibilityState !== 'visible') return SCHEDULE_LOCK_HIDDEN_POLL_MS;
      if (scheduleEditLockState.mine) return SCHEDULE_LOCK_HEARTBEAT_MS;
      if (scheduleEditLockState.locked) return SCHEDULE_LOCK_WATCH_OTHER_MS;
      return SCHEDULE_LOCK_FREE_POLL_MS;
    }

    function scheduleNextEditLockPoll(delayMs = scheduleEditLockNextDelay()) {
      if (scheduleEditLockTimer) clearTimeout(scheduleEditLockTimer);
      scheduleEditLockTimer = setTimeout(async () => {
        try { await refreshOrAcquireScheduleEditLock(); }
        catch (e) { console.debug('排班編輯鎖背景確認失敗：', e); }
        scheduleNextEditLockPoll(scheduleEditLockNextDelay());
      }, Math.max(350, Number(delayMs) || SCHEDULE_LOCK_FREE_POLL_MS));
    }

    async function initializeScheduleEditLock() {
      // V10.27：只在「別人正在編輯」時加速成 2 秒輪詢。
      // 自己持有鎖仍維持 30 秒心跳，避免不必要的 GAS 請求。
      await refreshOrAcquireScheduleEditLock();
      scheduleNextEditLockPoll(scheduleEditLockNextDelay());

      window.addEventListener('focus', () => {
        if (document.visibilityState === 'visible') {
          refreshOrAcquireScheduleEditLock()
            .finally(() => scheduleNextEditLockPoll(scheduleEditLockNextDelay()));
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          refreshOrAcquireScheduleEditLock()
            .finally(() => scheduleNextEditLockPoll(scheduleEditLockNextDelay()));
        } else {
          scheduleNextEditLockPoll(SCHEDULE_LOCK_HIDDEN_POLL_MS);
        }
      });
    }

    async function manualAcquireScheduleEditLock(){
      if (!canManageSchedule()) { alert('只有管理員以上且具有排班管理權限才可鎖定編輯。'); return false; }
      if (scheduleEditLockState.mine) { window.p79UpdateScheduleLockTop?.(); return true; }
      if (scheduleManualLockBusy) return false;
      scheduleManualLockBusy = true;
      ++scheduleLockRequestEpoch;
      try {
        scheduleLockLastError='';
        updateScheduleLockBadge();

        // 點擊直接由 GAS 原子取得編輯鎖，回傳持有人就是最新結果；
        // 不額外 GET 一次，以免慢網路下兩個請求串行等待。
        const data = await scheduleLockPost('scheduleAcquireEditLock');
        scheduleLockLastError='';scheduleLockFailureCount=0;scheduleLockFirstFailureAt=0;
        setScheduleEditLockState(data);
        if (scheduleEditLockState.mine) return true;

        updateScheduleLockBadge();
        return false;
      } catch(e) {
        scheduleLockLastError=String(e?.message||e||'鎖定暫時無法確認');
        scheduleLockFailureCount += 1;
        if(!scheduleLockFirstFailureAt) scheduleLockFirstFailureAt=Date.now();
        updateScheduleLockBadge();

        if (scheduleLockIsTransientNetworkError(e) || scheduleLockIsQuotaError(e)) {
          setTimeout(() => refreshOrAcquireScheduleEditLock().catch(()=>{}), 700);
          return false;
        }

        console.warn('鎖定編輯暫時失敗：', e);
        return false;
      } finally {
        scheduleManualLockBusy = false;
        scheduleNextEditLockPoll(scheduleEditLockNextDelay());
      }
    }
    async function manualReleaseScheduleEditLock(){
      if (!scheduleEditLockState.mine) { await refreshOrAcquireScheduleEditLock(); return; }
      await releaseScheduleEditLock(false);
      // 伺服器已回覆 release 成功，不需要再多打一支 GET。
      scheduleNextEditLockPoll(500);
    }
    window.manualAcquireScheduleEditLock=manualAcquireScheduleEditLock;
    window.manualReleaseScheduleEditLock=manualReleaseScheduleEditLock;

    async function manualRetryScheduleEditLock(){
      scheduleLockLastError='';scheduleLockFailureCount=0;scheduleLockFirstFailureAt=0;updateScheduleLockBadge();
      const ok=await refreshOrAcquireScheduleEditLock();
      if(!ok) updateScheduleLockBadge();
    }

    function releaseScheduleEditLockOnExit() {
      if (!scheduleEditLockState.mine) return;
      const token = currentPort79SsoToken();
      const payload = JSON.stringify({
        action:'scheduleReleaseEditLock',
        gcToken:token,
        token,
        scheduleClientId:getScheduleClientId()
      });

      // V10.28：離頁同時送 beacon + keepalive。
      // GAS release 是冪等操作，多送一次不會破壞資料，卻能降低跨網域轉址時 beacon 單獨遺失的機率。
      let sent=false;
      try {
        if (navigator.sendBeacon) {
          const body = new Blob([payload], { type:'text/plain;charset=UTF-8' });
          sent=!!navigator.sendBeacon(GAS_URL, body);
        }
      } catch (e) {}

      try {
        if(!sent)fetch(GAS_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=UTF-8'},
          body:payload,
          keepalive:true,
          redirect:'follow',
          cache:'no-store'
        }).catch(()=>{});
      } catch (e) {}

      scheduleEditLockState.mine = false;
      scheduleEditLockState.locked = false;
      scheduleEditLockState.startedAt = 0;
      scheduleEditLockState.lastCheckedAt = Date.now();
    }

    async function releaseScheduleEditLock(keepalive=false) {
      if (!scheduleEditLockState.mine || scheduleManualLockBusy) return false;
      scheduleManualLockBusy=true;
      ++scheduleLockRequestEpoch;
      try {
        const result=await scheduleLockPost('scheduleReleaseEditLock',keepalive);
        if (!result?.ok || result.released !== true) {
          throw new Error(String(result?.error||'雲端尚未確認解鎖，已保留原鎖定狀態'));
        }
        scheduleLockLastError='';
        setScheduleEditLockState({ok:true,locked:false,mine:false,ownerName:'',ownerEmpId:'',expiresAt:0,startedAt:0});
        return true;
      }catch(e){
        scheduleLockLastError=String(e?.message||e);
        updateScheduleLockBadge();
        console.warn('排班解鎖未確認，保留編輯鎖狀態並稍後核對',e);
        return false;
      }finally{
        scheduleManualLockBusy=false;
        scheduleNextEditLockPoll(1000);
      }
    }

    async function readScheduleSsoJson(response) {
      const raw = await response.text();
      const text = String(raw || '').replace(/^\uFEFF/, '').trim();
      if (!response.ok) throw new Error(`SSO HTTP ${response.status}`);
      if (!text) throw new Error('SSO 驗證回傳空白內容');
      if (/^<!doctype html|^<html/i.test(text)) throw new Error('SSO 驗證回傳 Google HTML，不是 JSON');
      try { return JSON.parse(text); } catch (e) { throw new Error('SSO 驗證未收到有效 JSON'); }
    }

    async function verifyScheduleSsoToken(token) {
      let lastError = null;
      for (let attempt = 1; attempt <= 3; attempt++) {
        const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        const timer = controller ? setTimeout(() => controller.abort(), 12000) : null;
        try {
          const res = await fetch(
            GAS_URL + '?action=gcGetSyncMeta&gcToken=' + encodeURIComponent(token) + '&t=' + Date.now(),
            { cache:'no-store', redirect:'follow', signal: controller?.signal }
          );
          const data = await readScheduleSsoJson(res);
          const role = String(data?.adminRole || '').toLowerCase();
          const access = getSchedulePermissionFromData(data);
          if (!data?.ok || !['admin','superadmin'].includes(role) || access === 'none') {
            const authError = new Error(data?.error || '此帳號沒有排班系統權限');
            authError.ssoAuthRejected = true;
            throw authError;
          }
          data.scheduleAccessLevel = access;
          return data;
        } catch (e) {
          lastError = e;
          if (e?.ssoAuthRejected) break;
          if (attempt < 3) await new Promise(r => setTimeout(r, 450 * attempt));
        } finally {
          if (timer) clearTimeout(timer);
        }
      }
      throw lastError || new Error('SSO 驗證失敗');
    }

    async function consumePort79SsoHandoff() {
      const token = currentPort79SsoToken();
      if (!token) return false;

      // V10.16 FAST START：
      // 七大系統同一分頁內已驗證過的 session 直接沿用，不再每次進排班都先等
      // gcGetSyncMeta 最多 3 x 12 秒。真正的雲端資料端點仍會用 token 驗證權限。
      if (
        sessionStorage.getItem('port79_sso_verified') === '1' &&
        hasLocalScheduleSession()
      ) {
        try {
          const cached = JSON.parse(sessionStorage.getItem('admin_session') || 'null') || {};
          const role = String(cached.adminRole || sessionStorage.getItem('aqc_admin_role') || '').toLowerCase();
          scheduleAccessLevel = role === 'superadmin'
            ? 'manage'
            : normalizeSchedulePermissionLevel(cached?.systemPermissions?.schedule, 'none');
          if (['admin','superadmin'].includes(role) && scheduleAccessLevel !== 'none') {
            clearPort79SsoHash();
            return true;
          }
        } catch (e) {}
      }

      try {
        const data = await verifyScheduleSsoToken(token);
        const empId = String(data.empId || '').trim().toUpperCase();
        const name = String(data.name || '');
        const role = String(data.adminRole || 'admin').toLowerCase();
        scheduleAccessLevel = data.scheduleAccessLevel || getSchedulePermissionFromData(data);
        const systemPermissions = data.systemPermissions || { schedule: scheduleAccessLevel };

        sessionStorage.setItem('admin_session', JSON.stringify({
          empId, name, adminRole:role, systemPermissions, loginAt:new Date().toISOString(), sso:true
        }));
        sessionStorage.setItem('aqc_admin_logged_in','1');
        sessionStorage.setItem('aqc_admin_id',empId);
        sessionStorage.setItem('aqc_admin_role',role);
        sessionStorage.setItem('aqc_admin_name',name);
        sessionStorage.setItem('port79_admin_token',token);
        sessionStorage.setItem('port79_gc_token',token);
        if (role === 'superadmin') sessionStorage.setItem('port79_gc_superadmin_token',token);
        else sessionStorage.removeItem('port79_gc_superadmin_token');
        sessionStorage.setItem('port79_sso_verified','1');
        sessionStorage.setItem('port79_gas_url',GAS_URL);
        clearPort79SsoHash();
        return true;
      } catch (e) {
        console.error('PORT79 Schedule SSO failed:', e);
        const fallback = !e?.ssoAuthRejected &&
          sessionStorage.getItem('port79_sso_verified') === '1' &&
          hasLocalScheduleSession();
        clearPort79SsoHash();
        if (fallback) return true;
        return false;
      }
    }

    async function p79RestoreSchedulePreview(month,epoch){

    // If a month has been authenticated but a widget fails while rendering, keep

    // shifts, silently unlock editing, or replace another month's data.
    function p79ScheduleRenderReadOnlyFallback(error){
      try{

        const authorized=p79ScheduleHasOfficialData()||
          source?.month===month&&source.kind==='cache'&&!!currentPort79SsoToken();

          '已排'+known+'格、待排'+missing+'格；不會自動補成「休」，也不會修改雲端。請使用上方「重新讀取」恢復完整操作。'+
          '<div class="text-xs mt-1">渲染錯誤：'+detail+'</div></div>'+
          '<div class="overflow-auto max-h-[70vh]"><table class="border-collapse text-xs"><thead><tr>'+

          '</tr></thead><tbody>'+rows+'</tbody></table></div></section>';
        applyScheduleAccessUi?.();
        return true;
      }catch(fallbackError){console.error('唯讀班表救援畫面失敗',fallbackError);return false;}
    }
    let p79ScheduleLastRenderError='';
    function p79SchedulePreviewRenderError(error){

    let scheduleSaveTimer = null;
    let personnelSaveTimer = null;

    // p79-schedule-edit-performance-v20261007
    // 管理員連續編輯班表時，不再每改一格就同步序列化整份資料、重建整張月表。
    let scheduleLocalPersistTimer = null;

    function queueScheduleLocalPersist(delay=220) {

    function flushScheduleLocalPersist() {

    // ===== 登入後全自動雲端同步 =====
    let port79ScheduleAutoSyncTimer = null;
    let port79ScheduleAutoSyncBusy = false;
    let port79ScheduleLastAutoSyncAt = 0;
    // v2026.09.28.7.38：所有本機修改必須先完成雲端寫入，背景同步才允許往回拉資料。
    // 避免新增/刪除組別後，alert/prompt 關閉觸發 window.focus，舊雲端資料把新組別瞬間蓋掉。
    let port79ScheduleWriteInFlight = null;
    let port79ScheduleDirty = false;

    // V10.15：每次本機排班異動都遞增版本。
    // 任何較早發出的 GET，只要回來時版本不同，就不得覆蓋目前畫面。
    let p79ScheduleLocalMutationVersion = 0;
    let p79ScheduleProtectLocalUntil = 0;

    function p79MarkScheduleLocalMutation() {
      p79ScheduleLocalMutationVersion += 1;
      port79ScheduleDirty = true;
      // 使用者正在連續編輯時，背景讀取只可更新非班表狀態，不可洗掉班表。
      p79ScheduleProtectLocalUntil = Math.max(p79ScheduleProtectLocalUntil, Date.now() + 4000);
      return p79ScheduleLocalMutationVersion;
    }

    function p79MarkScheduleCloudWriteConfirmed(snapshotVersion) {
      // An older POST must never clear newer unsaved edits.
      const latest=Number(snapshotVersion)===p79ScheduleLocalMutationVersion;
      port79ScheduleDirty = !latest;
      port79ScheduleLastAutoSyncAt = Date.now();
      // GAS 寫入成功後，月份讀取/試算表索引可能短暫仍看見舊內容。
      // 12 秒內禁止自動 GET 把剛儲存的本機畫面洗回去。
      p79ScheduleProtectLocalUntil = Math.max(p79ScheduleProtectLocalUntil, Date.now() + 12000);
      return latest;
    }

    let p79ScheduleWriteTail=Promise.resolve();
    async function runScheduleCloudWrite(task) {
      // Promise chaining, not just waiting on the current writer, guarantees serial calls.
      const run=()=>Promise.resolve().then(task).catch(e=>{
        console.error('排班雲端寫入失敗：',e);
        return false;
      });
      const p=p79ScheduleWriteTail.then(run,run);
      p79ScheduleWriteTail=p.then(()=>{},()=>{});
      port79ScheduleWriteInFlight=p;
      try { return await p; }
      finally { if(port79ScheduleWriteInFlight===p)port79ScheduleWriteInFlight=null; }
    }

    async function flushSchedulePendingWrites() {
      // 人員/組別儲存本身已包含當月班表，因此優先處理並取消一般班表計時器。
      if (personnelSaveTimer) {
        clearTimeout(personnelSaveTimer);
        personnelSaveTimer = null;
        if (scheduleSaveTimer) { clearTimeout(scheduleSaveTimer); scheduleSaveTimer = null; }
        const ok = await runScheduleCloudWrite(() => saveScheduleEmployeesToCloud(false));
        return !!ok && !port79ScheduleDirty;
      }
      if (scheduleSaveTimer) {
        clearTimeout(scheduleSaveTimer);
        scheduleSaveTimer = null;
        const ok = await runScheduleCloudWrite(() => saveScheduleMonthToCloud(false));
        return !!ok && !port79ScheduleDirty;
      }
      if (port79ScheduleWriteInFlight) {
        const ok = await port79ScheduleWriteInFlight;
        return !!ok && !port79ScheduleDirty;
      }
      return !port79ScheduleDirty;
    }

    async function saveScheduleGroupsImmediate() {
      port79ScheduleDirty = true;
      const ok = await runScheduleCloudWrite(async () => {
        try {
          await cloudPost({ action: 'saveScheduleGroups', groups: availableGroups });
          return true;
        } catch (e) {
          console.error('排班組別雲端儲存失敗：', e);
          return false;
        }
      });
      if (ok) {
        port79ScheduleDirty = false;
        // 剛寫完就不要因 alert 關閉產生的 focus 事件立刻再拉一次。
        port79ScheduleLastAutoSyncAt = Date.now();
      }
      return ok;
    }

    let p79ScheduleReadTask=null;
    let p79ScheduleCloudReadController=null;
    async function loadScheduleCloudWithRetry(reason='auto',retryCount=3){
      const month=currentScheduleMonthKey();
      while(p79ScheduleReadTask){
        const task=p79ScheduleReadTask;
        if(task.month===month)return task.promise;
        await task.promise.catch(()=>false);
        if(currentScheduleMonthKey()!==month)return false;
      }
      const promise=loadScheduleCloudWithRetryOnce(reason,reason==='month'?1:retryCount);
      const task={month,promise};p79ScheduleReadTask=task;
      try{return await promise;}finally{if(p79ScheduleReadTask===task)p79ScheduleReadTask=null;}
    }
    async function loadScheduleCloudWithRetryOnce(reason='auto', retryCount=3) {
      if (!isGasUrlConfigured()) return false;
      if (port79ScheduleAutoSyncBusy) return false;

      // 有任何尚未送出的修改時，先真正完成寫入；寫入失敗就禁止往回拉舊雲端資料。
      if (port79ScheduleDirty || scheduleSaveTimer || personnelSaveTimer || port79ScheduleWriteInFlight) {
        const writeOk = await flushSchedulePendingWrites();
        if (!writeOk) {
          console.warn('尚有未成功儲存的排班修改，本次取消背景雲端同步，避免覆蓋畫面資料。');
          return false;
        }
      }

      const now = Date.now();
      if (!['login','manual','manual-cloud-sync','month'].includes(reason) && now < p79ScheduleProtectLocalUntil) {
        return true;
      }
      if (!['login','manual','month'].includes(reason) && now - port79ScheduleLastAutoSyncAt < 8000) return true;

      port79ScheduleAutoSyncBusy = true;
      try {
        for (let attempt=1; attempt<=retryCount; attempt++) {
          const ok = await loadCloudData(false);
          if (ok) {
            port79ScheduleLastAutoSyncAt = Date.now();
            const yearMonth = document.getElementById('month-picker')?.value;
            if (yearMonth) initDefaultScheduleData(yearMonth, false);
            // 先顯示已讀到的班表；整月考勤核對及寫入不阻擋首次顯示。
            try { buildRoleTabsAndRender(); }
            catch(error) { p79SchedulePreviewRenderError(error); }
            // 雲端班表成功載入後也核對缺打卡；先前只在手動存檔觸發，畫面一直顯示舊班別。
            // 沒有排班編輯權、考勤資料不完整或月份已切換時不變更。
            if(yearMonth && scheduleEditLockState.mine && !port79ScheduleDirty){
              p79QueueScheduleNoPunchReconcile(yearMonth);
            }
            return true;
          }
          if (attempt < retryCount) {
            await new Promise(r => setTimeout(r, attempt * 1200));
          }
        }
        return false;
      } finally {
        port79ScheduleAutoSyncBusy = false;
      }
    }

    const p79ScheduleNoPunchTasks=new Map();
    function p79QueueScheduleNoPunchReconcile(yearMonth){
      if(p79ScheduleNoPunchTasks.has(yearMonth))return p79ScheduleNoPunchTasks.get(yearMonth);
      const task=p79ApplyNoPunchRestFromOfficial(yearMonth).then(async changed=>{
        if(changed && currentScheduleMonthKey()===yearMonth && scheduleEditLockState.mine){
          const saved=await saveScheduleMonthToCloud(false);
          if(!saved)console.warn('無打卡自動改休已在本機顯示，但尚未成功儲存雲端');
        }
      }).catch(error=>console.warn('排班背景考勤核對失敗',error)).finally(()=>{
        if(p79ScheduleNoPunchTasks.get(yearMonth)===task)p79ScheduleNoPunchTasks.delete(yearMonth);
      });
      p79ScheduleNoPunchTasks.set(yearMonth,task);return task;
    }

    function scheduleTaipeiTodayKey() {
      try {
        const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
        const x={}; parts.forEach(p=>x[p.type]=p.value);
        return `${x.year}-${x.month}-${x.day}`;
      } catch(e) {
        const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }
    }

    function scheduleNightRosterDate(now=new Date()) {
      const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(now);
      const p={};parts.forEach(x=>p[x.type]=x.value);
      const date=new Date(Date.UTC(Number(p.year),Number(p.month)-1,Number(p.day)-(Number(p.hour)<8?1:0)));
      return date.toISOString().slice(0,10);
    }
    let p79NightRosterSnapshot=null;
    let p79NightRosterReadBusy=false;
    function scheduleNightRosterSource(dateKey) {
      if(dateKey.slice(0,7)===currentScheduleMonthKey())return {data:monthlyScheduleData,meta:monthlyScheduleMeta};
      const snapshot=p79NightRosterSnapshot;
      if(snapshot?.month===dateKey.slice(0,7)&&snapshot.token===currentPort79SsoToken()&&Date.now()-snapshot.at<90000)return snapshot;
      return null;
    }
    async function refreshNightRosterSnapshot() {
      const dateKey=scheduleNightRosterDate(),month=dateKey.slice(0,7),token=currentPort79SsoToken();
      if(month===currentScheduleMonthKey()||!token||p79NightRosterReadBusy)return;
      const old=p79NightRosterSnapshot;
      if(old?.month===month&&old.token===token&&Date.now()-old.at<30000)return;
      p79NightRosterReadBusy=true;
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
      try {
        const response=await fetch(GAS_URL+'?action=getScheduleDataSecure&gcToken='+encodeURIComponent(token)+'&month='+encodeURIComponent(month)+'&_='+Date.now(),{cache:'no-store',signal:controller.signal});
        const result=await response.json();
        if(!response.ok||!result.ok||!Array.isArray(result.schedules))throw new Error('前一日班表未完成讀取');
        if(token!==currentPort79SsoToken())return;
        const data={},meta={};
        result.schedules.forEach(row=>{
          if(String(row.month||'')!==month)return;
          const id=String(row.empId||'').trim().toUpperCase();if(!id)return;
          data[id]=Object.assign({},row.schedule||{});meta[id]=data[id].__meta||{};
        });
        // Separate read-only snapshot: never replace the month being edited.
        p79NightRosterSnapshot={month,token,at:Date.now(),data,meta};
        renderTodaySchedulePanel();
      } catch(error) {console.warn('跨日晚班班表讀取失敗，暫不顯示未核對名單',error);}
      finally {clearTimeout(timer);p79NightRosterReadBusy=false;}
    }

    let p79ScheduleAttendanceViewVersion=0;
    function scheduleCanShowLiveAttendance() {

    function applyScheduleAttendanceMonthScope() {

    let todayScheduleExpanded = false;

    function scheduleRosterLeaveLabel(shift, leave) {
      if(leave) return scheduleLeaveTypeText(leave);
      const s=String(shift||'').trim();
      const map={
        '休':'排休','特':'年假','年':'年假','事':'事假','病':'病假',
        '公':'公假','喪':'喪假','颱':'颱風假','離':'離職'
      };
      return map[s] || s || '休假';
    }

    function renderTodaySchedulePanel() {
      if(!applyScheduleAttendanceMonthScope())return;
      const dateKey=scheduleTaipeiTodayKey();
      const nightDateKey=scheduleNightRosterDate();
      const nightSource=scheduleNightRosterSource(nightDateKey);
      const dateEl=document.getElementById('todayScheduleDate');
      const summaryEl=document.getElementById('todayScheduleSummary');
      const countsEl=document.getElementById('todayScheduleCounts');
      const detailEl=document.getElementById('todayScheduleDetail');
      const leaveSummaryEl=document.getElementById('todayScheduleLeaveSummary');
      if(!summaryEl||!countsEl||!detailEl)return;
      if(dateEl) dateEl.textContent=dateKey.replace(/-/g,'/');

      // V10.20：這個面板只依「今天正式班表」分組。
      // 實際打卡只顯示綠色提示，不再決定誰出現在名單裡。
      const groups={早:[],中:[],晚:[],休假:[],其他:[],加班代班:[]};
      const leaveShiftCodes=new Set(['休','特','年','事','病','公','喪','颱','離']);

      (employees||[]).forEach(emp=>{
        if(!scheduleEmployeeEligibleForMonth(emp,dateKey.slice(0,7)))return;
        if(!p79EmployeeDateEligible(emp,dateKey))return;
        // 今日排班名單不顯示主任（含）以上主管；不刪除人資、排班或原始資料。
        const role=String(emp.role||emp.jobTitle||'').replace(/\s+/g,'');
        if(/主任|課長|副理|經理|協理|處長|部長|總監|副總|總經理|董事長|執行長|廠長/.test(role))return;
        const shift=String(monthlyScheduleData?.[emp.id]?.[dateKey]||'').trim();
        const meta=monthlyScheduleMeta?.[emp.id]?.[dateKey]||{};
        const approvedLeave=approvedLeaveForEmployee(emp?.id,dateKey,emp?.name);
        const item={
          emp,shift,meta,dateKey,
          leave:approvedLeave,
          leaveLabel:scheduleRosterLeaveLabel(shift,approvedLeave)
        };

        // 已核准請假優先歸到休假；否則完全依班表代碼分類。
        if(approvedLeave || leaveShiftCodes.has(shift)){
          groups.休假.push(item);
        }else if(shift==='早'){
          groups.早.push(item);
        }else if(shift==='中'){
          groups.中.push(item);
        }else if(shift==='晚'&&nightDateKey===dateKey){
          groups.晚.push(item);
        }else if(shift&&shift!=='晚'){
          groups.其他.push(item);
        }

        if(meta && (meta.overtime || meta.type==='substitute' || meta.forEmpId)){
          groups.加班代班.push(item);
        }
      });
      if(nightDateKey!==dateKey&&nightSource){
        (employees||[]).forEach(emp=>{
          if(!p79EmployeeDateEligible(emp,nightDateKey))return;
          if(/主任|課長|副理|經理|協理|處長|部長|總監|副總|總經理|董事長|執行長|廠長/.test(String(emp.role||emp.jobTitle||'')))return;
          if(String(nightSource.data?.[emp.id]?.[nightDateKey]||'').trim()!=='晚')return;
          if(approvedLeaveForEmployee(emp.id,nightDateKey,emp.name))return;
          const meta=nightSource.meta?.[emp.id]?.[nightDateKey]||{};
          const personnel=nightSource.data?.[emp.id]?.__personnel;
          const nightEmp=personnel?{...emp,role:personnel.role||emp.role,group:personnel.group||emp.group}:emp;
          groups.晚.push({emp:nightEmp,shift:'晚',meta,dateKey:nightDateKey});
        });
      }


      const roleOrder=['領班','指揮手','AQC','ARMG','F/L','課長','主任','副理'];
      const roleRank=r=>{const i=roleOrder.indexOf(String(r||''));return i<0?99:i;};
      const sortList=list=>list.sort((a,b)=>{
        const rr=roleRank(a.emp?.role)-roleRank(b.emp?.role); if(rr)return rr;
        const ga=String(a.emp?.group||'不分組'),gb=String(b.emp?.group||'不分組');
        const gr=ga.localeCompare(gb,'zh-Hant'); if(gr)return gr;
        return String(a.emp?.name||'').localeCompare(String(b.emp?.name||''),'zh-Hant');
      });
      Object.values(groups).forEach(sortList);

      const scheduledWorking=new Map();
      [...groups.早,...groups.中,...groups.晚,...groups.其他].forEach(x=>scheduledWorking.set(x.emp.id,x));
      const totalScheduled=scheduledWorking.size;

    function scheduleAttendanceRecordTimestamp(record) {
      const raw=String(record?.timeStr||record?.time||record?.dateTime||'').trim().replace('T',' ');
      const m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if(!m)return 0;
      return Date.parse(m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0')+'T'+m[4].padStart(2,'0')+':'+m[5]+':'+String(m[6]||'0').padStart(2,'0')+'+08:00');
    }

    function scheduleAttendanceRecordType(record) {
      const s=String(record?.status||record?.type||record?.action||'').trim().toUpperCase();
      if(/下班|簽退|CLOCK[ _-]?OUT|(^|\W)OUT($|\W)/i.test(s))return 'OUT';
      if(/上班|簽到|CLOCK[ _-]?IN|(^|\W)IN($|\W)/i.test(s))return 'IN';
      return '';
    }

    function scheduleNightAttendanceLatest(records,people,now=Date.now()) {
      const latest=new Map(),byAttendanceNo=new Map();
      (people||[]).forEach(emp=>{
        const key=String(emp.attNo||emp.attendanceNo||'').trim();if(!key)return;
        const ids=byAttendanceNo.get(key)||new Set();ids.add(String(emp.id||emp.empId||'').trim().toUpperCase());byAttendanceNo.set(key,ids);
      });
      (records||[]).forEach(record=>{
        if(record.deleted===true||record.isDeleted===true)return;
        const ts=scheduleAttendanceRecordTimestamp(record),type=scheduleAttendanceRecordType(record);
        if(!ts||!type||ts>now||ts<now-18*3600000)return;
        let id=String(record.empId||'').trim().toUpperCase();
        if(!id){const ids=byAttendanceNo.get(String(record.attNo||record.attendanceNo||'').trim());if(ids?.size===1)id=[...ids][0];}
        if(!id)return;
        const old=latest.get(id);
        // At equal timestamps OUT wins; a check-out must never become a false green light.
        if(!old||ts>old.ts||(ts===old.ts&&type==='OUT'))latest.set(id,{ts,type});
      });
      return latest;
    }
    async function readScheduleNightAttendance(token) {
      const today=scheduleTaipeiTodayKey(),nightDate=scheduleNightRosterDate();
      if(today===nightDate)return null;
      const months=[...new Set([nightDate.slice(0,7),today.slice(0,7)])];
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
      try {
        const results=await Promise.all(months.map(async month=>{
          const response=await fetch(GAS_URL+'?action=getAttendanceMainDirect&month='+encodeURIComponent(month)+'&token='+encodeURIComponent(token)+'&t='+Date.now(),{cache:'no-store',signal:controller.signal});
          const data=await response.json();
          if(!response.ok||!data.ok||!Array.isArray(data.records)||String(data.month||'')!==month)throw new Error(data.error||'跨日晚班正式考勤未完成讀取');
          return data.records;
        }));
        if(token!==currentPort79SsoToken()||nightDate!==scheduleNightRosterDate())throw new Error('日期或登入狀態已變更，稍後重新核對晚班');
        return {nightDate,latest:scheduleNightAttendanceLatest(results.flat(),employees)};
      } finally {clearTimeout(timer);}
    }
    function applyScheduleNightAttendance(baseSet,night) {
      const result=new Set(baseSet);if(!night)return result;
      const earliest=Date.parse(night.nightDate+'T21:00:00+08:00');
      night.latest.forEach((record,id)=>{
        if(record.type==='IN'&&record.ts>=earliest)result.add(id);
        else result.delete(id);
      });
      return result;
    }

    async function refreshScheduleAttendanceState(showError=false) {
      if(!applyScheduleAttendanceMonthScope())return false;
      const requestMonth=currentScheduleMonthKey(),requestViewVersion=p79ScheduleAttendanceViewVersion;
      if (p79ScheduleAttendanceStateBusy || p79ScheduleAttendanceAuthExpired) return false;
      if (!isGasUrlConfigured()) { setScheduleAttendanceLiveStatus('error', '考勤燈號未同步：未設定正式 GAS'); return false; }
      const token = currentPort79SsoToken();
      if (!token) { p79ScheduleAttendanceAuthExpired=true; setScheduleAttendanceLiveStatus('error', '考勤燈號暫停同步：登入驗證遺失，請重新登入'); return false; }
      p79RefreshScheduleDutyPeriod();
      refreshNightRosterSnapshot();
      p79ScheduleAttendanceStateBusy = true;
      if (!p79ScheduleAttendanceHasSynced) setScheduleAttendanceLiveStatus('loading', '考勤燈號：向正式雲端讀取中…');
      try {
        const url = GAS_URL +
          '?action=getScheduleAttendanceState&gcToken=' + encodeURIComponent(token) +
          '&t=' + Date.now();
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 25000);
        let res,data;
        try { res = await fetch(url, {cache:'no-store', redirect:'follow', signal:controller.signal});
          if(!res.ok)throw Error('HTTP '+res.status);
          data=await res.json();

        } finally { clearTimeout(timer); }
        if(requestViewVersion!==p79ScheduleAttendanceViewVersion||requestMonth!==currentScheduleMonthKey()||token!==currentPort79SsoToken())return false;
        if (!data?.ok) {
          const err=String(data?.error || '今日考勤狀態讀取失敗');
          if (/登入驗證.*(?:逾時|過期|失效|無效)|登入.*(?:逾時|過期)|token.*(?:expired|invalid)|session.*expired|請重新登入/i.test(err)) {
            p79ScheduleAttendanceAuthExpired=true;
            setScheduleAttendanceLiveStatus('error','考勤燈號已暫停同步：登入已過期，請返回首頁重新登入');
            return false;
          }
          throw new Error(err);
        }
        if (!Array.isArray(data.activeEmpIds)) throw new Error('雲端未提供即時出勤名單（請確認 GAS 已更新）');
        if (data.today && data.today !== scheduleTaipeiTodayKey()) throw new Error('雲端回傳的出勤日期不是今日');

        const baseSet = new Set(
          data.activeEmpIds.map(v => String(v || '').trim().toUpperCase()).filter(Boolean)
        );
        const night = await readScheduleNightAttendance(token);
        if(requestViewVersion!==p79ScheduleAttendanceViewVersion||requestMonth!==currentScheduleMonthKey()||!scheduleCanShowLiveAttendance()||token!==currentPort79SsoToken())return false;
        const nextSet = applyScheduleNightAttendance(baseSet,night);

        const before = [...todayAttendanceActiveEmpIds].sort().join('|');
        const after = [...nextSet].sort().join('|');
        const wasSynced=p79ScheduleAttendanceHasSynced;
        todayAttendanceActiveEmpIds = nextSet;
        p79ScheduleAttendanceHasSynced = true;
        p79ScheduleAttendanceLastSyncedAt = Date.now();
        const syncedAt = new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
        setScheduleAttendanceLiveStatus('ok', '考勤燈號已同步 ' + syncedAt + '｜已簽到未簽退 ' + nextSet.size + ' 人'+(night?'｜含 '+night.nightDate.replace(/-/g,'/')+' 跨日晚班':''));

        if (before !== after || !wasSynced) {
          renderTodaySchedulePanel();
          try { renderRoleScheduleView(); } catch(ignore) {}
        }
        return true;
      } catch(e) {
        if(requestViewVersion!==p79ScheduleAttendanceViewVersion||requestMonth!==currentScheduleMonthKey())return false;
        console.warn('今日考勤狀態同步失敗：', e);
        setScheduleAttendanceLiveStatus('error', '考勤燈號同步失敗，正在重試：' + String(e?.message || e || '').slice(0, 110));
        return false;
      } finally {
        p79ScheduleAttendanceStateBusy = false;
      }
    }

      // Overtime declarations are saved from work-hours into the official schedule metadata.
      // On a separate schedule tab, explicitly refresh the cloud snapshot after the confirmed save.
      let lastOvertimeNotification='';

        let raw='';
        try{raw=localStorage.getItem('p79_schedule_overtime_changed_v1')||'';}catch(ignore){return;}
        if(!raw||raw===lastOvertimeNotification)return;
        let change;
        try{change=JSON.parse(raw);}catch(ignore){return;}
        if(!change||!/^\d{4}-\d{2}$/.test(String(change.month||''))||
            change.month!==currentScheduleMonthKey()||!Number(change.at)||
            Date.now()-Number(change.at)>3600000)return;
        // Avoid discarding unsaved schedule edits. An unsuccessful read is retried on next focus.
        loadScheduleCloudWithRetry('manual',2).then(ok=>{
          if(ok)lastOvertimeNotification=raw;

      };
      window.addEventListener('storage',event=>{
        if(event.key==='p79_schedule_overtime_changed_v1')refreshChangedOvertime();
      });
      window.addEventListener('focus',refreshChangedOvertime);
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')refreshChangedOvertime();
      });

        if(!event.persisted) releaseScheduleEditLockOnExit();
      });

    function scheduleCloudLooksLikeGoogleHtml(text) {
