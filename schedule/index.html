    function p79RestAutomaticPlan(emp,month,metadata=null) {
      const schedule=monthlyScheduleData[emp.id]||{};
      const end=String(emp.lastWorkDate||emp.terminationDate||'').replaceAll('/','-').slice(0,10);
      const typhoonProtected=[...new Set([
        ...p79TyphoonDates().filter(d=>d.startsWith(month+'-')),
        ...Object.keys(schedule).filter(d=>d.startsWith(month+'-')&&String(schedule[d]).trim()==='颱')
      ])];
      const nationalBlocked=[...new Set([
        ...typhoonProtected,
        ...(window.P79SpecialOvertime?.electionDates?.()||[]).filter(d=>d.startsWith(month+'-'))
      ])];
      // The day grid already turns a completed, cloud-checked work shift with
      // no punch into 休. Feed those SAME dates into the shared allocator so
      // the 6th 休 can fill an outstanding 國 instead of becoming "休超額".
      const evidence=p79ScheduleRestClient().status(month).evidence;

      const observedOffDates=evidence?.complete===true?Object.keys(schedule).filter(date=>{
        const shift=String(schedule[date]||'').trim(),item=existing[date]||{};
        return date.startsWith(month+'-')&&['早','中','晚'].includes(shift)&&
          window.P79RestAttendance.state({attendanceEvidence:evidence},emp.id,date)==='rest'&&
          !item.manualRosterShift&&!item.overtime&&!item.overtimeReport&&!item.overtimeReports?.length&&
          !item.forEmpId&&item.type!=='substitute'&&
          !approvedLeaveForEmployee(emp.id,date)&&!p79LeaveCoverOnDay(emp.id,date).length&&
          !nationalBlocked.includes(date);

        {...emp,empId:emp.id},{...schedule,__meta:existing},
        Object.keys(schedule).filter(date=>date.startsWith(month+'-')),
        {attendanceEvidence:evidence,leaveCoverAssignments:typeof leaveCoverAssignments==='undefined'?[]:leaveCoverAssignments}
      )||[];

        p79RestAutomaticExcludedDates(emp,month),p79EmploymentStartDate(emp),
        /^\d{4}-\d{2}-\d{2}$/.test(end)?end:'',nationalBlocked,typhoonProtected,observedOffDates,exemptReports);

    function p79AutomaticRestMetadata(empId, month) {
      const existing=monthlyScheduleMeta[empId]||{};
      const person=employees.find(e=>e.id===empId);
      if(!person)return existing;
      try {return p79RestAutomaticPlan(person,month,existing).meta;}
      catch(error){return existing;}
    }

    function p79ApplyAutomaticRestMetadata() {
      const month=document.getElementById('month-picker').value;
      let changed=false;
      for (const emp of employees) {
        const meta=p79AutomaticRestMetadata(emp.id,month);
        if (JSON.stringify(meta)!==JSON.stringify(monthlyScheduleMeta[emp.id]||{})) {
          monthlyScheduleMeta[emp.id]=meta;changed=true;
        }

    // Audit the whole loaded month, regardless of the visible role/group. Read only:
    // never treat a missing roster day as zero quota and never modify a declaration.
    function p79RestQuotaAuditSnapshot(month,people=employees) {
      const findings=[],quota=p79RestQuota(month),totals={checked:0,complete:0,needsUpdate:0,unresolved:0,blocked:0};
      for(const emp of people) {
        const schedule=monthlyScheduleData[emp.id]||{},prior=monthlyScheduleMeta[emp.id]||{};
        const dates=Object.keys(schedule).filter(d=>d.startsWith(month+'-'));
        if(!dates.length){findings.push(emp.name+'：本月缺少班表，未核對');totals.blocked++;continue;}
        if(dates.every(d=>['離','離職'].includes(schedule[d])))continue;
        totals.checked++;
        try {
          const result=p79RestAutomaticPlan(emp,month,prior);
          // Audit the true 31-day displayed values, including approved leave,
          // typhoon overlays and overtime labels. Previously both before and
          // after only checked metadata and could falsely report 例4 when
          // the visible roster displayed just three 例 cells.
          const current=p79VisibleRestDayAudit(emp,month,prior);
          const planned=p79VisibleRestDayAudit(emp,month,result.meta);
          const typhoonDates=new Set(p79TyphoonDates().filter(d=>d.startsWith(month+'-')));
          const counted=dates=>Object.fromEntries(['例','休','國'].map(category=>
            [category,dates[category].filter(d=>!typhoonDates.has(d)).length]));
          const before=counted(current),after=counted(planned);
          const missing=Object.entries(result.quota).filter(([kind,n])=>after[kind]<n)
            .map(([kind,n])=>kind+'少'+(n-after[kind])+'天');
          const hidden=p79DailyRestCount(emp,month,result.meta).counts;
          const mismatch=['例','休','國'].filter(kind=>hidden[kind]!==after[kind]);
          const extra=Object.entries(result.quota).filter(([kind,n])=>after[kind]>n)
            .map(([kind,n])=>kind+'超額'+(after[kind]-n)+'天');
          const refreshed=['例','休','國'].some(kind=>before[kind]!==after[kind]);
          if(refreshed||mismatch.length||extra.length||missing.length)totals.needsUpdate++;
          if(missing.length)totals.unresolved++;
          if(refreshed||missing.length||mismatch.length||extra.length)findings.push(emp.name+'：'+
            '目前 '+['例','休','國'].map(c=>c+before[c]+'天('+((current[c]||[]).map(d=>d.slice(-2)).join('、')||'無')+')').join('／')+
            ' → 重新配對預覽 '+['例','休','國'].map(c=>c+after[c]).join('／')+
            (mismatch.length?'｜配對註記與實際畫面不符：'+mismatch.join('、'):'')+
            (missing.length?'｜'+missing.join('、')+'（未自動建立加班）':'')+
            (extra.length?'｜'+extra.join('、')+'（須人工確認，不會刪改班別）':''));
          else totals.complete++;
        }catch(error){totals.blocked++;findings.push(emp.name+'：無法安全配對－'+String(error.message||error));}
      }
      return {totals,findings};
    }

    function p79AutoAllocateRest() {
      if(!requireScheduleEditLock())return;
      const month=document.getElementById('month-picker').value;
      // This action explicitly applies to all employees, not the visible role tab.
      const selected=employees.slice();
      const results=[],errors=[];
      for(const emp of selected) {
        const schedule=monthlyScheduleData[emp.id]||{};
        const monthDays=Object.keys(schedule).filter(d=>d.startsWith(month+'-'));
        if(monthDays.length&&monthDays.every(d=>['離','離職'].includes(schedule[d])))continue;
        if(!monthDays.length){errors.push(emp.name+'：本月沒有班表，不能當作已完成配對');continue;}
        try {
          results.push({emp,result:p79RestAutomaticPlan(emp,month)});
        } catch(error) {errors.push(emp.name+'：'+error.message);}
      }
      if(errors.length){alert('全員配對未執行：\n'+errors.join('\n'));return;}
      const changed=results.filter(({emp,result})=>JSON.stringify(result.meta)!==
        JSON.stringify(monthlyScheduleMeta[emp.id]||{}));
      // A successful plan is not proof that a hidden 例 is visible. Verify the
      // same individual day-cell classifier that the full-staff audit uses.
      const quota=p79RestQuota(month).counts,shortages=[];
      for(const {emp,result} of results){
        try {
          const visible=p79VisibleRestDayAudit(emp,month,result.meta);
          const typhoon=new Set(p79TyphoonDates().filter(d=>d.startsWith(month+'-')));
          const counts=Object.fromEntries(['例','休','國'].map(kind=>
            [kind,visible[kind].filter(d=>!typhoon.has(d)).length]));
          const missing=['例','休','國'].filter(kind=>counts[kind]<result.quota[kind])
            .map(kind=>kind+' '+counts[kind]+'/'+result.quota[kind]);
          if(missing.length)shortages.push(emp.name+'：'+missing.join('、')+
            '（已優先補例再補休，剩餘可調整的休假日不足或受正式加班、人工鎖定限制）');
        }catch(error){shortages.push(emp.name+'：無法核對實際班格 '+String(error.message||error));}
      }
      if(changed.length){
        changed.forEach(({emp,result})=>monthlyScheduleMeta[emp.id]=result.meta);
        p79MarkScheduleLocalMutation();
        queueScheduleCloudSave();
        buildRoleTabsAndRender();
      }
      alert(month+' 已重新核對 '+results.length+' 人；實際調整 '+changed.length+' 人。\n'+
        '配對優先順序：例 → 休 → 國；颱風日固定顯示「颱」，不補例／休／國，也不動正式加班、核准請假及代班。\n'+
        (shortages.length?'仍不足（請按全員檢查查看日期）：\n'+shortages.join('\n')+'\n':'全部可配日期已按優先順序處理。\n')+
        (changed.length?'修改已排入雲端儲存，請確認儲存狀態。':'資料沒有變化，未重複寫入雲端。'));
    }

    function normalizeImportedScheduleShift(value) {
      const raw = String(value ?? '').replace(/\u3000/g, ' ').trim();
      if (!raw) return '';
      const compact = raw.replace(/\s+/g, '');
      const map = {
        '早':'早','早班':'早',
        '中':'中','中班':'中',
        '晚':'晚','晚班':'晚',
        '休':'休','休息':'休','休假':'休','例休':'休','例假':'休','輪休':'休','例':'休','國':'休',
        '特':'年','特休':'年','特別休假':'年','年':'年','年假':'年',
        '事':'事','事假':'事',
        '病':'病','病假':'病',
        '公':'公','公假':'公',
        '喪':'喪','喪假':'喪',
        '颱':'颱','颱風':'颱','颱風假':'颱','停班':'颱',
        '離':'離','離職':'離','resigned':'離','terminated':'離'
      };
      return Object.prototype.hasOwnProperty.call(map, compact) ? map[compact] : null;
    }

    function findImportColumnKey(row, candidates) {
      const keys = Object.keys(row || {});
      for (const cand of candidates) {
        const hit = keys.find(k => String(k).trim().toLowerCase() === String(cand).trim().toLowerCase());
        if (hit != null) return hit;
      }
      return '';
    }

    async function handleScheduleImportFile(event) {
      const input = event && event.target ? event.target : document.getElementById('schedule-import-file');
      const file = input && input.files && input.files[0];
      if (!file) return;

      try {
        if (!canManageSchedule()) throw new Error('此帳號沒有排班管理權限');
        if (!scheduleCanEditNow()) throw new Error('目前沒有取得排班編輯權，請重新整理後再試');
        if (typeof XLSX === 'undefined') throw new Error('試算表 元件尚未載入');
        const selectedRoles=JSON.parse(input.dataset.roleSelection||'null');
        if(!Array.isArray(selectedRoles)||!selectedRoles.length)throw new Error('請先勾選要匯入的職稱');

        const buffer = await file.arrayBuffer();
        const wb = XLSX.read(buffer, { type: 'array', cellDates: false });
        if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('試算表 內沒有可讀取的工作表');

        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
        if (!rows.length) throw new Error('第一個工作表沒有班表資料');

        const sample = rows.find(r => Object.values(r || {}).some(v => String(v ?? '').trim() !== '')) || rows[0];
        const empIdKey = findImportColumnKey(sample, ['工號','員工編號','考勤號','empId','ID']);
        const nameKey = findImportColumnKey(sample, ['姓名','員工姓名','name']);
        const groupKey = findImportColumnKey(sample, ['組別','分組','group']);
        const lockTypeKey = findImportColumnKey(sample, ['排班屬性','鎖定','lockType','排班鎖定屬性']);
        if (!empIdKey && !nameKey) {
          throw new Error('找不到「工號／員工編號／考勤號」或「姓名」欄位。請使用系統匯出的班表格式。');
        }

        const yearMonth = String(document.getElementById('month-picker')?.value || '').trim();
        if (!/^\d{4}-\d{2}$/.test(yearMonth)) throw new Error('目前排班月份格式不正確');
        if(input.dataset.importMonth!==yearMonth)throw new Error('排班月份已變更，請重新選擇職稱與匯入檔案');
        const [year, month] = yearMonth.split('-').map(Number);
        const totalDays = getDaysInMonth(year, month);

        const byId = new Map((employees || []).map(e => [String(e.id || '').trim().toUpperCase(), e]));
        const byName = new Map();
        (employees || []).forEach(e => {
          const n = String(e.name || '').trim();
          if (!n) return;
          if (!byName.has(n)) byName.set(n, []);
          byName.get(n).push(e);
        });

        let matchedRows = 0;
        let updatedCells = 0;
        let updatedGroups = 0;
        let updatedLockTypes = 0;
        const notFound = [];
        const ambiguous = [];
        const invalid = [];

        for (let r = 0; r < rows.length; r++) {
          const row = rows[r] || {};
          const rawId = empIdKey ? String(row[empIdKey] ?? '').trim().toUpperCase() : '';
          const rawName = nameKey ? String(row[nameKey] ?? '').trim() : '';
          let emp = rawId ? byId.get(rawId) : null;

          if (!emp && rawName) {
            const sameName = byName.get(rawName) || [];
            if (sameName.length === 1) emp = sameName[0];
            else if (sameName.length > 1) ambiguous.push(`${rawName}（同名 ${sameName.length} 人）`);
          }

          if (!emp) {
            if (rawId || rawName) notFound.push(rawId || rawName);
            continue;
          }
          if(!selectedRoles.includes(window.P79ScheduleTransferRoles.role(emp)))continue;
          matchedRows++;

          // V10.26：組別與排班屬性是「排班月份設定」，可由系統匯出的 試算表 還原。
          // 職稱仍以人資主檔為唯一來源，不從 試算表 覆蓋。
          if (groupKey) {
            const importedGroup = String(row[groupKey] ?? '').trim();
            if (importedGroup && importedGroup !== emp.group) {
              emp.group = importedGroup;
              if (!availableGroups.includes(importedGroup) && importedGroup !== '不輪班') {
                availableGroups.push(importedGroup);
              }
              updatedGroups++;
            }
          }
          if (lockTypeKey) {
            const rawLock = String(row[lockTypeKey] ?? '').trim().replace(/\s+/g,'');
            const importedLock = /固定|鎖定|fixed/i.test(rawLock) ? 'FIXED_LOCKED' : (/自動|輪班|rotation/i.test(rawLock) ? 'ROTATION' : '');
            if (importedLock && importedLock !== emp.lockType) {
              emp.lockType = importedLock;
              updatedLockTypes++;
            }
          }
          savePersonnelOverrideForCurrentMonth(emp);

          if (!monthlyScheduleData[emp.id]) monthlyScheduleData[emp.id] = {};
          if (!monthlyScheduleMeta[emp.id]) monthlyScheduleMeta[emp.id] = {};

          for (let d = 1; d <= totalDays; d++) {
            const dd = String(d).padStart(2, '0');
            const candidates = [
              `${d}日`, `${dd}日`, String(d), dd,
              `${month}/${d}`, `${month}/${dd}`,
              `${yearMonth}-${dd}`, `${year}/${String(month).padStart(2,'0')}/${dd}`
            ];
            const dayKey = findImportColumnKey(row, candidates);
            if (!dayKey) continue;
            const rawShift = row[dayKey];
            if (String(rawShift ?? '').trim() === '') continue;

            const importedRestOvertime=String(rawShift).trim().match(/^([早中晚])（([例休國])加）$/);
            const normalized = normalizeImportedScheduleShift(importedRestOvertime?importedRestOvertime[1]:rawShift);
            if (normalized === null) {
              invalid.push(`第 ${r + 2} 列 ${d}日：${String(rawShift)}`);
              continue;
            }

            const dateKey = `${yearMonth}-${dd}`;
            monthlyScheduleData[emp.id][dateKey] = normalized || '休';
            if (monthlyScheduleMeta[emp.id][dateKey]) delete monthlyScheduleMeta[emp.id][dateKey];
            if(importedRestOvertime)monthlyScheduleMeta[emp.id][dateKey]={restCategory:importedRestOvertime[2],restQuotaOvertime:true,restAllocationSource:'manual'};
            else if(['例','國'].includes(String(rawShift).trim()))monthlyScheduleMeta[emp.id][dateKey]={restCategory:String(rawShift).trim(),restAllocationSource:'manual'};
            updatedCells++;
          }
        }

        if (!matchedRows) {
          throw new Error('試算表 裡沒有符合已勾選職稱的人員。請確認職稱選擇及工號／姓名。');
        }
        if (!updatedCells) {
          throw new Error('有找到人員，但沒有讀到任何 1日～31日 的班別欄位。請使用系統匯出的班表格式。');
        }

        saveAllDataToLocalStorage();
        buildRoleTabsAndRender();

        const ok = await saveScheduleMonthToCloud(false);
        if (!ok) {
          throw new Error(
            '試算表 已成功讀取並套用到目前畫面，但尚未存進 Google 雲端。\n\n' +
            (lastScheduleCloudError || '同步 Google 雲端失敗') +
            '\n\n在雲端修復前請先不要重新整理頁面。'
          );
        }

        const notes = [];
        if (notFound.length) notes.push(`找不到人員：${[...new Set(notFound)].slice(0, 8).join('、')}${notFound.length > 8 ? '…' : ''}`);
        if (ambiguous.length) notes.push(`同名無法判斷：${[...new Set(ambiguous)].slice(0, 5).join('、')}`);
        if (invalid.length) notes.push(`略過無法辨識班別 ${invalid.length} 格，例如：${invalid.slice(0, 3).join('；')}`);

        alert(`✅ 班表匯入完成\n月份：${yearMonth}\n職稱：${selectedRoles.join('、')}\n對到人員：${matchedRows} 列\n更新班別：${updatedCells} 格${updatedGroups ? `\n更新組別：${updatedGroups} 人` : ''}${updatedLockTypes ? `\n更新排班屬性：${updatedLockTypes} 人` : ''}\n並已同步 Google 雲端${notes.length ? '\n\n⚠️ ' + notes.join('\n⚠️ ') : ''}`);
      } catch (err) {
        console.error('班表匯入失敗：', err);
        const msg = String(err?.message || err || '未知錯誤');
        const cloudSide = /Google Apps Script|Google 雲端|雲端|GAS|已成功讀取並套用/.test(msg);
        alert((cloudSide ? '⚠️ 試算表 已讀取，但雲端儲存失敗：\n' : '❌ 班表匯入失敗：\n') + msg);
      } finally {
        if (input){input.value='';delete input.dataset.roleSelection;delete input.dataset.importMonth;}
      }
    }

    async function exportScheduleToExcel() {

      if(!selectedRoles)return;
      if(document.getElementById('month-picker').value!==yearMonth)return alert('月份已變更，請重新選擇匯出職稱');
      const selectedEmployees=window.P79ScheduleTransferRoles.filter(employees,selectedRoles);
      if(!selectedEmployees.length)return alert('已勾選的職稱目前沒有人員');
      // 排班畫面可能已讀齊考勤；有特殊日時才需要確認該證據。
      // 不允許在核對失敗時靜默匯出原班別，造成颱／選遺失。
      const typhoonMarkers=typeof p79TyphoonDates==='function'?p79TyphoonDates():[];
      const hasSpecialDays=typhoonMarkers.some(day=>day.startsWith(yearMonth+'-'))||
        (window.P79SpecialOvertime?.electionDates?.()||[]).some(day=>day.startsWith(yearMonth+'-'));
      if(hasSpecialDays&&p79ScheduleRestClient().status(yearMonth).evidence.complete!==true){
        await p79ScheduleRestClient().refreshIfStale(yearMonth);
        if(p79ScheduleRestClient().status(yearMonth).evidence.complete!==true){
          alert('本月考勤尚未完成核對，無法正確判斷颱風／選舉日無打卡情形，請先完成考勤同步再匯出。');
          return;
        }
      }
      const sortedEmps = selectedEmployees.sort((a, b) => {
        const rDiff = getRolePriority(a.role) - getRolePriority(b.role);
        if (rDiff !== 0) return rDiff;
        const gDiff = getGroupPriority(a.group) - getGroupPriority(b.group);
        if (gDiff !== 0) return gDiff;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });

      // V10.16：固定班表匯出欄位，不再交給 SheetJS 自動推斷。
      // A~E 永遠保留：工號、姓名、職稱、組別、排班屬性；
      // F 之後固定為當月 1 日～月底。
      const exportHeaders = [
        '工號',
        '姓名',
        '職稱',
        '組別',
        '排班屬性',
        ...Array.from({ length: totalDays }, (_, index) => String(index + 1))

      const exportTyphoonNotes=[];
      sortedEmps.forEach(emp => {

          '工號': String(emp.id || ''),
          '姓名': String(emp.name || ''),

            selected.rosterShift==='颱'||selected.approvedLeaveCode==='颱';

            selected.dayMeta,selected.attendanceState,displayContext.attendanceEvidence);
          const eligibleEvent=selected.eligible&&typhoonMarked&&
            (selected.attendanceState!=='missing'||typhoonWorked)&&
            (!selected.ownApprovedLeave||selected.approvedLeaveCode==='颱'||typhoonWorked);
          // A non-destructive 試算表 cell note carries the small "颱日" badge
          // while keeping the editable shift value identical to the UI select.
          if(eligibleEvent&&selected.shownShift!=='颱')exportTyphoonNotes.push({

      });

      for(const note of exportTyphoonNotes){
        const address=XLSX.utils.encode_cell({r:note.row,c:note.col});
        if(ws[address]){
          ws[address].c=[{a:'排班系統',t:note.text}];
        }
      }
      // 固定欄寬，避免打開 試算表 時左側資料看起來像不見。
      ws['!cols'] = [
        { wch: 16 }, // 工號
        { wch: 12 }, // 姓名
        { wch: 12 }, // 職稱
        { wch: 10 }, // 組別
        { wch: 14 }, // 排班屬性
        ...Array.from({ length: totalDays }, () => ({ wch: 6 }))
      ];

      // 凍結/顯示左側欄位由 試算表 軟體決定；至少確保資料本身完整輸出。
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, `${yearMonth}職稱班表`);
      const roleLabel=selectedRoles.length===new Set(employees.map(window.P79ScheduleTransferRoles.role)).size?'全部職稱':selectedRoles.map(r=>r.replace(/[^\u3400-\u9fffA-Za-z0-9_-]+/g,'-')).join('_');
      XLSX.writeFile(wb, `${yearMonth}_${roleLabel}_排班表.xlsx`);
    }

    // 明確掛到 window，確保上方「功能 → 匯出」與頁面按鈕都呼叫同一份正式函式。
    window.exportScheduleToExcel = exportScheduleToExcel;
  </script>

<script id="port79-calendar-mode-script">
(function(){
  const KEY='port79_year_mode';
  const mode=localStorage.getItem(KEY)==='roc'?'roc':'gregorian';
  const sel=document.getElementById('port79CalendarModeSelect');
  if(sel){
    sel.value=mode;
    sel.addEventListener('change',()=>{
      localStorage.setItem(KEY,sel.value==='roc'?'roc':'gregorian');
      location.reload();
    });
  }
  if(mode!=='roc')return;
  const skip=new Set(['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT']);
  const cv=(s)=>{
    s=String(s||'');
    s=s.replace(/民國\s*(\d{1,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g,(m,y,mo,d)=>`${Number(y)}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})(?:[\/-])(\d{1,2})(?:[\/-])(\d{1,2})\b/g,(m,y,mo,d)=>`${Number(y)}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})\s*年\s*(\d{1,2})\s*月/g,(m,y,mo)=>`${Number(y)}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})(?:[\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,mo)=>`${Number(y)}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/民國\s*(\d{1,3})\s*年/g,(m,y)=>`${Number(y)}年`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g,(m,y,mo,d)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})(?:[\/-])(\d{1,2})(?:[\/-])(\d{1,2})\b/g,(m,y,mo,d)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年\s*(\d{1,2})\s*月/g,(m,y,mo)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})(?:[\/-])(\d{1,2})(?![\/-]\d)/g,(m,y,mo)=>`${Number(y)-1911}/${String(mo).padStart(2,'0')}`);
    s=s.replace(/\b((?:19|20)\d{2})\s*年/g,(m,y)=>`${Number(y)-1911}年`);
    return s;
  };
  let busy=false;
  function scan(root){
    if(!root||busy)return;
    busy=true;
    try{
      const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
      const nodes=[]; let n;
      while(n=walker.nextNode())nodes.push(n);
      nodes.forEach(node=>{
        const p=node.parentElement;
        if(!p||skip.has(p.tagName)||p.closest('#port79CalendarModeBox'))return;
        const old=node.nodeValue||'';
        const next=cv(old);
        if(next!==old)node.nodeValue=next;
      });
    }finally{busy=false}
  }
  scan(document.body);
  const mo=new MutationObserver(ms=>{
    if(busy)return;
    ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)scan(n.nodeType===1?n:n.parentElement)}));
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
</script>

\n<script id="schedule-v741-single-range-picker">
(function(){
  let rangeCalendarMonth='';
  let rangeDraftStart='';

  function pad2(n){return String(n).padStart(2,'0')}
  function ymShift(ym,delta){
    const m=String(ym||'').match(/^(\d{4})-(\d{2})$/);
    const d=m?new Date(Number(m[1]),Number(m[2])-1+delta,1):new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}`;
  }
  function monthBounds(ym){
    const [y,m]=String(ym).split('-').map(Number);
    const last=new Date(y,m,0).getDate();
    return [`${ym}-01`,`${ym}-${pad2(last)}`];
  }
  function prettyDate(v){return String(v||'').replace(/-/g,'/')}

  window.updateScheduleDateRangeSummary=function(){
    const a=document.getElementById('scheduleDateFrom')?.value||'';
    const b=document.getElementById('scheduleDateTo')?.value||'';
    const el=document.getElementById('scheduleDateRangeSummary');
    if(el)el.textContent=(!a&&!b)?'選擇日期範圍':(a&&b?`${prettyDate(a)} ～ ${prettyDate(b)}`:(a?`${prettyDate(a)} 起`:`至 ${prettyDate(b)}`));
  };

  function currentRangeMonth(){
    return (document.getElementById('scheduleDateFrom')?.value||document.getElementById('month-picker')?.value||scheduleTaipeiTodayKey().slice(0,7)).slice(0,7);
  }

  window.renderScheduleRangeCalendar=function(){
    if(!rangeCalendarMonth)rangeCalendarMonth=currentRangeMonth();
    const [y,m]=rangeCalendarMonth.split('-').map(Number);
    const firstDow=new Date(y,m-1,1).getDay();
    const lastDay=new Date(y,m,0).getDate();
    const from=document.getElementById('scheduleDateFrom')?.value||'';
    const to=document.getElementById('scheduleDateTo')?.value||'';
    const label=document.getElementById('scheduleRangeMonthLabel');
    const days=document.getElementById('scheduleRangeCalendarDays');
    const hint=document.getElementById('scheduleRangePickHint');
    if(label)label.textContent=`${y}年${pad2(m)}月`;
    if(hint)hint.textContent=rangeDraftStart?`開始 ${prettyDate(rangeDraftStart)}，請點結束日期`:'先點開始日期，再點結束日期';
    if(!days)return;
    const todayKey=scheduleTaipeiTodayKey();
    const html=[];
    for(let i=0;i<firstDow;i++)html.push('<span class="schedule-range-blank"></span>');
    for(let d=1;d<=lastDay;d++){
      const key=`${rangeCalendarMonth}-${pad2(d)}`;
      const dow=new Date(y,m-1,d).getDay();
      const cls=['schedule-range-day'];
      if(dow===0||dow===6)cls.push('is-weekend');
      const start=rangeDraftStart||from;
      const end=rangeDraftStart?'':to;
      if(start&&end&&key>=start&&key<=end)cls.push('is-in-range');
      if(key===start)cls.push('is-start');
      if(end&&key===end)cls.push('is-end');
      if(key===todayKey)cls.push('is-today');
      html.push(`<button type="button" class="${cls.join(' ')}" onclick="selectScheduleRangeDay('${key}')">${d}</button>`);
    }
    days.innerHTML=html.join('');
  };

  window.toggleScheduleRangePicker=function(ev){
    if(ev)ev.stopPropagation();
    const pop=document.getElementById('scheduleDateRangePopover');
    const btn=document.getElementById('scheduleDateRangeButton');
    if(!pop)return;
    const opening=pop.classList.contains('hidden');
    if(opening){
      rangeCalendarMonth=currentRangeMonth();
      rangeDraftStart='';
      window.renderScheduleRangeCalendar();
      pop.classList.remove('hidden');
      btn?.setAttribute('aria-expanded','true');
    }else window.closeScheduleRangePicker();
  };

  window.closeScheduleRangePicker=function(){
    document.getElementById('scheduleDateRangePopover')?.classList.add('hidden');
    document.getElementById('scheduleDateRangeButton')?.setAttribute('aria-expanded','false');
    rangeDraftStart='';
  };

  window.moveScheduleRangeCalendar=function(delta){
    rangeCalendarMonth=ymShift(rangeCalendarMonth||currentRangeMonth(),Number(delta)||0);
    rangeDraftStart='';
    window.renderScheduleRangeCalendar();
  };

  async function commitRange(a,b){
    const aEl=document.getElementById('scheduleDateFrom');
    const bEl=document.getElementById('scheduleDateTo');
    const monthEl=document.getElementById('month-picker');
    if(!aEl||!bEl||!monthEl)return;
    if(b<a)[a,b]=[b,a];
    // 排班表以月份為單位；跨月時先切換到結束日期的月份，再重新選擇範圍。
    if(a.slice(0,7)!==b.slice(0,7)){
      rangeCalendarMonth=b.slice(0,7);
      rangeDraftStart=b;
      window.renderScheduleRangeCalendar();
      return;
    }
    const oldMonth=monthEl.value;
    const newMonth=a.slice(0,7);
    aEl.value=a;
    bEl.value=b;
    monthEl.value=newMonth;
    if(newMonth!==oldMonth){
      try{applySchedulePersonnelOverrides(newMonth)}catch(e){}
      try{initDefaultScheduleData(newMonth)}catch(e){}
    }
    window.updateScheduleDateRangeSummary();
    try{buildRoleTabsAndRender()}catch(e){console.warn(e)}
    window.closeScheduleRangePicker();
  }

  window.selectScheduleRangeDay=function(key){
    if(!rangeDraftStart){
      rangeDraftStart=key;
      window.renderScheduleRangeCalendar();
      return;
    }
    commitRange(rangeDraftStart,key);
  };

  window.setScheduleRangeFullMonthFromPicker=function(){
    const ym=rangeCalendarMonth||currentRangeMonth();
    const [a,b]=monthBounds(ym);
    commitRange(a,b);
  };

  document.addEventListener('click',function(e){
    const c=document.getElementById('scheduleRangeControl');
    const pop=document.getElementById('scheduleDateRangePopover');
    if(c&&pop&&!pop.classList.contains('hidden')&&!c.contains(e.target))window.closeScheduleRangePicker();
  });
})();
</script>

<script id="port79-name-only-display-v20260930-88">
(function(){
  'use strict';
  const UNIT_TOKEN = '(?:AQC|ARMG|F\\s*\\/\\s*L|FL|GC|QC|RTG|RMG|領班|指揮手)';
  const NAME_UNIT_RE = new RegExp('([\\u3400-\\u9FFF]{2,5})\\s*[（(]\\s*'+UNIT_TOKEN+'\\s*[）)]','g');
  function nameOnlyText(value){
    return String(value == null ? '' : value).replace(NAME_UNIT_RE,'$1');
  }
  window.port79NameOnly = nameOnlyText;

  function cleanTextNode(node){
    if(!node || node.nodeType!==3) return;
    const old=node.nodeValue||'';
    const next=nameOnlyText(old);
    if(next!==old) node.nodeValue=next;
  }
  function cleanNode(root){
    if(!root) return;
    if(root.nodeType===3){ cleanTextNode(root); return; }
    if(root.nodeType!==1 && root.nodeType!==9 && root.nodeType!==11) return;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    let n; while((n=walker.nextNode())) cleanTextNode(n);
    if(root.nodeType===1){
      ['title','aria-label','placeholder'].forEach(attr=>{
        if(root.hasAttribute && root.hasAttribute(attr)){
          const old=root.getAttribute(attr)||'', next=nameOnlyText(old);
          if(next!==old) root.setAttribute(attr,next);
        }
      });
    }
  }

  let queued=false, pending=[];
  function flush(){
    queued=false;
    const list=pending.splice(0);
    list.forEach(cleanNode);
  }
  function queue(node){
    if(node) pending.push(node);
    if(!queued){ queued=true; requestAnimationFrame(flush); }
  }
  function start(){
    cleanNode(document.body);
    const obs=new MutationObserver(muts=>{
      muts.forEach(m=>{
        if(m.type==='characterData') queue(m.target);
        else m.addedNodes && m.addedNodes.forEach(queue);
      });
    });
    obs.observe(document.body,{subtree:true,childList:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start,{once:true});
  else start();
})();
</script>

<script id="p79-schedule-usability-script">
let p79QuickMonthBusy=false;
async function p79QuickScheduleMonth(step){
 if(p79QuickMonthBusy)return;
 const picker=document.getElementById('month-picker'),status=document.getElementById('p79QuickMonthStatus');
 const old=picker.value,base=/^\d{4}-\d{2}$/.test(old)?old:scheduleTaipeiTodayKey().slice(0,7),parts=base.split('-').map(Number);
 const date=new Date(parts[0],parts[1]-1+step,1,12),next=step===0?scheduleTaipeiTodayKey().slice(0,7):date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');
 if(next===old)return;
 // Only unfinished writes block navigation; an obsolete read may be cancelled safely.
 if(port79ScheduleDirty||scheduleSaveTimer||personnelSaveTimer||port79ScheduleWriteInFlight){
   p79QuickMonthBusy=true;status.textContent='正在確認尚未儲存的班表修改…';

   catch(e){status.textContent=e.message||'班表修改尚未確認，保留目前月份';return;}
   finally{p79QuickMonthBusy=false;}
 }
 picker.value=next;window.Port79CalendarRange?.syncAll?.();
 try{await onScheduleMonthPickerChange();}
 catch(e){if(picker.value===next)status.textContent=e.message||'月份切換未完成，請重新讀取';}
}

document.addEventListener('DOMContentLoaded',()=>{const control=document.getElementById('scheduleRangeControl'),host=document.getElementById('p79QuickMonthHost');if(control&&host)host.appendChild(control);});
