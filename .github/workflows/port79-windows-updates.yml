name: Publish verified Windows updates after Pages

on:
  pull_request:
    paths:
      - '.github/workflows/port79-windows-updates.yml'
      - 'desktop-lite/**'
      - 'tests/windows-cache-incremental-resume.cjs'
      - 'tests/windows-stale-ui-after-new-zip.cjs'
      - 'assets/port79-data-cache.js'
      - 'tests/native-cloud-download-dispatch.cjs'
      - 'tests/native-cloud-batch-stall.cjs'
      - 'tests/native-cloud-background-navigation.cjs'
      - 'assets/port79-cache-worker.html'
      - 'assets/port79-home-compact-controls.js'
  push:
    branches: [main]
    paths:
      # Rebuild the bundled website immediately when production source changes,
      # rather than leaving the homepage download one release behind while
      # waiting for the entire GitHub Pages regression gate to finish.
      - 'index.html'
      - 'assets/**'
      - 'attendance/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'leave/**'
      - 'aqc-efficiency/**'
      - 'hr/**'
      - 'history-data/**'
      - 'settings/**'
      - 'yard-dashboard/**'
      - 'gate-dashboard/**'
      - 'gate-import/**'
      - '.github/workflows/port79-windows-updates.yml'
      - 'desktop-lite/**'
      - 'tests/windows-cache-incremental-resume.cjs'
      - 'tests/windows-stale-ui-after-new-zip.cjs'
      - 'assets/port79-data-cache.js'
      - 'tests/native-cloud-download-dispatch.cjs'
      - 'tests/native-cloud-batch-stall.cjs'
      - 'tests/native-cloud-background-navigation.cjs'
      - 'assets/port79-cache-worker.html'
      - 'assets/port79-home-compact-controls.js'
  workflow_run:
    workflows: ['Publish static site to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port79-windows-official-update
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: production
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify program and update rollback rules
        shell: pwsh
        working-directory: production
        run: |
          node --test desktop-lite/tests/login-after-admin.test.cjs desktop-lite/tests/native-progress.test.cjs desktop-lite/tests/update-handoff.test.cjs tests/native-cloud-download-dispatch.cjs tests/native-cloud-batch-stall.cjs tests/native-cloud-background-navigation.cjs tests/windows-release-version-contract.cjs tests/windows-cache-incremental-resume.cjs tests/windows-stale-ui-after-new-zip.cjs tests/windows-download-link.cjs tests/cache-center-history-on-demand.cjs
          if($LASTEXITCODE -ne 0){throw 'Windows unit tests failed'}
          & ./desktop-lite/tests/shell-updater-safety.ps1
          if($LASTEXITCODE -ne 0){throw 'Updater preservation tests failed'}
      - name: Build native Windows EXE and full production website
        shell: pwsh
        working-directory: production
        run: |
          dotnet restore desktop-lite/Port79Lite.csproj /p:Platform=x64
          if($LASTEXITCODE -ne 0){throw 'Restore failed'}
          & ./desktop-lite/build-portable.ps1
          if($LASTEXITCODE -ne 0){throw 'Build failed'}
      - name: Smoke-test native Windows update, window visibility and automatic restart
        shell: pwsh
        working-directory: production
        run: |
          & ./desktop-lite/tests/native-restart-smoke.ps1
          # A PowerShell script can complete successfully while LASTEXITCODE
          # still contains a stale result from a prior native process.
          if(-not $?){throw 'Windows native restart smoke failed'}
      - name: Reject private data and stale website files
        shell: pwsh
        working-directory: production
        run: |
          $ErrorActionPreference='Stop'
          $zip='desktop-lite/dist/79號碼頭_Windows輕量資料夾版.zip'
          if(!(Test-Path $zip) -or (Get-Item $zip).Length -gt 30MB){throw 'Invalid ZIP'}
          Add-Type -AssemblyName System.IO.Compression
          $z=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            $prefix='79號碼頭_Windows輕量版/'
            $names=@($z.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach($required in @('Port79WindowsLite.exe','app/upgrade-windows.ps1','site/smart-punch/index.html','site/smart-punch/版本資訊.txt','site/smart-punch/assets/port79-cache-worker.html')){
              if($names -notcontains ($prefix+$required)){throw "Missing $required"}
            }
            # A release is invalid unless its embedded visible version is
            # exactly the source commit checked out for this ZIP.
            $versionEntry=$z.Entries | Where-Object { $_.FullName.Replace('\','/') -eq ($prefix+'site/smart-punch/版本資訊.txt') } | Select-Object -First 1
            if(!$versionEntry){throw 'ZIP missing embedded version identity'}
            $reader=[IO.StreamReader]::new($versionEntry.Open())
            try {$versionText=$reader.ReadToEnd()} finally {$reader.Dispose()}
            $builtSha=(& git rev-parse HEAD).Trim()
            if(!$versionText.Contains('GitHub Commit: '+$builtSha)){throw 'ZIP site version does not match source commit'}
            $commitDate=(& git log -1 --format=%cs).Trim()
            $humanVersion=$commitDate.Replace('-','')+[Convert]::ToUInt32($builtSha.Substring(0,8),16).ToString('D10')
            if($humanVersion -notmatch '^[0-9]{18}$'){throw 'ZIP visible version must be digits only'}
            if(!$versionText.Contains('版本號: '+$humanVersion)){throw 'ZIP numeric-only version does not match commit and date'}
            Write-Host ('WINDOWS PACKAGE VERIFIED: '+$humanVersion)
            foreach($entry in $z.Entries){
              $name=$entry.FullName.Replace('\','/')
              if(!$name.StartsWith($prefix,[StringComparison]::Ordinal) -or $name.Contains('../') -or $name.Contains(':')){throw "Unsafe path: $name"}
              if($name.StartsWith($prefix+'local-data/',[StringComparison]::OrdinalIgnoreCase) -and $entry.Length -gt 0){throw 'Private local-data must never be published'}
              if($name -match 'port79-yard-private-recovery|private.*backup|\.sqlite|\.ldb'){throw "Private material: $name"}
            }
            foreach($relative in @('index.html','assets/port79-gate-home.js','yard-dashboard/yard-dashboard.js','assets/port79-cache-worker.html')){
              $e=$z.Entries | Where-Object { $_.FullName -eq ($prefix+'site/smart-punch/'+$relative) } | Select-Object -First 1
              if(!$e){throw "Missing website file: $relative"}
              $expected=(Get-FileHash $relative -Algorithm SHA256).Hash.ToLowerInvariant()
              $hash=[System.Security.Cryptography.SHA256]::Create()
              try {
                $stream=$e.Open()
                try {$actual=[BitConverter]::ToString($hash.ComputeHash($stream)).Replace('-','').ToLowerInvariant()}
                finally {$stream.Dispose()}
              } finally {$hash.Dispose()}
              if($actual -ne $expected){throw "Old website source in ZIP: $relative"}
            }
          } finally {$z.Dispose()}
      - uses: actions/upload-artifact@v4
        with:
          name: verified-port79-windows
          path: production/desktop-lite/dist/79號碼頭_Windows輕量資料夾版.zip
          retention-days: 30
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-port79-windows
          path: dist
      - name: Publish verified Windows release and update legacy link
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Pages deployment can finish after a newer native-shell change.
          # Never overwrite the stable Windows update with a stale build.
          latest_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [[ "$SITE_SHA" != "$latest_main" ]]; then
            echo "Skip outdated Windows release $SITE_SHA; current main is $latest_main"
            exit 0
          fi
          cp 'dist/79號碼頭_Windows輕量資料夾版.zip' dist/Port79-Windows-Lite.zip
          # Unique asset name makes the release visible to operators and avoids
          # the browser reusing an older identically-named downloaded ZIP.
          cp dist/Port79-Windows-Lite.zip "dist/Port79-Windows-Lite-${SITE_SHA:0:12}.zip"
          tag="port79-windows-lite-$(date -u +%Y%m%d)-${SITE_SHA:0:12}"
          if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
            echo "Already published $tag; no duplicate release"
            exit 0
          fi
          gh release create "$tag" dist/Port79-Windows-Lite.zip "dist/Port79-Windows-Lite-${SITE_SHA:0:12}.zip" -R "$REPO" \
            --title "79號碼頭 Windows 正式更新 ($tag)" --target "$SITE_SHA" --latest \
            --notes "Verified Windows native package and production site $SITE_SHA. No local-data or private yard backup."
          # Older Windows EXEs check this fixed legacy tag.
          gh release upload port79-windows-lite-20261120 dist/Port79-Windows-Lite.zip --clobber -R "$REPO"
          echo "Published $tag and refreshed stable legacy download"
