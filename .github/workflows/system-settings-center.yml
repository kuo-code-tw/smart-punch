name: Verify system settings center
on:
  pull_request:
    paths:
      - 'settings/**'
      - 'assets/port79-management-workspace.js'
      - 'assets/port79-system-notice.js'
      - 'index.html'
      - 'tests/system-settings-center.cjs'
      - '.github/workflows/system-settings-center.yml'
  push:
    branches: [main]
    paths:
      - 'settings/**'
      - 'assets/port79-management-workspace.js'
      - 'assets/port79-system-notice.js'
      - 'index.html'
      - 'tests/system-settings-center.cjs'
      - '.github/workflows/system-settings-center.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/system-settings-center.cjs
