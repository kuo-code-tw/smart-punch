name: Verify schedule manual-only edit lock
on:
  pull_request:
    paths:
      - 'schedule/index.html'
      - 'assets/port79-schedule-reference-design.css'
      - 'tests/schedule-reference-design.cjs'
      - 'tests/schedule-two-pages.cjs'
      - 'tests/schedule-lock-manual-only.cjs'
      - 'tests/schedule-roster-editor-value.cjs'
      - '.github/workflows/schedule-manual-edit-lock.yml'
permissions:
  contents: read
jobs:
  manual-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/schedule-lock-manual-only.cjs
      - run: node tests/schedule-roster-editor-value.cjs
      - run: node tests/schedule-edit-lock-lane.cjs
      - run: node tests/schedule-two-pages.cjs
      - run: node tests/schedule-live-month-scope.cjs
      - run: node tests/schedule-reference-design.cjs
