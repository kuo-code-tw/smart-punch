name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
    # Publish only on production source changes or explicit workflow updates.
    # Test-only commits are verified by the regression workflow, not deployed.
    # In Settings > Pages use Source: GitHub Actions to disable the legacy branch Pages publisher.
    paths:
      - 'index.html'
      - 'port79-attendance-core.js'
      - 'assets/**'
      - 'gate-dashboard/**'
      - 'gate-import/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'data-sources/route-service-names.json'
      - 'hr/**'
      - 'settings/**'
      - 'history-data/**'
      - 'data-cache/**'
      - 'scripts/write-port79-site-files.cjs'
      - '.github/workflows/pages-static.yml'
      # Version/packaging changes must publish the same commit as Windows.
      - '.github/workflows/port79-windows-updates.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify vessel dashboard before publishing
        run: |
          node tests/route-service-summary.cjs
          node tests/vessel-dashboard-row-removal.cjs
          node tests/dashboard-working-report-audit.cjs
          node tests/vessel-dashboard-month-scope-20261102.cjs
          node tests/vessel-completion-export-integrity.cjs
          node tests/personnel-current-hr-verification.cjs
          node tests/windows-github-api-rate-limit-fallback.cjs
      - name: Verify complete production regression suite
        shell: bash
        run: |
          set -euo pipefail
          count=0
          fails=0
          for test_file in tests/*.cjs; do
            count=$((count+1))
            test_budget=30s
            if [[ "$test_file" == "tests/efficiency-timeout-readback.cjs" ]]; then test_budget=120s; fi
            if timeout --signal=TERM --kill-after=5s "$test_budget" node "$test_file" > /tmp/port79-last-test.log 2>&1; then
              :
            else
              fails=$((fails+1))
              echo "::error file=${test_file}::Integration regression failed"
              tail -n 20 /tmp/port79-last-test.log || true
            fi
          done
          echo "SUMMARY: $count tests / $fails failed"
          test "$count" -gt 0
          test "$fails" -eq 0
      - name: Stamp the exact published website version
        run: |
          node scripts/write-port79-version.cjs .
          node scripts/write-port79-site-files.cjs .
          node -e "const v=require('./port79-version.json');if(!/^V[0-9]{6}\.[0-9]{5}$/.test(v.version)||!/^[a-f0-9]{40}$/.test(v.commit))process.exit(1)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's artifact metadata listing may lag immediately after upload.
      # Confirm visibility using the same Actions API required by deploy-pages.
      - name: Verify Pages artifact is visible before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -ge 1 ]; then
              echo "PASS: GitHub Pages artifact visible for this run"
              exit 0
            fi
            echo "Pages artifact not yet visible (attempt $attempt/12); retrying metadata"
            sleep 5
          done
          echo "::error::GitHub Pages artifact metadata unavailable; no deployment was attempted"
          exit 1
      # The gh CLI can see the just-uploaded artifact before deploy-pages'
      # separate metadata client can. The previous run showed count=1 but the
      # immediate deploy-pages action saw zero. Give indexes time to converge.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Retry ONLY if the first deployment attempt actually failed. A hard
      # failure here must still block production, never become a false green.
      - name: Retry metadata propagation after deployment failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry GitHub Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

