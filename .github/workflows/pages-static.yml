name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
    # Publish only on production site changes; this workflow edit also verifies the test suite.
    # by other workflows (or the next site publish), not deployed to users.
    # In Settings > Pages use Source: GitHub Actions to disable the legacy branch Pages publisher.
    paths:
      - 'index.html'
      - 'port79-attendance-core.js'
      - 'assets/**'
      - 'gate-dashboard/**'
      - 'gate-import/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'data-sources/route-service-names.json'
      - 'hr/**'
      - 'settings/**'
      - 'history-data/**'
      - 'data-cache/**'
      # Test-only changes run in management-sync; do not republish the live site.
      - '.github/workflows/pages-static.yml'
      # Version/packaging changes must publish the same commit as Windows.
      - '.github/workflows/port79-windows-updates.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Existing main has historical failing tests. A strict all-green gate would
      # block every site release even when a change introduces no regressions.
      # Verify the relevant vessel UI cases and compare *all* tests with the
      # immediate pre-push main instead of silently ignoring existing failures.
      - name: Verify vessel dashboard before publishing
        run: |
          node tests/route-service-summary.cjs
          node tests/vessel-dashboard-row-removal.cjs
          node tests/dashboard-working-report-audit.cjs
          node tests/vessel-dashboard-month-scope-20261102.cjs
          node tests/vessel-completion-export-integrity.cjs
          node tests/personnel-current-hr-verification.cjs
      - name: Verify no new production regressions against previous main
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" 'HEAD^1'
          run_suite() {
            local folder="$1" output="$2" label="$3" count=0 fails=0
            : > "$output"
            pushd "$folder" >/dev/null
            for test_file in tests/*.cjs; do
              count=$((count+1))
              # The vessel cloud readback regression exercises a 90-second timeout budget;
              # keep assertions intact and allow that one fixture to finish rather than kill it at 30s.
              local test_budget=30s
              if [[ "$test_file" == "tests/efficiency-timeout-readback.cjs" ]]; then test_budget=120s; fi
              if timeout --signal=TERM --kill-after=5s "$test_budget" node "$test_file" > /tmp/port79-last-test.log 2>&1; then
                :
              else
                fails=$((fails+1))
                echo "$test_file" >> "$output"
                echo "$label FAILED: $test_file"
                tail -n 5 /tmp/port79-last-test.log || true
              fi
            done
            popd >/dev/null
            LC_ALL=C sort -u "$output" -o "$output"
            echo "$label SUMMARY: $count tests / $fails failed"
          }
          run_suite "$baseline_dir" /tmp/p79-before-failures.txt BEFORE
          run_suite "$GITHUB_WORKSPACE" /tmp/p79-after-failures.txt AFTER
          LC_ALL=C comm -13 /tmp/p79-before-failures.txt /tmp/p79-after-failures.txt > /tmp/p79-new-failures.txt
          if [ -s /tmp/p79-new-failures.txt ]; then
            echo "::error::New regressions prevent production deployment"
            cat /tmp/p79-new-failures.txt
            exit 1
          fi
          echo 'PASS: No new failing tests compared with previous production main'
      - name: Stamp the exact published website version
        run: |
          node scripts/write-port79-version.cjs .
          node -e "const v=require('./port79-version.json');if(!/^V[0-9]{6}\.[0-9]{5}$/.test(v.version)||!/^[a-f0-9]{40}$/.test(v.commit))process.exit(1)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub's artifact metadata listing may lag immediately after upload.
      # Confirm visibility using the same Actions API required by deploy-pages.
      - name: Verify Pages artifact is visible before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name=="github-pages" and .expired==false)] | length' 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ ]] && [ "$count" -ge 1 ]; then
              echo "PASS: GitHub Pages artifact visible for this run"
              exit 0
            fi
            echo "Pages artifact not yet visible (attempt $attempt/12); retrying metadata"
            sleep 5
          done
          echo "::error::GitHub Pages artifact metadata unavailable; no deployment was attempted"
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

