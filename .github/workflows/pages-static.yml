name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
    # Publish only on production site changes; this workflow edit also verifies the test suite.
    # by other workflows (or the next site publish), not deployed to users.
    paths:
      - 'index.html'
      - 'port79-attendance-core.js'
      - 'assets/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'hr/**'
      - 'history-data/**'
      - 'data-cache/**'
      - '.github/workflows/pages-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify combined system regressions
        run: |
          for test_file in tests/*.cjs; do
            node "$test_file" || exit 1
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

