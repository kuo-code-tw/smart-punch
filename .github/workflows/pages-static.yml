name: Publish static site to GitHub Pages

on:
  push:
    branches: [main]
    # Publish only on production site changes; this workflow edit also verifies the test suite.
    # by other workflows (or the next site publish), not deployed to users.
    # In Settings > Pages use Source: GitHub Actions to disable the legacy branch Pages publisher.
    paths:
      - 'index.html'
      - 'port79-attendance-core.js'
      - 'assets/**'
      - 'gate-dashboard/**'
      - 'gate-import/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'hr/**'
      - 'history-data/**'
      - 'data-cache/**'
      # Keep the deployment gate verifiable when a regression harness is repaired.
      - 'tests/**'
      - '.github/workflows/pages-static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Existing main has historical failing tests. A strict all-green gate would
      # block every site release even when a change introduces no regressions.
      # Verify the relevant vessel UI cases and compare *all* tests with the
      # immediate pre-push main instead of silently ignoring existing failures.
      - name: Verify vessel dashboard before publishing
        run: |
          node tests/route-service-summary.cjs
          node tests/vessel-dashboard-row-removal.cjs
          node tests/dashboard-working-report-audit.cjs
          node tests/vessel-dashboard-month-scope-20261102.cjs
          node tests/vessel-completion-export-integrity.cjs
      - name: Verify no new production regressions against previous main
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" 'HEAD^1'
          run_suite() {
            local folder="$1" output="$2" label="$3" count=0 fails=0
            : > "$output"
            pushd "$folder" >/dev/null
            for test_file in tests/*.cjs; do
              count=$((count+1))
              if timeout --signal=TERM --kill-after=5s 30s node "$test_file" > /tmp/port79-last-test.log 2>&1; then
                :
              else
                fails=$((fails+1))
                echo "$test_file" >> "$output"
                echo "$label FAILED: $test_file"
                tail -n 5 /tmp/port79-last-test.log || true
              fi
            done
            popd >/dev/null
            LC_ALL=C sort -u "$output" -o "$output"
            echo "$label SUMMARY: $count tests / $fails failed"
          }
          run_suite "$baseline_dir" /tmp/p79-before-failures.txt BEFORE
          run_suite "$GITHUB_WORKSPACE" /tmp/p79-after-failures.txt AFTER
          LC_ALL=C comm -13 /tmp/p79-before-failures.txt /tmp/p79-after-failures.txt > /tmp/p79-new-failures.txt
          if [ -s /tmp/p79-new-failures.txt ]; then
            echo "::error::New regressions prevent production deployment"
            cat /tmp/p79-new-failures.txt
            exit 1
          fi
          echo 'PASS: No new failing tests compared with previous production main'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

