name: Verify attendance anomaly and punch pairing

on:
  push:
    branches: [main]
    paths:
      - 'attendance/index.html'
      - 'tests/attendance-gps-save-abort-recovery.cjs'
      - 'tests/attendance-gps-config-locations.cjs'
      - 'attendance/v6-engine.js'
      - 'work-hours/index.html'
      - 'tests/attendance-oct02-anomaly-filter.cjs'
      - 'tests/attendance-ship-early-workday.cjs'
      - 'tests/attendance-cross-day-tooltip.cjs'
      - 'tests/attendance-month-view.cjs'
      - 'tests/workhours-attendance-filter-consistency.cjs'
      - '.github/workflows/verify-attendance-anomaly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check October 2 orphan punches and filter consistency
        run: |
          node tests/attendance-ship-early-workday.cjs
          node tests/attendance-cross-day-tooltip.cjs
          node tests/attendance-oct02-anomaly-filter.cjs
          node tests/workhours-attendance-filter-consistency.cjs
          node tests/attendance-bounded-render.cjs
          node tests/attendance-month-view.cjs
          node tests/attendance-gps-config-locations.cjs
          node tests/attendance-gps-save-abort-recovery.cjs
