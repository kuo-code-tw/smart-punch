name: Verify archived-month read-only bridge
on:
  pull_request:
    paths:
      - 'backend/history-module-month-readonly.gs'
      - 'assets/port79-history-month-inline.js'
      - 'tests/history-all-system-readonly.cjs'
      - '.github/workflows/history-archive-readonly.yml'
permissions:
  contents: read
jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/history-all-system-readonly.cjs
