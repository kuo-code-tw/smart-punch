name: Verify homepage attendance audit editor

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/port79-home-early-punch-alert.js'
      - 'assets/port79-home-audit-inline-editor.js'
      - 'assets/port79-login-version-check.js'
      - 'assets/port79-monthly-dashboard.js'
      - 'assets/port79-attendance-audit-handoff.js'
      - 'attendance/index.html'
      - 'assets/port79-monthly-dashboard.css'
      - 'tests/home-roster-audit-embedded-editor.cjs'
      - 'tests/home-audit-punch-inline-pencil.cjs'
      - 'tests/home-inline-attendance-bridge.cjs'
      - 'tests/attendance-home-audit-handoff.cjs'
      - 'tests/home-early-shift-punch-alert.cjs'
      - 'tests/home-punch-priority-deadline.cjs'
      - 'tests/home-login-version-fast-audit.cjs'
      - '.github/workflows/home-roster-audit-editor.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/port79-home-early-punch-alert.js'
      - 'assets/port79-home-audit-inline-editor.js'
      - 'assets/port79-login-version-check.js'
      - 'assets/port79-monthly-dashboard.js'
      - 'assets/port79-attendance-audit-handoff.js'
      - 'attendance/index.html'
      - 'assets/port79-monthly-dashboard.css'
      - 'tests/home-roster-audit-embedded-editor.cjs'
      - 'tests/home-audit-punch-inline-pencil.cjs'
      - 'tests/home-inline-attendance-bridge.cjs'
      - 'tests/attendance-home-audit-handoff.cjs'
      - 'tests/home-early-shift-punch-alert.cjs'
      - 'tests/home-punch-priority-deadline.cjs'
      - 'tests/home-login-version-fast-audit.cjs'
      - '.github/workflows/home-roster-audit-editor.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm edit access, existing official editor and cloud recheck
        run: |
          node tests/home-roster-audit-embedded-editor.cjs
          node tests/home-audit-punch-inline-pencil.cjs
          node tests/home-inline-attendance-bridge.cjs
          node tests/attendance-home-audit-handoff.cjs
          node tests/windows-download-link.cjs
          node tests/home-early-shift-punch-alert.cjs
          node tests/home-punch-priority-deadline.cjs
          node tests/home-login-version-fast-audit.cjs
          node tests/attendance-editor-opening.cjs
          node tests/attendance-manual-picker.cjs
