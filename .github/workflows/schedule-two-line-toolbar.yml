name: Verify schedule two-line toolbar (visual only)
on:
  pull_request:
    paths:
      - 'schedule/index.html'
      - 'assets/port79-schedule-two-line-toolbar.js'
      - 'assets/port79-schedule-two-line-toolbar.css'
      - 'tests/schedule-two-line-toolbar.cjs'
      - '.github/workflows/schedule-two-line-toolbar.yml'
  push:
    branches: [main]
    paths:
      - 'schedule/index.html'
      - 'assets/port79-schedule-two-line-toolbar.js'
      - 'assets/port79-schedule-two-line-toolbar.css'
      - 'tests/schedule-two-line-toolbar.cjs'
      - '.github/workflows/schedule-two-line-toolbar.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/schedule-two-line-toolbar.cjs
      - run: node tests/schedule-two-pages.cjs
      - run: node tests/leave-reference-visual-only.cjs
