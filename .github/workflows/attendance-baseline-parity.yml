name: Verify attendance integration regressions against main baseline
on:
  pull_request:
    paths:
      - 'attendance/**'
      - 'work-hours/**'
      - 'assets/port79-attendance-overtime.js'
      - 'tests/**'
      - '.github/workflows/attendance-baseline-parity.yml'
permissions:
  contents: read
jobs:
  baseline-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full test suite on clean main and candidate, block new failures
        shell: bash
        run: |
          set -euo pipefail
          baseline_dir="$(mktemp -d)"
          git worktree add --detach "$baseline_dir" origin/main
          run_suite() {
            local folder="$1" output="$2" label="$3" n=0 failed=0
            : > "$output"
            pushd "$folder" >/dev/null
            for test_file in tests/*.cjs; do
              n=$((n+1))
              if timeout --signal=TERM --kill-after=5s 30s node "$test_file" >/tmp/p79-parity-last-test.log 2>&1; then
                :
              else
                failed=$((failed+1))
                printf '%s\n' "$test_file" >> "$output"
                echo "$label FAILED: $test_file"
                tail -n 6 /tmp/p79-parity-last-test.log || true
              fi
            done
            popd >/dev/null
            LC_ALL=C sort -u "$output" -o "$output"
            echo "$label SUMMARY: $n tests / $failed failed"
          }
          run_suite "$baseline_dir" /tmp/p79-main-failures.txt MAIN
          run_suite "$GITHUB_WORKSPACE" /tmp/p79-candidate-failures.txt CANDIDATE
          LC_ALL=C comm -13 /tmp/p79-main-failures.txt /tmp/p79-candidate-failures.txt > /tmp/p79-new-failures.txt
          LC_ALL=C comm -23 /tmp/p79-main-failures.txt /tmp/p79-candidate-failures.txt > /tmp/p79-fixed-failures.txt
          echo '=== New regressions relative to main ==='
          cat /tmp/p79-new-failures.txt
          echo '=== Fixed former main failures ==='
          cat /tmp/p79-fixed-failures.txt
          echo '=== Detailed baseline ==='
          echo "baseline failures: $(wc -l </tmp/p79-main-failures.txt)"
          echo "candidate failures: $(wc -l </tmp/p79-candidate-failures.txt)"
          echo "new failures: $(wc -l </tmp/p79-new-failures.txt)"
          if [ -s /tmp/p79-new-failures.txt ]; then
            echo "::error::New integration regressions detected versus main"
            exit 1
          fi
          echo 'PASS: Candidate introduced no new failing tests versus main.'
