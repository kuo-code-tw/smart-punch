name: Verify workhours local-first load and data safety

on:
  push:
    branches: [main]
    paths:
      - 'work-hours/index.html'
      - 'assets/port79-workhours-cache.js'
      - 'assets/port79-workhours-reference-dashboard.js'
      - 'tests/workhours-local-first-speed.cjs'
      - 'tests/workhours-verified-cache.cjs'
      - 'tests/workhours-reference-dashboard.cjs'
      - 'tests/workhours-application-ops-kpis.cjs'
      - 'tests/workhours-no-spurious-refresh.cjs'
      - 'tests/overtime-load-speed.cjs'
      - '.github/workflows/workhours-local-first-speed.yml'
  pull_request:
    paths:
      - 'work-hours/index.html'
      - 'assets/port79-workhours-cache.js'
      - 'assets/port79-workhours-reference-dashboard.js'
      - 'tests/workhours-local-first-speed.cjs'
      - 'tests/workhours-verified-cache.cjs'
      - 'tests/workhours-reference-dashboard.cjs'
      - 'tests/workhours-application-ops-kpis.cjs'
      - 'tests/workhours-no-spurious-refresh.cjs'
      - 'tests/overtime-load-speed.cjs'
      - '.github/workflows/workhours-local-first-speed.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cached local display and zero duplicated cloud reads
        run: node tests/workhours-local-first-speed.cjs
      - name: Verify secure warm-start and versioned cache
        run: node tests/workhours-verified-cache.cjs
      - name: Verify current-month fast path and read coalescing
        run: node tests/overtime-load-speed.cjs
      - name: Verify original screenshot and permission guard
        run: node tests/workhours-reference-dashboard.cjs
      - name: Verify scoped official application operational KPIs
        run: node tests/workhours-application-ops-kpis.cjs
      - name: Verify no flicker without real HR or attendance changes
        run: node tests/workhours-no-spurious-refresh.cjs
      - name: Verify editing and read pressure guards
        run: |
          node tests/workhours-attendance-render-lock-pressure.cjs
          node tests/workhours-admin-session-stability.cjs
