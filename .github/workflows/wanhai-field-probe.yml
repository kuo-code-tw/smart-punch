name: Probe WAN HAI schedule work-time fields
on:
  push:
    branches: [main]
    paths: ['tests/wanhai-fields-probe.cjs','.github/workflows/wanhai-field-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/wanhai-fields-probe.cjs
