name: Verify no-punch attendance-first roster
on:
  pull_request:
    paths:
      - 'schedule/index.html'
      - 'tests/schedule-no-punch-rest-display.cjs'
      - 'tests/schedule-november-early-month-no-punch.cjs'
      - 'tests/rest-oct31-nextday-punch-isolation.cjs'
      - 'tests/schedule-night-split-auto.cjs'
      - 'tests/schedule-pre08-extension-regular-shift.cjs'
      - 'assets/port79-schedule-punch-restore.js'
      - 'tests/schedule-national-zero-quota.cjs'
      - 'assets/port79-schedule-rest-evidence.js'
      - 'assets/port79-rest-allocation.js'
      - 'assets/port79-monthly-rest-overtime.js'
      - '.github/workflows/schedule-no-punch-rest.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/schedule-night-split-auto.cjs
      - run: node tests/schedule-national-zero-quota.cjs
      - run: node tests/schedule-pre08-extension-regular-shift.cjs
      - run: node tests/schedule-short-punch-date-display.cjs
      - run: node tests/schedule-overtime-accounting-date.cjs
      - run: node tests/schedule-november-early-month-no-punch.cjs
      - run: node tests/schedule-zero-punch-dual-source.cjs
      - run: node tests/schedule-all-staff-zero-punch.cjs
      - run: node tests/rest-oct31-nextday-punch-isolation.cjs
      - run: node tests/monthly-rest-grouped-plan.cjs
      - run: node tests/rest-attendance.cjs
      - run: node tests/schedule-verified-no-work-overtime-rest.cjs
      - run: node tests/schedule-attendance-display-priority.cjs
      - run: node tests/schedule-emergency-no-mass-rest.cjs
      - run: node tests/schedule-rest-unverified-overtime.cjs
      - run: node tests/schedule-no-punch-rest-display.cjs
      - run: node tests/schedule-november-render-fallback.cjs
      - run: node tests/october-system-roster-overtime.cjs
      - run: node tests/vessel-completion-export-integrity.cjs
