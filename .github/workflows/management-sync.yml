name: Verify management synchronization
on:
  # Tests and backend-only changes should be verified without redeploying the live website.
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/management-sync.yml'
  pull_request:
    paths:
      - 'integration-test/**'
      - 'assets/port79-attendance-core.js'
      - 'assets/port79-data-cache.js'
      - 'assets/port79-management-link.js'
      - 'hr/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'history-data/**'
      - 'tests/**'
      - '.github/workflows/management-sync.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    name: Full regression (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    env:
      SHARD: ${{ matrix.shard }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only archive reader
        run: npm install --no-save --no-package-lock --ignore-scripts jszip@3.10.1
      - name: Run all integration tests and report every failure
        run: |
          set -euo pipefail
          failed=0
          total=0
          for test_file in tests/*.cjs; do
            # The expensive 18,000-row comparison has its own runner. Other tests
            # are assigned by stable filename checksum, identically for main and PR.
            if [ "$test_file" = "tests/vessel-speed.cjs" ]; then
              lane=0
            else
              checksum=$(printf '%s' "$test_file" | cksum | cut -d' ' -f1)
              lane=$((1 + checksum % 4))
            fi
            [ "$lane" -eq "$SHARD" ] || continue
            total=$((total+1))
            echo "::group::${test_file}"
            # The dedicated 18,000-row legacy comparison is a CPU benchmark, not a normal unit test.
            limit=30s
            if [ "$test_file" = "tests/vessel-speed.cjs" ]; then limit=180s; fi
            if timeout --signal=TERM --kill-after=5s "$limit" node "$test_file"; then
              :
            else
              echo "::error file=${test_file}::Integration regression failed"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "Shard ${SHARD}: ${total} tests / ${failed} failed"
          test "$total" -gt 0
          echo "Total failing tests: ${failed}"
          test "${failed}" -eq 0
