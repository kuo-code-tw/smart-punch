name: Verify management synchronization
on:
  # Tests and backend-only changes should be verified without redeploying the live website.
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'backend/**'
      - '.github/workflows/management-sync.yml'
  pull_request:
    paths:
      - 'integration-test/**'
      - 'assets/port79-attendance-core.js'
      - 'assets/port79-data-cache.js'
      - 'assets/port79-management-link.js'
      - 'hr/**'
      - 'attendance/**'
      - 'leave/**'
      - 'schedule/**'
      - 'work-hours/**'
      - 'aqc-efficiency/**'
      - 'history-data/**'
      - 'tests/**'
      - '.github/workflows/management-sync.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all integration tests and report every failure
        run: |
          failed=0
          for test_file in tests/*.cjs; do
            echo "::group::${test_file}"
            if timeout --signal=TERM --kill-after=5s 30s node "$test_file"; then
              :
            else
              echo "::error file=${test_file}::Integration regression failed"
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          done
          echo "Total failing tests: ${failed}"
          test "${failed}" -eq 0
