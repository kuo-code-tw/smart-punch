name: Verify confirmed overtime visibility
on:
  pull_request:
    paths:
      - 'work-hours/index.html'
      - 'tests/overtime-pending-attendance.cjs'
      - 'tests/overtime-planned-separate-section.cjs'
      - 'tests/overtime-planned-review-action.cjs'
      - 'tests/overtime-pending-reasons-punch-edit.cjs'
      - 'tests/overtime-pending-metrics-speed.cjs'
      - 'tests/overtime-visible-ledger-total.cjs'
      - 'tests/overtime-existing-record-controls.cjs'
      - 'tests/overtime-leave-cover-extension-periods.cjs'
      - 'tests/overtime-extension-cross-midnight-workdate.cjs'
      - 'tests/overtime-edit-action.cjs'
      - 'tests/overtime-confirmed-report-auto-close.cjs'
      - 'assets/port79-workhours-cache.js'
      - 'assets/port79-overtime-report.js'
      - '.github/workflows/confirmed-overtime-visibility.yml'
  push:
    branches: [main]
    paths:
      - 'work-hours/index.html'
      - 'tests/overtime-pending-attendance.cjs'
      - 'tests/overtime-planned-separate-section.cjs'
      - 'tests/overtime-planned-review-action.cjs'
      - 'tests/overtime-pending-reasons-punch-edit.cjs'
      - 'tests/overtime-pending-metrics-speed.cjs'
      - 'tests/overtime-visible-ledger-total.cjs'
      - 'tests/overtime-existing-record-controls.cjs'
      - 'tests/overtime-leave-cover-extension-periods.cjs'
      - 'tests/overtime-extension-cross-midnight-workdate.cjs'
      - 'tests/overtime-edit-action.cjs'
      - 'tests/overtime-confirmed-report-auto-close.cjs'
      - 'assets/port79-workhours-cache.js'
      - 'assets/port79-overtime-report.js'
      - '.github/workflows/confirmed-overtime-visibility.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify planned vs official reports
        run: |
          node tests/overtime-pending-attendance.cjs
          node tests/overtime-planned-separate-section.cjs
          node tests/overtime-planned-review-action.cjs
          node tests/overtime-pending-reasons-punch-edit.cjs
          node tests/overtime-edit-action.cjs
          node tests/overtime-confirmed-report-auto-close.cjs
          node tests/overtime-original-id-sync.cjs
          node tests/overtime-batch-save-context.cjs
          node tests/overtime-status-live.cjs
          node tests/overtime-pending-metrics-speed.cjs
          node tests/overtime-visible-ledger-total.cjs
          node tests/overtime-existing-record-controls.cjs
          node tests/overtime-leave-cover-extension-periods.cjs
          node tests/overtime-extension-cross-midnight-workdate.cjs
          node tests/overtime-load-speed.cjs
          node tests/workhours-verified-cache.cjs
