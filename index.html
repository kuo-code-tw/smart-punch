<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>前往新版79號碼頭系統</title>
<link rel="canonical" href="https://kuo-code-tw.github.io/smart-punch/">
<script>
(function(){
  if(location.hostname!=='kuoyalun.github.io')return;
  const target=new URL(location.href);
  target.protocol='https:';target.hostname='kuo-code-tw.github.io';target.port='';target.username='';target.password='';
  // Keep page/filter state; authentication credentials stay at their original origin.
  const secret=/^(?:token|userToken|gcToken|adminToken|access_token|id_token|refresh_token|password|code|auth)$/i;
  for(const key of [...target.searchParams.keys()])if(secret.test(key))target.searchParams.delete(key);
  if(/(?:^|[?&#])(?:access_token|id_token|refresh_token|token|userToken|gcToken|adminToken)=/i.test(target.hash))target.hash='';
  location.replace(target.href);
})();
</script>
