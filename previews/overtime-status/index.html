<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加班申報狀態｜試做版</title><script src="../../assets/port79-overtime-status-preview.js?v=20261022"></script><style>
:root{font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#17304c;background:#f1f5f9;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#102c49;color:white;padding:22px max(24px,calc((100vw - 1440px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:23px;margin:0 0 7px}header p{color:#c4d3e1;margin:0;font-size:13px}.demo{background:#fff4d7;border:1px solid #ead7a5;color:#715007;padding:9px 13px;border-radius:8px;white-space:nowrap;font-weight:700}main{max-width:1488px;margin:24px auto;padding:0 24px}.notice{color:#6d5322;background:#fff9e9;border:1px solid #e8dab3;border-radius:10px;padding:12px 16px;margin-bottom:18px;line-height:1.6}.panel{background:white;border:1px solid #dce4ee;border-radius:14px;box-shadow:0 5px 25px #15375408;padding:20px}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:17px}h2{font-size:18px;margin:0}.muted{color:#65798e;font-size:12px;line-height:1.6}.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap;background:#f8fafc;padding:14px;border-radius:10px;border:1px solid #e5ebf2}label{font-size:12px;color:#566b82;display:grid;gap:6px;min-width:150px}input,select{border:1px solid #ccd7e4;border-radius:7px;padding:9px 11px;font:inherit;color:#17304c;background:white;min-height:39px}input[type=checkbox]{min-height:0;width:16px;height:16px;accent-color:#18645d}button{border:1px solid #cdd8e5;border-radius:7px;padding:9px 13px;background:white;color:#254461;font:inherit;font-weight:700;cursor:pointer}button:hover{background:#f0f5fa}button:disabled{opacity:.45;cursor:default}.primary{background:#b83c48;color:white;border-color:#b83c48}.primary:hover{background:#a62e3b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}.tab{padding:9px 15px;border-radius:8px;font-size:13px}.tab[aria-pressed=true]{outline:2px solid #c1d4e5;border-color:#6183a2;background:#eef5fb}.tab.review{color:#a52b39}.tab.revoked{color:#687487}.count{display:inline-block;margin-left:6px;border-radius:5px;background:#eaf0f5;padding:1px 6px;font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}.actions{display:flex;gap:8px;align-items:center}.actions label{display:flex;align-items:center;gap:6px;min-width:0}.tablewrap{overflow-x:auto;border:1px solid #e0e7ef;border-radius:9px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th{background:#edf3f9;color:#506781;font-size:12px;text-align:left;padding:13px 12px}td{padding:14px 12px;border-top:1px solid #e9eef4}tbody tr:hover{background:#f9fbfd}.person{font-weight:700}.badge{border:1px solid;padding:5px 9px;border-radius:6px;font-weight:700;font-size:12px;display:inline-block}.badge.reported{background:#e8f7f0;color:#19734e;border-color:#bfe7d2}.badge.review{background:#fff0f1;color:#b02d40;border-color:#f0c8cf}.badge.revoked{background:#f0f2f5;color:#677386;border-color:#d9dfe7}.statuscell{display:flex;align-items:center;gap:7px}.reported-prefix{font-size:12px;color:#718296}.excess{color:#b02d40;font-weight:700}.small{font-size:12px;padding:5px 10px}.empty{text-align:center;padding:35px;color:#74859a}#message{min-height:26px;color:#24736a;padding-top:6px;font-size:13px}#message.error{color:#b02d40}dialog{border:1px solid #d2dce8;border-radius:13px;width:min(620px,calc(100vw - 32px));padding:24px;color:#17304c;box-shadow:0 20px 80px #16344b33}dialog::backdrop{background:#0d263d66}dialog h3{font-size:20px;margin:0 0 15px}dialog p{line-height:1.8;margin:10px 0}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px}dl{display:grid;grid-template-columns:100px 1fr;gap:12px;margin:18px 0}dt{color:#738397}dd{margin:0;font-weight:600;overflow-wrap:anywhere}footer{margin-top:15px;font-size:12px;color:#6f8197}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:700px){header{align-items:start;padding:20px;flex-direction:column}main{padding:0 12px}.panel{padding:14px}.heading,.toolbar{align-items:start;flex-direction:column}.filters label{flex:1}.actions{flex-wrap:wrap}h1{font-size:20px}}
</style></head><body><header><div><h1>加班申報狀態核對</h1><p>79號碼頭雲端智慧系統 · 版面與流程試做</p></div><span class="demo">示範資料｜未連接正式申報</span></header><main><div class="notice">在「已申報」旁標出休假超額狀態。待核對僅作提醒，確認撤銷成功後才顯示「休假超額・已撤銷」，並保留原申報與處理紀錄。</div><section class="panel"><div class="heading"><h2>已申報加班</h2><button id="reset">重設示範資料</button></div><div class="filters"><label>月份<input id="month" type="month" value="2026-10"></label><label>姓名／工號<input id="name" placeholder="搜尋示範人員"></label><label>假別<select id="category"><option value="">全部假別</option><option>例</option><option>休</option><option>國</option><option>延</option><option>代</option></select></label><label>申報狀態<select id="status"><option value="">全部狀態</option><option value="reported">已申報</option><option value="review">休假超額・待核對</option><option value="revoked">休假超額・已撤銷</option></select></label><button id="clear">清除篩選</button></div><div class="tabs" aria-label="申報狀態快速篩選"><button class="tab" data-status="" aria-pressed="true">全部<span class="count" id="count-all"></span></button><button class="tab" data-status="reported" aria-pressed="false">已申報<span class="count" id="count-reported"></span></button><button class="tab review" data-status="review" aria-pressed="false">🔴 休假超額・待核對<span class="count" id="count-review"></span></button><button class="tab revoked" data-status="revoked" aria-pressed="false">⚪ 休假超額・已撤銷<span class="count" id="count-revoked"></span></button></div><div class="toolbar"><div><strong id="resultCount"></strong><div class="muted">超額者的相關申報列為候選，須由管理員核對實際要撤銷哪一筆。</div></div><div class="actions"><label>測試回應<select id="outcome"><option value="success">模擬成功</option><option value="failure">模擬失敗</option><option value="timeout">模擬逾時</option></select></label><button class="primary" id="revoke" disabled>撤銷勾選申報（0）</button></div></div><div class="tablewrap"><table><thead><tr><th><input id="selectAll" type="checkbox" aria-label="勾選目前篩選的待核對申報"></th><th>申報日期</th><th>姓名／工號</th><th>加班類型</th><th>申報時段</th><th>申報時數</th><th>休假核對</th><th>申報狀態</th><th>處理紀錄</th></tr></thead><tbody id="rows"></tbody></table></div><div id="message" role="status" aria-live="polite"></div><footer>已撤銷的原申報保留查詢，試做統計中不列入有效加班；此頁所有撤銷操作均為模擬。</footer></section></main><dialog id="confirm"><h3>確認模擬撤銷</h3><p>以下申報將標示為「休假超額・已撤銷」。原申報內容會保留，並記錄原因、撤銷人及時間。</p><div id="confirmRows"></div><p class="muted">這是試做版，不會刪除或修改正式資料。</p><div class="dialog-actions"><button id="cancel">先不要</button><button id="commit" class="primary">確認模擬撤銷</button></div></dialog><dialog id="details"><h3>申報與處理紀錄</h3><div id="detailBody"></div><div class="dialog-actions"><button id="closeDetails">關閉</button></div></dialog><script>
'use strict';
const model=window.P79OvertimeStatusPreview,$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=[
{id:'DEMO-101',empId:'TEST001',name:'陳示範',date:'2026-10-16',category:'休',type:'休息日加班',period:'08–16',hours:8,excessDays:0},
{id:'DEMO-102',empId:'TEST002',name:'林測試',date:'2026-10-17',category:'休',type:'休息日加班',period:'16–24',hours:8,excessDays:1},
{id:'DEMO-103',empId:'TEST002',name:'林測試',date:'2026-10-19',category:'休',type:'休息日加班',period:'08–16',hours:8,excessDays:1},
{id:'DEMO-104',empId:'TEST003',name:'王範例',date:'2026-10-18',category:'國',type:'國定假日加班',period:'24–08（跨日）',hours:8,excessDays:1},
{id:'DEMO-105',empId:'TEST004',name:'李示範',date:'2026-10-20',category:'延',type:'平日延長加班',period:'16–20',hours:4,excessDays:0},
{id:'DEMO-106',empId:'TEST005',name:'張測試',date:'2026-10-15',category:'休',type:'休息日加班',period:'08–16',hours:8,excessDays:1,revocation:{confirmed:true,reportId:'DEMO-106',reason:'休假超額',actor:'示範管理員',at:'2026/10/21 15:30'}},
{id:'DEMO-107',empId:'TEST006',name:'黃範例',date:'2026-10-21',category:'例',type:'例假加班',period:'08–16',hours:8,excessDays:1}
];
let rows=structuredClone(seed),selected=new Set(),busy=false,visible=[];
const query=()=>({status:$('status').value,category:$('category').value,month:$('month').value,name:$('name').value});
function message(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error);}
function paint(){
 const q=query(),base=model.filter(rows,{...q,status:''}),counts=model.counts(base);visible=model.filter(rows,q);
 for(const key of ['all','reported','review','revoked'])$('count-'+key).textContent=counts[key];
 document.querySelectorAll('[data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===q.status)));
 $('rows').innerHTML=visible.map(r=>{const status=model.status(r);return '<tr><td>'+(status==='review'?'<input type="checkbox" data-pick="'+r.id+'" aria-label="勾選 '+esc(r.name)+' '+r.date+'" '+(selected.has(r.id)?'checked':'')+(busy?' disabled':'')+'>':'')+'</td><td>'+r.date+'</td><td><div class="person">'+r.name+'</div><span class="muted">'+r.empId+'</span></td><td>'+r.type+'</td><td>'+r.period+'</td><td>'+r.hours+' 小時</td><td class="'+(status==='review'?'excess':'muted')+'">'+(status==='review'?r.category+' 超額 '+r.excessDays+' 天':status==='revoked'?'已完成處理':'無超額提醒')+'</td><td><div class="statuscell">'+(status==='review'?'<span class="reported-prefix">已申報</span>':'')+'<span class="badge '+status+'">'+model.labels[status]+'</span></div></td><td><button class="small" data-detail="'+r.id+'">'+(status==='revoked'?'查看撤銷紀錄':'查看申報')+'</button></td></tr>';}).join('')||'<tr><td class="empty" colspan="9">沒有符合條件的申報</td></tr>';
 $('resultCount').textContent='符合條件 '+visible.length+' 筆';updateSelection();
}
function updateSelection(){const eligible=visible.filter(r=>model.status(r)==='review'),picked=eligible.filter(r=>selected.has(r.id));$('revoke').textContent='撤銷勾選申報（'+selected.size+'）';$('revoke').disabled=busy||!selected.size;$('selectAll').checked=eligible.length>0&&eligible.every(r=>selected.has(r.id));$('selectAll').indeterminate=picked.length>0&&picked.length<eligible.length;$('selectAll').disabled=busy||!eligible.length;}
function changed(){selected.clear();paint();message('');}
for(const id of ['month','category','status'])$(id).onchange=changed;$('name').oninput=changed;
document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{$('status').value=b.dataset.status;changed();});
$('clear').onclick=()=>{$('name').value=$('category').value=$('status').value='';$('month').value='2026-10';changed();};
$('reset').onclick=()=>{rows=structuredClone(seed);selected.clear();$('clear').click();message('示範資料已重設。');};
$('rows').onchange=e=>{const id=e.target.dataset.pick;if(!id||busy)return;e.target.checked?selected.add(id):selected.delete(id);updateSelection();};
$('selectAll').onchange=()=>{visible.filter(r=>model.status(r)==='review').forEach(r=>$('selectAll').checked?selected.add(r.id):selected.delete(r.id));paint();};
$('rows').onclick=e=>{const id=e.target.closest('[data-detail]')?.dataset.detail;if(!id)return;const r=rows.find(r=>r.id===id),audit=r.revocation,fields=[['原申報編號',r.id],['人員',r.name+'（'+r.empId+'）'],['申報日期',r.date],['加班類型',r.type],['申報時段',r.period],['原申報時數',r.hours+' 小時'],['目前狀態',model.labels[model.status(r)]]];if(model.status(r)==='revoked')fields.push(['撤銷原因',audit.reason],['撤銷人',audit.actor],['撤銷時間',audit.at]);$('detailBody').innerHTML='<dl>'+fields.map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd>').join('')+'</dl>';$('details').showModal();};
$('closeDetails').onclick=()=>$('details').close();$('cancel').onclick=()=>$('confirm').close();
$('revoke').onclick=()=>{if(busy||!selected.size)return;$('confirmRows').innerHTML=rows.filter(r=>selected.has(r.id)).map(r=>'<p><strong>'+esc(r.name)+'</strong>　'+r.date+'　'+r.type+'　'+r.period+'</p>').join('');$('confirm').showModal();};
function lock(on){busy=on;document.querySelectorAll('.filters input,.filters select,.filters button,.tabs button,#reset,#outcome,#commit,#cancel').forEach(n=>n.disabled=on);paint();}
$('commit').onclick=async()=>{
 if(busy)return;const outcome=$('outcome').value,ids=[...selected];$('confirm').close();lock(true);let count=0;
 try{for(const id of ids){const index=rows.findIndex(r=>r.id===id),old=rows[index];if(model.status(old)!=='review')continue;message('正在模擬撤銷：'+old.name+' '+old.date);const next=await model.revoke(old,async payload=>{await new Promise(resolve=>setTimeout(resolve,350));if(outcome!=='success')throw Error(outcome==='timeout'?'模擬逾時：撤銷結果未確認，原申報保留':'模擬失敗：雲端未確認撤銷，原申報保留');return {ok:true,confirmed:true,...payload,actor:'示範管理員',at:new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'medium'}).format(new Date())};});rows=model.apply(rows,next);selected.delete(id);count++;
 // A category's excess belongs to the employee/month, not to every candidate report.
 for(const chosen of [...selected])if(model.status(rows.find(r=>r.id===chosen))!=='review')selected.delete(chosen);
 if(rows.filter(r=>ids.includes(r.id)&&model.status(r)==='review').length===0)break;
 }message('模擬撤銷成功 '+count+' 筆，勾選已取消。可切換「休假超額・已撤銷」查看紀錄。');}
 catch(e){message((count?'已確認 '+count+' 筆；':'')+e.message+'。未確認的申報不會顯示已撤銷。',true);}finally{lock(false);}
};paint();
</script></body></html>
