<script>
(function(){
'use strict';
const GAS_DEFAULT='https://script.google.com/macros/s/AKfycbzPD0v8QQol_7cMuMUFGnjHxo-9jFnRLEwoWQhW-n3g5GlbbHnaL7EhRAtcymUcdYOEzg/exec';
const $=id=>document.getElementById(id);let type='attendance';
let historyLoaded=null;
let historyXlsxPromise=null;
const scheduleStyle=document.createElement('style');scheduleStyle.textContent=window.P79HistorySchedule.css;document.head.appendChild(scheduleStyle);
function historyXlsx(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  if(historyXlsxPromise)return historyXlsxPromise;
  historyXlsxPromise=new Promise((resolve,reject)=>{
    const script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    script.onload=()=>window.XLSX?resolve(window.XLSX):reject(new Error('試算表 套件載入失敗'));
    script.onerror=()=>reject(new Error('試算表 套件下載失敗，請確認網路'));
    document.head.appendChild(script);
  }).catch(err=>{historyXlsxPromise=null;throw err});
  return historyXlsxPromise;
}
function historyExcelColumns(kind){
  if(kind==='attendance')return [
    ['attNo','考勤號'],['empId','工號'],['name','姓名'],['dept','部門'],['jobTitle','職稱'],['timeStr','考勤時間'],['status','出勤狀態'],['location','地點'],['note','備註']];
  if(kind==='schedule')return [['empId','工號'],['name','姓名'],['group','組別'],['role','職稱'],
    ...Array.from({length:31},(_,i)=>['d'+(i+1),String(i+1)])];
  return [['vesselName','船名'],['voyage','航次'],['workingNo','WORKING NO'],['firstDate','開始'],
    ['lastDate','結束'],['disc','卸船櫃數'],['load','裝船櫃數'],['totalContainers','請款櫃數'],['hatches','艙蓋 H/C'],['shiftMoves','翻艙 SHIFT'],['totalMoves','總 Moves'],['aqcCount','AQC台數'],['gph','GPH'],['gphHC','GPH含H/C'],['vph','VPH'],['vphHC','VPH含H/C'],['wharf','碼頭']];
}
function historyAttendanceTime(r){
  const raw=String(recordTime(r)||''),m=raw.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[ T](\d{1,2}):(\d{2})/);
  return m?m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0')+' '+m[4].padStart(2,'0')+':'+m[5]:raw;
}
function historyNormalizeExcelRow(r,kind){
  if(kind==='attendance')return {
    timeStr:historyAttendanceTime(r),empId:r.empId||r.employeeId||'',
    name:r.name||r.employeeName||'',dept:r.dept||r.department||'',jobTitle:r.jobTitle||r.deptDetail||r.role||'',
    status:r.status||r.type||r.action||'',location:r.location||r.place||r.address||'',
    note:r.note||r.remark||'',attNo:r.attNo||'',id:r.id||'',source:r.source||''};
  if(kind==='schedule'){const month=historyLoaded?.month||$('month').value;const report=window.P79HistorySchedule.model([r],month),r0=report.rows[0];const v={empId:r0?.empId||'',name:r0?.name||'',group:r0?.group||'',role:r0?.role||''};for(let i=1;i<=window.P79HistorySchedule.days(month);i++)v['d'+i]=r0?.values[i-1]||'';return v}
  if(kind==='vessel'){
    const number=(...keys)=>{const v=keys.map(k=>r[k]).find(v=>v!==undefined&&v!==null&&v!=='');if(v===undefined)return '';const n=Number(v);if(!Number.isFinite(n)||n<0)throw Error('船舶數量異常，請重新整理雲端資料後再匯出：'+String(r.workingNo||''));return n;};
    return {...r,vesselName:r.vesselName||r.shipName||r.vessel||r.name||'',voyage:r.voyageE||r.voyageI||r.voyage||r.tfcCodeE||r.tfcCodeI||'',firstDate:r.firstDate||r.startDate||r.startTime||r.beginTime||'',lastDate:r.lastDate||r.endDate||r.endTime||r.finishTime||'',disc:number('disc'),load:number('load'),totalContainers:number('totalContainers','ttlCtnr','TTLCtnr','containerCount'),hatches:number('hatches','sheetHatches'),shiftMoves:number('shiftMoves','sheetShiftMoves'),totalMoves:number('totalMoves','sheetTotalMoves'),aqcCount:number('aqcCount','sheetAqcCount'),gph:number('gph','shipGph'),gphHC:number('gphHC','shipGphHC'),vph:number('vph','shipVph'),vphHC:number('vphHC','shipVphHC'),wharf:r.wharf||''};
  }
  return r;
}
function historyWorkbookRows(kind,items){
  const cols=historyExcelColumns(kind);
  const ordered=kind==='attendance'?[...(items||[])].sort((a,b)=>historyAttendanceTime(b).localeCompare(historyAttendanceTime(a))):(items||[]);
  return [cols.map(c=>c[1]),...ordered.map(r=>{
    const v=historyNormalizeExcelRow(r,kind);
    return cols.map(([k])=>v[k]??'');
  })];
}
function historySaveExcel(items,kind,month,suffix){
  return historyXlsx().then(XLSX=>{
    const report=kind==='schedule'?window.P79HistorySchedule.model(items,month):null;
    const ws=XLSX.utils.aoa_to_sheet(report?window.P79HistorySchedule.values(report):historyWorkbookRows(kind,items));
    ws['!cols']=report?[{wch:16},{wch:12},{wch:12},{wch:10},{wch:14},...Array.from({length:report.headers.length-5},()=>({wch:8}))]:historyExcelColumns(kind).map(()=>({wch:18}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,kind==='vessel'?'船舶總表':'歷史資料');
    if(kind==='vessel'&&!suffix&&historyLoaded?.type==='vessel'&&historyLoaded.month===month){
      const details=historyLoaded.records||[],keys=[...new Set(details.flatMap(r=>Object.keys(r)))],labels={id:'ID',empId:'工號',name:'姓名',workingNo:'WORKING NO',vessel:'船名',shipName:'船名主檔',voyageI:'航次I',voyageE:'航次E',workDate:'日期',shift:'時段',startTime:'開始時間',endTime:'結束時間',containers:'櫃數',disc:'卸船櫃數',load:'裝船櫃數',hatches:'艙蓋數',note:'備註',wharf:'碼頭'};
      const detailRows=[keys.map(k=>labels[k]||k),...details.map(r=>keys.map(k=>r[k]&&typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??''))];
      const detailSheet=XLSX.utils.aoa_to_sheet(detailRows);detailSheet['!cols']=keys.map(()=>({wch:18}));XLSX.utils.book_append_sheet(wb,detailSheet,'作業明細');
    }
    XLSX.writeFile(wb,'PORT79_'+({attendance:'考勤歷史',schedule:'排班歷史',vessel:'船舶歷史'}[kind])+'_'+month+suffix+'.xlsx');
  });
}
function historyExcelKey(r){return [String(r.id||'').trim(),String(r.empId||'').trim().toUpperCase(),String(r.timeStr||'').trim(),String(r.status||'').trim()].join('|')}
function historyPreviewImport(items,kind,month){
  const box=$('historyImportPreview');const existing=historyLoaded?.type===kind&&historyLoaded?.month===month?historyLoaded.rows:[];
  const keys=new Set(existing.map(r=>historyExcelKey(historyNormalizeExcelRow(r,kind))));
  const unique=new Set();let repeated=0,invalid=0,wrongMonth=0;const candidates=[];
  for(const item of items){
    const row=historyNormalizeExcelRow(item,kind),key=historyExcelKey(row);
    if(kind==='attendance'){
      if(!row.empId||!row.timeStr||!row.status){invalid++;continue}
      const ym=String(row.timeStr).replaceAll('/','-').slice(0,7);
      if(ym!==month){wrongMonth++;continue}
    }
    if(unique.has(key)||keys.has(key)){repeated++;continue}
    unique.add(key);candidates.push(row);
  }
  box.hidden=false;
  box.innerHTML='<strong>歷史資料匯入核對｜'+esc(month)+'</strong>'+
    '<p>來源 '+items.length+' 筆｜重複 '+repeated+' 筆｜欄位不完整 '+invalid+' 筆｜非本月份 '+wrongMonth+' 筆｜待確認 '+candidates.length+' 筆</p>'+
    '<p><b>安全保護：</b>這裡只預覽與比對，不會寫入 Google Drive，也不會刪除或覆蓋歷史原始紀錄。正式匯入須先部署具權限驗證的 GAS 寫入 API。</p>'+
    '<button type="button" id="historyClosePreview">關閉預覽</button>';
  $('historyClosePreview').onclick=()=>{box.hidden=true};
}

function session(){
  let active=null,admin=null;
  try{active=JSON.parse(sessionStorage.getItem('port79_user_session')||'null')}catch(e){}
  try{admin=JSON.parse(sessionStorage.getItem('admin_session')||'null')}catch(e){}
  const role=String(admin?.adminRole||admin?.role||'').toLowerCase();
  const token=String(sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_gc_token')||'').trim();
  // 僅在同一工號且已有管理員登入權杖時，修復被打卡頁覆蓋的共用 Session。
  if(admin&&token&&['admin','superadmin'].includes(role)&&
     String(admin.empId||'').trim().toUpperCase()===String(active?.empId||'').trim().toUpperCase()){
    if(!['admin','superadmin'].includes(String(active?.adminRole||active?.role||'').toLowerCase())){
      try{sessionStorage.setItem('port79_user_session',JSON.stringify(admin))}catch(e){}
      return admin;
    }
  }
  return active||admin;
}
function perms(){const s=session(),r=String(s?.adminRole||s?.role||'').toLowerCase(),p=s?.systemPermissions||{},f=s?.finePermissions?.history||{};if(r==='superadmin')return{level:'manage',attendance:true,schedule:true,vessel:true};const level=String(p.history||'none');return{level,attendance:!!f['attendance.view'],schedule:!!f['schedule.view'],vessel:!!f['vessel.view']}}
function token(){return String(sessionStorage.getItem('port79_gc_superadmin_token')||sessionStorage.getItem('port79_admin_token')||sessionStorage.getItem('port79_gc_token')||sessionStorage.getItem('port79_user_token')||'').trim()}
function gas(){return String(sessionStorage.getItem('port79_gas_url')||GAS_DEFAULT).trim()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(v==null)return '';if(typeof v==='object')return JSON.stringify(v);return String(v)}
async function api(action,params={},options={}){const u=new URL(gas()),tk=token();u.searchParams.set('action',action);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));if(tk){u.searchParams.set('token',tk);u.searchParams.set('gcToken',tk)}u.searchParams.set('_',Date.now());return window.P79HistoryRead.read(u.toString(),{forceCloud:options.forceCloud===true})}
function currentMonth(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function setStatus(s){$('status').textContent=s}
function pills(items){$('stats').innerHTML=items.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}
let progressTimer=null,progressValue=0,progressStartedAt=0;
function progressPhase(p){if(p<18)return['建立雲端連線…','正在連接 Google Apps Script'];if(p<40)return['尋找年度檔案…','正在定位 Google Drive 年度試算表'];if(p<68)return['讀取月份資料…','正在讀取月份分頁與船舶／人員明細'];if(p<90)return['整理資料…','正在解析欄位、合併摘要與明細'];return['完成前檢查…','正在準備顯示資料']}
function paintProgress(p,text,detail){progressValue=Math.max(0,Math.min(100,Math.round(p)));$('progressBox').classList.add('show');$('progressFill').style.width=progressValue+'%';$('progressPct').textContent=progressValue+'%';const phase=progressPhase(progressValue);$('progressText').textContent=text||phase[0];$('progressDetail').textContent=detail||phase[1]}
function startProgress(month){if(progressTimer)clearInterval(progressTimer);progressValue=5;progressStartedAt=Date.now();paintProgress(progressValue,'開始讀取 '+month,'準備向 Google Drive 讀取資料');progressTimer=setInterval(()=>{const elapsed=Date.now()-progressStartedAt;let target=8+Math.min(82,Math.floor(elapsed/260));if(target>90)target=90;if(target>progressValue)paintProgress(target)},260)}
function finishProgress(ok,detail){if(progressTimer){clearInterval(progressTimer);progressTimer=null}paintProgress(ok?100:progressValue,ok?'讀取完成':'讀取失敗',detail||'');if(ok)setTimeout(()=>{$('progressBox').classList.remove('show')},1400)}
function table(cols,rows){if(!rows.length){$('result').innerHTML='<div class="empty">這個月份沒有資料</div>';return}$('result').innerHTML=`<table><thead><tr>${cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(fmt(typeof c.get==='function'?c.get(r):r[c.key]))}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function recordTime(r){const v=r.timeStr??r.datetime??r.dateTime??r.timestamp??r.time??r.fullTime??r.attendanceTime??r.clockTime??r['完整考勤時間']??r['考勤時間']??'';if(v instanceof Date)return v.toLocaleString('zh-TW',{hour12:false});return v}
async function loadAttendance(month,forceCloud=false){const d=await api('historyGetMonthData',{type:'attendance',month},{forceCloud}),rows=d.records;if(!Array.isArray(rows)||d.month&&d.month!==month)throw Error('考勤歷史未完整讀取或月份不符，請重新讀取');historyLoaded={type:'attendance',month,rows};$('historyExportExcel').disabled=false;pills([`${month}`,`${rows.length} 筆考勤`,d.sourceLabel||'Google Drive']);table([{label:'工號',get:r=>r.empId||r.employeeId||r.id||''},{label:'姓名',get:r=>r.name||r.employeeName||''},{label:'部門',get:r=>r.dept||r.department||''},{label:'日期/時間',get:recordTime},{label:'狀態',get:r=>r.type||r.status||r.action||''}],rows)}
async function loadSchedule(month,forceCloud=false){const d=await api('historyGetMonthData',{type:'schedule',month},{forceCloud});if(!Array.isArray(d.schedules)||String(d.month||month)!==month)throw Error('歷史班表月份不符或尚未讀取完整');const rows=d.schedules,report=window.P79HistorySchedule.model(rows,month);historyLoaded={type:'schedule',month,rows};$('historyExportExcel').disabled=false;pills([month,`${report.rows.length} 名人員班表`,d.sourceLabel||'Google Drive']);$('result').innerHTML=window.P79HistorySchedule.html(report)}
async function loadVessel(month,forceCloud=false){
  const d=await api('historyGetMonthData',{type:'vessel',month},{forceCloud}),masters=Array.isArray(d.shipMasters)?d.shipMasters:[],records=Array.isArray(d.records)?d.records:[];
  pills([month,`${masters.length} 艘船舶`,`${records.length} 筆作業明細`,d.sourceLabel||'Google Drive']);
  const rows=masters.map(r=>historyNormalizeExcelRow(r,'vessel'));historyLoaded={type:'vessel',month,rows,records};$('historyExportExcel').disabled=false;
  table(historyExcelColumns('vessel').map(([key,label])=>({label,get:r=>r[key]??''})),rows)
}
async function load(requireFresh=false){historyLoaded=null;$('historyExportExcel').disabled=true;$('historyImportPreview').hidden=true;const m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))return;setStatus(`讀取 ${m} 中…`);$('loadBtn').disabled=true;startProgress(m);try{if(type==='attendance')await loadAttendance(m,requireFresh);else if(type==='schedule')await loadSchedule(m,requireFresh);else await loadVessel(m,requireFresh);setStatus(requireFresh===true?`${m} 已從雲端重新載入`:`${m} 已完成；下次同月份會優先使用本機保存資料`);finishProgress(true,`${m} 資料已整理完成`)}catch(e){setStatus(`讀取失敗：${e.message||e}`);$('result').innerHTML=`<div class="empty">${esc(e.message||e)}</div>`;finishProgress(false,e.message||String(e));if(requireFresh===true)throw e;}finally{$('loadBtn').disabled=false}}
window.p79RefreshHistoryAll=async()=>{const p=perms();if(p.level==='none'||!p[type]||session()?.punchOnly)throw Error('請先登入並確認歷史資料查詢權限');if(!/^\d{4}-\d{2}$/.test($('month').value))throw Error('請先選擇月份');const oldResult=$('result').innerHTML,oldLoaded=historyLoaded;try{await load(true);}catch(error){$('result').innerHTML=oldResult;historyLoaded=oldLoaded;$('historyExportExcel').disabled=!oldLoaded;throw error;}};
function applyPerms(){const p=perms();document.querySelectorAll('.tab').forEach(b=>{b.disabled=p.level==='none'||!p[b.dataset.type]});const first=[...document.querySelectorAll('.tab')].find(b=>!b.disabled);if(!first){$('loadBtn').disabled=true;const current=session();const punchMode=!!current?.punchOnly;setStatus(punchMode?'目前是「員工打卡模式」，即使帳號為最高管理員也不能查詢歷史資料；請返回首頁使用「管理員登入」並輸入密碼。':'目前登入狀態沒有「歷史資料」查詢權限；請返回首頁確認使用管理員登入，或由權限管理員開啟歷史資料權限。');$('result').innerHTML='<div class="empty">'+(punchMode?'目前使用打卡模式，需先通過管理員驗證。':'請確認管理員登入狀態及歷史資料權限。')+'<div style="margin-top:16px"><a href="../" style="display:inline-block;padding:10px 18px;border-radius:10px;background:#0f172a;color:white;text-decoration:none;font-weight:800">返回首頁・管理員登入</a></div></div>';return}if(document.querySelector('.tab.active')?.disabled){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));first.classList.add('active');type=first.dataset.type}}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;$('panelTitle').textContent=type==='attendance'?'考勤歷史':type==='schedule'?'排班歷史':'船舶歷史';historyLoaded=null;$('historyExportExcel').disabled=true;$('historyImportPreview').hidden=true;$('result').innerHTML='<div class="empty">按「讀取月份」查看資料</div>';pills([]);setStatus('已切換資料類型')}));
$('historyExportExcel').addEventListener('click',async()=>{
  if(!historyLoaded||historyLoaded.type!==type||historyLoaded.month!==$('month').value)return;
  try{await historySaveExcel(historyLoaded.rows,type,historyLoaded.month,'');$('historyExcelMessage').textContent='當月 試算表 已匯出'}
  catch(e){$('historyExcelMessage').textContent='匯出失敗：'+e.message}
});
$('historyExcelTemplate').addEventListener('click',async()=>{
  try{await historySaveExcel([],type,$('month').value||currentMonth(),'_空白格式');$('historyExcelMessage').textContent='範本已匯出'}
  catch(e){$('historyExcelMessage').textContent='範本失敗：'+e.message}
});
$('historyImportExcel').addEventListener('click',()=>{$('historyExcelFile').value='';$('historyExcelFile').click()});
$('historyExcelFile').addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(!historyLoaded||historyLoaded.type!==type||historyLoaded.month!==$('month').value){
    $('historyExcelMessage').textContent='請先讀取要核對的歷史月份';return;
  }
  try{
    const XLSX=await historyXlsx(),wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:false});
    const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
    if(data.length>20000)throw new Error('單次最多核對 20,000 筆');
    const cols=historyExcelColumns(type);
    const mapped=data.map(row=>{const item={};for(const [key,label] of cols)item[key]=row[label]??'';return item});
    historyPreviewImport(mapped,type,historyLoaded.month);
    $('historyExcelMessage').textContent='已完成匯入預覽，尚未寫入雲端';
  }catch(err){$('historyExcelMessage').textContent='匯入核對失敗：'+err.message}
});

let backupAvailable=false,backupBusy=false,backupRequest=null;
function canBackup(){const p=perms(),s=session();return backupAvailable&&p.level==='manage'&&String(s?.adminRole||s?.role||'').toLowerCase()==='superadmin'&&!s?.punchOnly;}
async function checkBackup(){
  try{const p=perms();if(p.level!=='manage'||session()?.punchOnly)return;const tk=token(),endpoint=gas();const d=await api('historyBackupCapabilities');if(token()!==tk||gas()!==endpoint)return;backupAvailable=d.historyBackupAvailable===true&&d.version===1;$('historyBackupNow').disabled=!canBackup();if(backupAvailable)$('historyBackupStatus').textContent='一次備份所選月份的考勤、班表、船舶；保留原始資料';}
  catch(_){backupAvailable=false;$('historyBackupNow').disabled=true;}
}
function renderBackupResults(batch){
  const box=$('historyBackupStatus'),labels={attendance:'考勤',schedule:'班表',vessel:'船舶'};
  const all=batch.items.every(item=>item.result),failed=batch.items.some(item=>item.error);
  box.textContent=batch.month+' '+(all?'全部備份完成':backupBusy?'整月備份中…':failed?'部分尚未完成，按備份可重試未完成項目':'尚未完成')+'｜';
  for(const item of batch.items){
    const part=document.createElement('span');
    part.textContent=labels[item.type]+'：'+(item.result?Number(item.result.rows||0)+' 筆 ✓ ':item.error?'未完成（'+item.error+'） ':item.running?'備份及核對中… ':'等待備份 ');
    if(item.result){const link=document.createElement('a');link.href=item.result.backupUrl;link.target='_blank';link.rel='noopener';link.textContent='開啟備份';part.appendChild(link);}
    box.appendChild(part);box.appendChild(document.createTextNode('　'));
  }
}
async function backupNow(){
  if(backupBusy||!canBackup())return;
  const month=$('month').value,capturedToken=token(),capturedGas=gas();
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))return;
  const scope=[capturedToken,capturedGas,month].join('|');
  if(!backupRequest||backupRequest.scope!==scope)backupRequest={scope,month,items:['attendance','schedule','vessel'].map(kind=>({type:kind,id:crypto.randomUUID()}))};
  const batch=backupRequest,sameSession=()=>token()===capturedToken&&gas()===capturedGas&&canBackup();
  backupBusy=true;$('historyBackupNow').disabled=true;renderBackupResults(batch);
  try{
    for(const item of batch.items){
      if(!sameSession())throw Error('登入身分已變更，已停止後續備份');
      if(item.result)continue;
      const kind=item.type,requestId=item.id,controller=new AbortController(),timer=setTimeout(()=>controller.abort(),120000);
      item.running=true;item.error='';renderBackupResults(batch);
      try{
        const r=await fetch(capturedGas,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'historyBackupMonth',type:kind,month,requestId,token:capturedToken,gcToken:capturedToken}),cache:'no-store',signal:controller.signal}),d=await r.json();
        if(!r.ok||!d?.ok||d.verified!==true||d.type!==kind||d.month!==month||d.requestId!==requestId||d.sourceUnchanged!==true)throw Error(d?.error||'未取得完整備份確認');
        if(!sameSession())throw Error('登入身分已變更，未套用備份結果');
        const url=new URL(d.backupUrl);if(url.protocol!=='https:'||url.hostname!=='docs.google.com')throw Error('備份檔案連結無法核對');
        item.result=d;
      }catch(error){item.error=String(error?.name==='AbortError'?'逾時；重試會核對同一筆請求':error?.message||error);}
      finally{clearTimeout(timer);item.running=false;}
      if(!sameSession())throw Error('登入身分已變更，已停止後續備份');
      renderBackupResults(batch);
    }
  }catch(error){$('historyBackupStatus').textContent=String(error.message||error);}
  finally{
    backupBusy=false;
    if(sameSession()){renderBackupResults(batch);if(batch.items.every(item=>item.result))backupRequest=null;}
    $('historyBackupNow').disabled=!canBackup();
  }
}
$('historyBackupNow').addEventListener('click',backupNow);
checkBackup();

$('loadBtn').addEventListener('click',load);$('month').value=currentMonth();applyPerms();
})();
</script>

<script id="p79-history-transfer-zh-20261025">

 const names={attendance:'考勤歷史',schedule:'排班歷史',vessel:'船舶歷史'};
