<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>PORT79 | Gate 進出站櫃量匯入</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;background:#f1f6fc;color:#153755}
*{box-sizing:border-box}body{margin:0;padding:22px 14px 45px}
main{max-width:1020px;margin:0 auto}
a{color:#155caa}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
h1{font-size:23px;margin:4px 0 3px}header p{margin:0;color:#617e9b;font-size:13px}
.panel{background:#fff;border:1px solid #d9e7f4;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 3px 13px #4380a10c}
h2{font-size:17px;margin:0 0 11px}
.hint{color:#5e7b97;font-size:13px;line-height:1.7}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:12px 0}
input[type=file],select{font-size:14px;border:1px solid #c8dcef;padding:8px;border-radius:9px;max-width:100%;background:#fff}
button,.action{font-family:inherit;display:inline-block;cursor:pointer;font-size:13px;font-weight:800;padding:9px 14px;border-radius:9px;color:#154d84;background:#eaf4ff;border:1px solid #b7d7ef}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:#1468b8;border-color:#1468b8;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.metric{text-align:center;border:1px solid #e3edf7;border-radius:10px;background:#f6faff;padding:10px}
.metric span{font-size:12px;color:#5d748c;display:block}.metric strong{font-size:21px;color:#174c83}
table{border-collapse:collapse;font-size:12px;width:100%;white-space:nowrap}
th,td{padding:7px 5px;border-bottom:1px solid #e8f1f9;text-align:right}
th{background:#ebf3fb;color:#476d91}th:first-child,td:first-child{text-align:left}
.scroll{overflow:auto;max-width:100%;max-height:410px}
#gateMessage{font-size:13px;line-height:1.6;color:#456884;min-height:22px}
#gateMessage[data-kind="error"]{color:#ac2632}
#gateMessage[data-kind="success"]{color:#18744b}
code{font-family:ui-monospace,monospace;font-size:12px}
@media(max-width:620px){body{padding:12px 8px}h1{font-size:19px}.panel{padding:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:18px}}

html[data-gate-embed="1"]{background:transparent}
html[data-gate-embed="1"] body{background:transparent!important;padding:0!important}
html[data-gate-embed="1"] main{max-width:none!important;width:100%}
html[data-gate-embed="1"] header{display:none!important}
html[data-gate-embed="1"] .panel{box-shadow:none;border-radius:14px;border-color:#deebf6;margin:0 0 12px}
.metric{transition:background-color .15s ease,transform .15s ease}
.metric:nth-child(1){background:#eef5ff;border-color:#bfdbfe}.metric:nth-child(1) strong{color:#1d4ed8}
.metric:nth-child(2){background:#e8fafc;border-color:#a5e9f2}.metric:nth-child(2) strong{color:#0e7490}
.metric:nth-child(3){background:#fff4e9;border-color:#fed7aa}.metric:nth-child(3) strong{color:#c2410c}
.metric:nth-child(4){background:#f5efff;border-color:#d8b4fe}.metric:nth-child(4) strong{color:#7e22ce}
.metric:nth-child(5){background:#eaf2ff;border-color:#bfdbfe}.metric:nth-child(5) strong{color:#1e40af}
.metric:nth-child(6){background:#e7f8ef;border-color:#a7f3d0}.metric:nth-child(6) strong{color:#047857}
tbody tr:hover{background:#edf6ff}tbody td:nth-child(6){font-weight:800;color:#1e40af}
tbody td:last-child{font-weight:750;color:#047857}
#gateMessage[data-kind="error"]{background:#fff6ed;border:1px solid #fed7aa;border-radius:9px;padding:9px 11px;color:#9a3412}
#gateMessage[data-kind="success"]{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:9px 11px;color:#065f46}
</style>
<script>
(function(){
 var embedded=new URLSearchParams(location.search).get('embed')==='1';
 if(!embedded){location.replace('../aqc-efficiency/?tab=gate');return;}
 document.documentElement.setAttribute('data-gate-embed','1');
 window.addEventListener('DOMContentLoaded',function(){
  var main=document.querySelector('main');
  if(!main||!window.ResizeObserver||window.parent===window)return;
  var send=function(){window.parent.postMessage({type:'p79-gate-embed-resize',height:Math.ceil(main.getBoundingClientRect().height)},location.origin)};
  new ResizeObserver(send).observe(main);
  send();
 });
})();
</script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script defer src="../assets/port79-gate-import.js?v=20261107-gate-deploy-check-v2"></script>
</head>
<body><main>
<header><div><a href="../">‹ 返回 PORT79 首頁</a><h1>🚛 Gate 進出站櫃量 Excel 匯入</h1><p>按日期保存交空、領空、交重、領重、進站拖車車次</p></div><a href="https://docs.google.com/spreadsheets/d/19umma1xq4XCLm68Wzkk-OvcRkKdZ1V88x238djXNiHc/edit" target="_blank" rel="noopener noreferrer" class="action">開啟正式 Google 資料庫</a></header>
<section class="panel">
<h2>1. 選擇檔案</h2>
<p class="hint">選擇 Gate Excel，系統自動彙整交空、領空、交重、領重及拖車車次。相同日期會更新，不會重複累計。</p>
<div class="controls"><input type="file" id="gateFile" accept=".xlsx,.xls,.csv" aria-label="選擇 Gate Excel 或 CSV"><label for="gateSheet">工作表</label><select id="gateSheet" aria-label="選擇 Gate 報表工作表" disabled></select><button type="button" id="gatePreview" disabled>開始預覽</button></div>
<p id="gateMessage" role="status" aria-live="polite">請先選擇檔案。</p>
</section>
<section class="panel" id="gateResult" hidden>
<h2>2. 檢查每日進出櫃量</h2>
<div class="grid">
<div class="metric"><span>交空櫃</span><strong id="gateDe">—</strong></div>
<div class="metric"><span>領空櫃</span><strong id="gatePe">—</strong></div>
<div class="metric"><span>交重櫃</span><strong id="gateDl">—</strong></div>
<div class="metric"><span>領重櫃</span><strong id="gatePl">—</strong></div>
<div class="metric"><span>總櫃量</span><strong id="gateTotal">—</strong></div>
<div class="metric"><span>進站拖車</span><strong id="gateTruck">—</strong></div>
</div>
<p class="hint" id="gateRange"></p>
<div class="scroll"><table><thead><tr><th>日期</th><th>交空</th><th>領空</th><th>交重</th><th>領重</th><th>總櫃量</th><th>拖車車次</th></tr></thead><tbody id="gatePreviewRows"></tbody></table></div>
<div class="controls">
<button type="button" class="primary" id="gateSave" disabled title="需先驗證正式 Google Apps Script 的 Gate 匯入接口">寫入正式資料</button>
<button type="button" id="gateDownload">下載 CSV</button>
<a href="https://docs.google.com/spreadsheets/d/19umma1xq4XCLm68Wzkk-OvcRkKdZ1V88x238djXNiHc/edit" target="_blank" rel="noopener noreferrer" class="action">查看每日資料</a>
</div>
<p class="hint">尚未啟用雲端匯入時，可先下載 CSV，或到資料庫更新每日紀錄。</p>
</section>

</main></body></html>
